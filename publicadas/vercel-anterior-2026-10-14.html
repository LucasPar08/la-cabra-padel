/* La ficha de un partido de pádel no es el marcador: es quién tuvo la red,
   cuántos puntos de oro cayeron de cada lado y cuántas veces se rompió. */
function cardPartido(j, p){
  const yo = p.gane;
  const sets = p.sets.map(s=>s.split('-').map(Number));
  const linea = quien => sets.map(par=>{
    const a = par[0], b = par[1], mio = quien==='yo', v = mio?a:b;
    return `<s class="${(mio ? a>b : b>a) ? 'g' : ''}">${v}</s>`;
  }).join('');
  const oros = (p.oros||[]).length;
  const orosG = (p.oros||[]).filter(Boolean).length;
  const red = Math.round((p.red!=null?p.red:0.5)*100);
  const colRed = red>=55?'var(--bien)':red>=45?'var(--text)':'var(--danger)';
  return `<div class="match fade">
    <div class="rd">${p.ronda}${p.previa?' · CUADRO DE CLASIFICACIÓN':''}${p.partidoEnPista ? ' · 🎾 PARTIDO EN LA PISTA' : p.clave ? (p.clave.forma==='tiempo' ? ' · ⚡ RÁFAGA' : p.clave.forma==='leer' ? ' · 👀 PUNTO LEÍDO' : p.clave.forma==='camino' ? ' · 🧩 CAMINO ELEGIDO' : (p.clave.tipo==='punto' ? ' · 🥇 PUNTO CLAVE' : ' · 🔥 JUEGO CLAVE') + (p.clave.enVivo ? ' EN LA PISTA' : '')) : ''}</div>
    <div class="mrow ${yo?'win':'lose'}">
      <span class="dot"></span><span class="nm">${fichaPais(j.cod)} ${esc(j.nombre)} / ${esc(j.pareja?j.pareja.nombre:'—')}</span>
      <span class="rk">${j.ranking?'#'+j.ranking:'—'}</span>
      <span class="sc">${linea('yo')}</span>
    </div>
    <div class="mrow ${yo?'lose':'win'}">
      <span class="dot"></span><span class="nm">${fichaPais(p.opp.flag)} ${esc(p.opp.nombre)} / ${esc(p.opp.nombre2)}</span>
      <span class="rk">#${p.opp.rank}</span>
      <span class="sc">${linea('el')}</span>
    </div>
    ${p.vivo ? fichaVivo(p) : p.puntos && p.red != null ? `<div class="fp">
      <div><span>La red fue vuestra</span><b style="color:${colRed}">${red}% de los puntos</b>
        <span class="barrared"><i style="width:${red}%"></i><u style="width:${100-red}%"></u></span></div>
      <div><span>Puntos de oro</span><b style="color:${orosG*2>=oros?'var(--bien)':'var(--danger)'}">${orosG} de ${oros}</b></div>
      <div><span>Roturas</span><b>${p.roturas||0} a favor · ${p.roturasContra||0} en contra</b></div>
      <div><span>Salidas de pista</span><b>${p.salidas ? '🚪 '+p.salidas : '—'}</b></div>
    </div>` : ''}
  </div>`;
}

  if(S.eventoRes){
    const tr = S.tirada;
    const rodando = tr && tr.rodando;
    const cartaDado = tr ? `<div class="card dado-card ${rodando ? 'rodando'
        : tr.critBien?'crit-bien' : tr.critMal?'crit-mal' : tr.exito?'ok':'ko'}">
      <div class="dado-fila">
        <span class="dado"><span>${rodando ? '&nbsp;' : tr.d}</span></span>
        <div style="flex:1;min-width:0">
          <div class="eyebrow" style="margin:0">TIRADA · D16</div>
          <div class="dado-txt">${rodando ? `NECESITAS ${tr.obj} O MÁS…`
            : tr.critBien ? '¡16 NATURAL!' : tr.critMal ? 'PIFIA · 1 NATURAL'
            : `SACASTE ${tr.d} · NECESITABAS ${tr.obj}`}</div>
        </div>
        ${rodando ? '' : `<span class="pill ${tr.critBien?'gold':tr.exito?'acc':'mal'}">${tr.exito?'BIEN':'MAL'}</span>`}
      </div>
    </div>` : '';

    /* Mientras el dado rueda no se enseña el desenlace: se ve el problema pero
       no cómo acabó. Eso es la mitad de la gracia de tirar. */
    if(rodando){
      return `<div class="fade">
      ${cartaDado}
      <div class="card ${e.mal?'event-hero mal':'event-hero'}">
        <div class="eyebrow">${e.mal?'PROBLEMA':'DECISIÓN'}</div>
        <div class="title-lg" style="margin:5px 0 6px">${e.tit}</div>
        <p class="sub" style="margin:0;opacity:.5">${e.txt}</p>
      </div></div>`;
    }

    return `<div class="fade">
    ${cartaDado}
    <div class="card ${e.mal?'event-hero mal':'event-hero'}">
      <div class="eyebrow">${e.mal?'PROBLEMA':'DECISIÓN'}</div>
      <div class="title-lg" style="margin:5px 0 6px">${e.tit}</div>
      <p class="sub" style="margin:0">${S.eventoRes}</p>
      ${j.animo && j.animo.n>0 ? `<div class="log ${j.animo.val>0?'':'bad'}" style="margin:10px 0 0">${textoAnimo(j)}</div>` : ''}
    </div>
    <button class="btn" onclick="cerrarEvento()">CONTINUAR</button></div>`;
  }
  return `<div class="fade">
  <div class="card ${e.mal?'event-hero mal':'event-hero'}">
    <div class="eyebrow">${e.mal?'PROBLEMA':'DECISIÓN'}</div>
    <div class="title-lg" style="margin:5px 0 6px">${e.tit}</div>
    <p class="sub" style="margin:0">${e.txt}</p>
  </div>
  <div class="card">
    <div class="eyebrow">¿QUÉ HACES?</div><div style="height:8px"></div>
    ${e.ops.map((o,i)=>`<button class="opt" onclick="elegirEvento(${i})">
      <span class="ic">${i===0?'①':'②'}</span>
      <span style="flex:1;min-width:0">
        <span class="t">${txtG(o.t)}</span>
        ${o.d?`<span class="d">${txtG(o.d)}</span>`:''}
        ${(function(){
          const obj = objetivoTirada(j, o);
          if(obj === null) return '<span class="d" style="margin-top:5px;color:var(--muted)">Sin tirada: pasa lo que dice.</span>';
          const pc  = Math.round(probOpcion(j, o)*100);
          const col = pc>=70?'var(--bien)':pc>=45?'var(--gold)':'var(--danger)';
          const v   = Math.round(valorDe(j, o.stat));
          const mod = modificador(v);
          return `<span class="tirada-info">
            <span class="objetivo" style="color:${col};border-color:${col}">${obj}+</span>
            <span style="flex:1;min-width:0">
              <span class="d" style="color:${col};font-weight:800">Necesitas sacar ${obj} o más en el d16 · ${pc}%</span>
              <span class="d" style="margin-top:2px">
                🎲 ${STAT_NOM[o.stat] || NOM_RECURSO[o.stat] || 'Suerte'} <b>${v}</b>
                ${mod === 0 ? '· ni te ayuda ni te estorba'
                  : mod > 0 ? `· te baja <b>${mod}</b> el número que necesitas`
                            : `· te sube <b>${-mod}</b> el número que necesitas`}
              </span>
            </span>
          </span>`;
        })()}
      </span>
    </button>`).join('')}
    <p class="muted" style="margin:8px 0 0">Se tira un dado de 16 caras. Un <b>16 natural</b> siempre entra y sale aún mejor; un <b>1 natural</b> siempre falla y sale aún peor. Lo que pase te lo llevas al trimestre siguiente.</p>
  </div></div>`;
}

/* ── EL CUADRO (Majors) ── */
function vCuadro(){
  const c = S.cuadro, j = S.j;
  let h = `<div class="fade">
  <div class="card momento-cab">
    <div class="momento-top">${emblemaSede(c.ev)}<div style="min-width:0;flex:1"><div class="eyebrow">MAJOR · CUARTOS DE FINAL</div><div class="momento-ev">${esc(c.ev.nom)}</div></div>${pastillaPista(c.ev.pista)}</div>
    <div class="momento-tit">${ico('camino')}<span>EL CUADRO</span></div>
    <p class="sub" style="margin:0">${c.rondas.length === 3 ? 'Tres partidos para el título.' : 'Cuartos y semifinal: si pasáis, <b>la final se juega en la pista</b>.'} <b>Cada casilla es un partido</b>: detrás de algunas está la pareja que os saca. Cuanto más nivel le saquéis a la dupla rival, más caminos seguros; y con <b>Mental</b> alto los ves venir.</p>
    ${c.vidasIniciales ? `<div class="hr"></div>
    <div style="display:flex;align-items:center;gap:9px">
      <span class="vida-ico ${c.vidas>0?'':'sin'}">${ico('escudo')}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:13.5px;color:${c.vidas>0?'var(--bien)':'var(--danger)'}">
          ${c.vidas>0 ? (c.vidas===1?'Te queda una bola de partido':'Te quedan '+c.vidas+' bolas de partido') : 'Sin margen: el próximo error os elimina'}</div>
        <div class="muted" style="font-size:12px">Un error no os echa del torneo: podéis salvar ${c.vidasIniciales===1?'una bola de partido':c.vidasIniciales+' bolas de partido'} y seguir en la misma ronda.${S.j.equipo.psico?' Tu psicólog@ os da una de más.':''}</div>
      </div>
    </div>` : ''}
  </div>
  ${c.salvada ? `<div class="log gold">🛡️ <b>¡Bola de partido salvada!</b> Ibais fuera y la habéis levantado. Ese camino ya sabéis que no es: elegid otro.</div>` : ''}`;

  c.rondas.forEach((r, k)=>{
    const activa = !c.terminado && k === c.actual;
    const pasada = r.elegida !== null;
    const futura = !activa && !pasada;
    h += `<div class="card" style="${futura?'opacity:.4':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div class="eyebrow">${r.nom}</div>
        <span class="muted" style="font-size:11px">${fichaPais(r.opp.flag)} ${esc(r.opp.nombre)} / ${esc(r.opp.nombre2)} · #${r.opp.rank}${r.opp.arq?' · '+esc(r.opp.arq.nom):''}</span>
      </div>
      <div style="height:9px"></div>
      <div class="cuadro">`;
    const fall = r.falladas || [];
    for(let i=0;i<r.casillas;i++){
      const esMina = r.minas.indexOf(i) >= 0;
      const marcada = r.pista === i;
      const yaFallada = fall.indexOf(i) >= 0;
      let cls = 'casilla', txt = '?';
      if(pasada){
        if(i === r.elegida){ cls += esMina ? ' mala' : ' buena'; txt = esMina ? '✖' : '✔'; }
        else { cls += ' revelada'; txt = esMina ? '✖' : ''; }
      } else if(activa){
        if(yaFallada){ cls += ' mala revelada'; txt = '✖'; }
        else {
          cls += ' activa';
          if(marcada){ cls += ' avisada'; txt = '❗'; }
        }
      }
      const pulsable = activa && !yaFallada;
      h += `<button class="${cls}" ${pulsable?`onclick="elegirCasilla(${i})"`:'disabled'}>${txt}</button>`;
    }
    h += `</div>`;
    if(activa){
      /* La probabilidad se recalcula con lo que queda vivo: los caminos ya
         quemados y el que te marcó el Mental salen de la cuenta. */
      const minasVivas  = r.minas.length - fall.length;
      const quedan      = r.casillas - fall.length;
      const avisoVivo   = r.pista !== null && fall.indexOf(r.pista) < 0;
      const elegibles   = Math.max(1, quedan - (avisoVivo ? 1 : 0));
      const seguros     = quedan - minasVivas;
      const pc = Math.round(100 * pasarRondaCuadro(r, c.vidas).reduce((a, x) => a + x, 0));   // exacto, con las bolas de partido que os quedan
      const col = pc>=70?'var(--bien)':pc>=45?'var(--gold)':'var(--danger)';
      h += `<div style="height:11px"></div>${probTV(pc, 'de pasar')}
      <p class="muted" style="margin:7px 0 0">${quedan} camino${quedan===1?'':'s'} por probar, ${minasVivas===0?'ninguno os elimina':minasVivas===1?'uno os elimina':minasVivas+' os eliminan'}${avisoVivo?' (uno ya lo has visto venir)':''}${c.vidas>0?` · ${ico('escudo')} ${c.vidas} bola${c.vidas===1?'':'s'} de partido en la recámara, ya contadas en el %`:''}. Elige.</p>`;
      if(avisoVivo) h += `<div class="log" style="margin:8px 0 0">${ico('mente')} Tu <b>Mental (${Math.round(j.stats.mental)})</b> te avisa: por <b>ahí no</b>. Ese camino os saca del torneo.</div>`;
    }
    h += `</div>`;
  });

  if(c.terminado){
    h += `<div class="card ${c.gano?'event-hero':'event-hero mal'}">
      <div class="title-xl" style="margin:2px 0 8px">${c.gano ? (c.rondas.length < 3 ? '¡A LA FINAL!' : gx('¡CAMPEÓN!','¡CAMPEONA!')) : 'SE ACABÓ'}</div>
      <p class="sub" style="margin:0">${c.gano
        ? c.rondas.length < 3 ? 'Estáis en la final del Major. <b>La final se juega en la pista.</b>' : `Ganasteis <b>${esc(c.ev.nom)}</b>. ${paisDe(j).nom} enter${paisDe(j).nom.endsWith('a')?'a':'o'} os vio levantar ese trofeo. Nada vuelve a ser igual.`
        : (c.actual===0 ? 'Caísteis en cuartos. El cuadro no perdona.' : c.actual===1 ? 'Caísteis en semifinales. Tan cerca y tan lejos.'
                        : 'Perdisteis la final. Vas a soñar con esa bola durante años.')}</p>
    </div>
    <button class="btn" onclick="cerrarCuadro()">CONTINUAR</button>`;
  }
  return h + `</div>`;
}

/* Sale el escenario de tu mejor arma */
function elegirEscenario(j){
  const st = j.stats;
  const cand = [['remate',st.remate],['volea',st.volea],['pared',st.pared],['globo',st.globo],['bandeja',st.bandeja]];
  cand.sort((a,b)=>b[1]-a[1]);
  return ESCENARIOS[cand[0][0]];
}

/* Probabilidades reales de cada golpe. La pantalla usa esta misma función,
   así que lo que ves no puede mentirte. */
function probsGolpe(j, d, o){
  const s = j.stats;
  const gan = o.gan(s), err = o.err(s);
  const sigue = Math.max(0, 1 - gan - err);
  const base = clamp(d.pBase + (o.delta||0), 0.05, 0.95);
  return {gan, err, sigue, base, total: gan + sigue*base};
}

function crearDuelo(j, ev, parcial, ronda, contexto){
  const T = TIERS[ev.t];
  if(ronda == null) ronda = T.rondas-2;
  const esFinal = (ronda === T.rondas-1);
  const opp = contexto==='mundial' ? generarRival('P1', 4, 6) : generarRival(ev.t, ronda, T.rondas);
  const miR = ratingDupla(j, ev.pista, ev);
  /* Un punto de oro se juega con los nervios de los dos lados. Quien ha
     llegado hasta aquí merece salir con ventaja, no con una moneda al aire. */
  const pBase = clamp(0.56 + (miR - opp.rating)*0.04 + difActual().eleccion, 0.32, 0.92);
  const rondaNom = contexto==='mundial' ? RONDAS_MUNDIAL[Math.min(j.mundialRonda,3)].nom
                 : esFinal ? 'FINAL' : 'SEMIFINAL';
  const titulo = contexto==='mundial' ? 'Punto de oro por tu país'
               : esFinal ? 'Punto de oro por el título' : 'Punto de oro por la final';
  const situacion = contexto==='mundial'
    ? `Un set para cada pareja, 5-5 en el tercero y punto de oro al resto. Si esto entra, ${paisDe(j).nom} sigue en el Mundial.`
    : esFinal
      ? `Un set para cada pareja. 5-5 en el tercero, iguales, <b>punto de oro</b>. El que lo gane se lleva ${esc(ev.nom)}.`
      : `6-4 para ellos, 6-3 para vosotros. 5-5 en el tercero y punto de oro. Quien lo gane, juega la final.`;
  return { ev, parcial, ronda, esFinal, opp, esc: elegirEscenario(j), pBase,
           titulo, situacion, rondaNom, contexto: contexto||null, resultado:null };
}

        const v = Math.round(j.stats[o.usa]);
        const fuerte = v >= 72;
        const pr = probsGolpe(j, d, o);
        const pc = Math.round(pr.total*100);
        const col = pc>=60?'var(--bien)':pc>=45?'var(--gold)':'var(--danger)';
        return `<button class="opt ${(leeElPunto && i===mejor)?'on':''}" onclick="resolverDuelo(${i})">
          <span class="ic">${o.ic}</span>
          <span style="flex:1;min-width:0">

            <span class="d">${o.d}</span>
            <span class="d" style="margin-top:4px;color:${fuerte?'var(--accent)':'var(--muted)'}">
              🏓 Depende de tu <b>${STAT_NOM[o.usa].toUpperCase()} (${v})</b>${fuerte?' — es de lo mejor que tienes':''}
            </span>
            <span class="prob">
              <span class="barra"><i style="width:${pc}%"></i></span>
              <span class="cifra" style="color:${col}">${pc}% de ganar el punto</span>
            </span>
            <span class="d" style="margin-top:2px">Winner directo ${Math.round(pr.gan*100)}% · error tuyo ${Math.round(pr.err*100)}% · sigue el punto ${Math.round(pr.sigue*100)}%</span>
          </span>
        </button>`;
      }).join('')}
      <p class="muted" style="margin:8px 0 0">${leeElPunto
        ? 'Tu <b>Mental (' + Math.round(j.stats.mental) + ')</b> te deja leer el punto: ya sabes cuál es tu golpe.'

    </div>`;
  } else {
    h += `<div class="card ${res.gana?'event-hero':'event-hero mal'}">
      <div class="eyebrow">${esc(res.golpe.nom)}</div>
      <div class="title-xl" style="margin:6px 0 8px">${res.gana?(d.esFinal||d.contexto==='mundial'?'🏆 ¡LO GANASTE!':'✅ ¡A LA FINAL!'):'😖 SE TE ESCAPÓ'}</div>

      <div class="hr"></div>
      <p class="sub" style="margin:0">${res.gana
        ? (d.contexto==='mundial' ? `${paisDe(j).nom} gana la eliminatoria. Te sacan en volandas de la pista.`

  }
  return h + `</div>`;
}

function calcularLegado(j){
  const mj = j.titulos.filter(t=>t.tier==='MJ').length;
  const p1 = j.titulos.filter(t=>t.tier==='P1'||t.tier==='FIN').length;
  const prem = j.titulos.filter(t=>t.tier==='P2').length;
  const best = j.mejorRank || 2000;
  let pts = 0;
  /* Rendimientos decrecientes, y a propósito. El primer Major vale muchísimo;
     el trigésimo, casi nada. Si cada trofeo sumara lo mismo, el legado medía
     cuántos años estuviste arriba en vez de lo buen@ que llegaste a ser, y una
     carrera de 9 Majors quedaba por debajo de otra de 40 mucho más gris. */
  const escalonado = (n, valor) => n > 0 ? Math.pow(n, 0.72) * valor : 0;
  pts += escalonado(mj, 17) + escalonado(p1, 8) + escalonado(prem, 4)
       + escalonado(j.titulos.length, 2);
  /* Llegar al top 100 del mundo en cualquier deporte ya es una carrera. La
     escala tiene que reconocerlo, o media tabla acaba etiquetada de fracaso. */
  pts += best<=1 ? 50 : best<=3 ? 38 : best<=10 ? 28 : best<=25 ? 20 : best<=50 ? 14
       : best<=100 ? 10 : best<=200 ? 7 : best<=350 ? 5 : best<=700 ? 2 : 0;
  pts += (j.mundialCopas||0)*10 + Math.min(10, (j.mundial||0));
  pts += Math.min(12, Math.round(j.pg/60));
  /* Aguantar quince años viviendo de esto también es una carrera, aunque no
     haya vitrina que enseñar. */
  pts += Math.min(8, Math.round(j.anio/2.5));
  let rango, txt;
  if(pts >= 480){ rango = 'LA CABRA 🐐'; txt = 'No hay discusión posible. Cuando alguien diga «el mejor de la historia», va a decir tu nombre y nadie va a levantar la mano.'; }
  else if(pts >= 240){ rango = 'LEYENDA'; txt = 'Una de las grandes carreras que ha dado este deporte. Los críos aprenden tus golpes en YouTube.'; }
  else if(pts >= 110){ rango = 'ENORME CARRERA'; txt = 'Estuviste arriba de verdad, ganaste cosas grandes y te ganaste el respeto de todo el vestuario.'; }
  else if(pts >= 45){ rango = 'CARRERA SÓLIDA'; txt = 'Viviste del pádel, jugaste los torneos grandes y ganaste títulos. Muy poca gente puede decir eso.'; }
  else if(pts >= 12){ rango = 'PROFESIONAL'; txt = 'Fuiste jugador@ profesional de pádel. Suena poco hasta que piensas cuánta gente lo intenta y no llega.'; }
  else { rango = 'LO INTENTASTE'; txt = 'No llegó a cuajar. Pero estuviste ahí, viajando y compitiendo, cuando casi todos tus amigos lo dejaron a los veinte.'; }
  return {pts, rango, txt, mj, p1, prem, best};
}

function continuarPartida(){
  asegurarCarreras();
  const d = cargar();
  if(!d || !d.j){ S.pantalla='inicio'; render(); return; }
  const j = d.j;
  j.mejoras = j.mejoras || []; j.lujos = j.lujos || []; j.parejasHist = j.parejasHist || [];
  // partidas guardadas antes de que existieran estas cuentas
  j.salidasPista = j.salidasPista || 0; j.puntosRed = j.puntosRed || 0; j.puntosTot = j.puntosTot || 0;
  if(j.pareja && !j.pareja.estilo) j.pareja.estilo = pick(Object.keys(ESTILOS));
  j.genero = j.genero || 'M';
  if(j.animo === undefined) j.animo = null;
  if(j.novia === undefined) j.novia = null;
  j.equipo.preparador = !!j.equipo.preparador;
  S.j = j; S.cal = d.cal || generarTemporada(j);
  j.historialTorneos = j.historialTorneos || [];
  S.trim = d.trim || null; S.torneo = d.torneo && !d.torneo.fin ? d.torneo : null; S.verTorneo = S.torneo ? S.torneo.ev : null;
  S.pantalla = j.retirado ? 'retiro' : S.torneo ? 'torneo' : 'temporada';
  if(j.retirado){ S.legado = calcularLegado(j); cerrarIdolo(j); }
  S.msgs = [];
  /* guardada al cerrar la temporada (trimestre 4): empieza la siguiente sin repetir el cierre */
  if(!j.retirado && j.trimestre >= TRIMESTRES_POR_ANIO){ irPretemporada(); return; }
  /* guardada en la pretemporada: se vuelve a ella para no perder los puntos por repartir */
  if(!j.retirado && d.pantalla === 'pretemporada' && d.pre){ S.pre = d.pre; S.pantalla = 'pretemporada'; }
  render();
}

/* — la gira del trimestre — */
/* Las finales de estos torneos no se simulan: las juegas tú.
   Major → el cuadro desde cuartos. P1 y Finals → punto de oro en la final. */
function modoMinijuego(ev){
  if(ev.t === 'MJ') return 'cuadro';
  if(ev.t === 'P1' || ev.t === 'FIN') return 'duelo';
  return null;
}

function jugarTorneo(j, ev, opts){
  opts = opts || {};
  const T = TIERS[ev.t];
  let ronda = opts.desdeRonda || 0;
  const partidos = opts.partidos || [];
  let perfecto = opts.perfecto !== false, remontada = false, lesionado = false;

  /* La previa: dos partidos seguidos el mismo día. No dan puntos, cansan el
     doble y si pierdes uno te vuelves a casa sin haber pisado el cuadro. */
  if(opts.previa){
    for(let k = 0; k < RONDAS_PREVIA; k++){
      const opp = rivalDePrevia(ev);
      const res = simularPartido(j, opp, ev, 0, T.rondas);
      res.previa = true;
      res.ronda = (k===0 ? '1ª DE PREVIA' : '2ª DE PREVIA');
      j.pj++;
      j.orosJugados = (j.orosJugados||0) + res.oros.length;
      j.orosGanados = (j.orosGanados||0) + res.oros.filter(Boolean).length;
      j.salidasPista = (j.salidasPista||0) + (res.salidas||0);
      partidos.push(res);
      // dos partidos el mismo día: el segundo se juega con lo que quede
      j.energia = clamp(res.energia - 7, 0, 100);
      if(!res.gane){
        j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0;
        j.forma = clamp(j.forma - 1.2, -12, 12);
        j.moral = clamp(j.moral - 2, 0, 100);
        /* Caer en la previa no es irse con las manos vacías: el circuito paga
           algo por haber estado, aunque sea la mitad de una primera ronda.
           Sin eso, quien vive de previas no sube nunca y el juego se parte en
           dos: los que entran directo y los que no salen del pozo. */
        const T2 = TIERS[ev.t];
        const f = cerrarFichaTorneo(ev, 0, partidos, false, false, false);
        f.cayoEnPrevia = true;
        f.pts = Math.max(1, Math.round(T2.pts[T2.pts.length-2] * 0.5));
        f.plata = Math.round(T2.prem*0.012);
        f.ronda = 'Previa';
        return f;
      }
      j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
    }
  }

  while(ronda < T.rondas){
    if(opts.pausarEnRonda != null && ronda === opts.pausarEnRonda){
      return {ev, pausaFinal:true, victorias:ronda, partidos, perfecto, remontada, lesionado};
    }
    const opp = generarRival(ev.t, ronda, T.rondas);
    const res = simularPartido(j, opp, ev, ronda, T.rondas);
    j.energia = res.energia;
    j.pj++;
    j.orosJugados = (j.orosJugados||0) + res.oros.length;
    j.orosGanados = (j.orosGanados||0) + res.oros.filter(Boolean).length;
    j.salidasPista = (j.salidasPista||0) + (res.salidas||0);
    j.puntosRed = (j.puntosRed||0) + Math.round((res.red||0)*(res.puntos||0));
    j.puntosTot = (j.puntosTot||0) + (res.puntos||0);
    partidos.push(res);
    if(res.gane){
      j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
      j.forma = clamp(j.forma + (opp.rank < (j.ranking||3000) ? 1.6 : 0.7), -12, 12);
      j.moral = clamp(j.moral + 2, 0, 100);
      const perdioSet = res.sets.some(s=>{ const p = s.split('-').map(Number); return p[0] < p[1]; });
      if(perdioSet) perfecto = false;
      if(res.sets.length === 3){ const p0 = res.sets[0].split('-').map(Number); if(p0[0] < p0[1]) remontada = true; }
      ronda++;
    } else {
      j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0;
      j.forma = clamp(j.forma - 1.8, -12, 12);
      j.moral = clamp(j.moral - 3, 0, 100);
      perfecto = false;
      break;
    }
    if(res.lesionEnPartido && !j.lesion){
      j.lesion = pick(['Rotura de fibras en el gemelo','Esguince de tobillo','Sobrecarga lumbar','Epicondilitis','Fascitis plantar','Tendinitis del hombro']);
      j.lesionSem = ri(1,2);
      lesionado = true;
      break;
    }
  }
  return cerrarFichaTorneo(ev, ronda, partidos, perfecto, remontada, lesionado);
}

function cerrarFichaTorneo(ev, victorias, partidos, perfecto, remontada, lesionado){
  const T = TIERS[ev.t];
  const campeon = victorias >= T.rondas;
  const idxPts = Math.max(0, T.rondas - victorias);
  const pts = campeon ? T.pts[0] : (T.pts[Math.min(idxPts, T.pts.length-1)] || 0);
  const factores = [1, .585, .32, .175, .098, .058, .034];
  const plata = Math.round(T.prem * (factores[Math.min(idxPts, factores.length-1)] || .02));
  return {ev, victorias, campeon, pts, plata, partidos, perfecto, remontada, lesionado,
          ronda: nombreRonda(victorias, T.rondas, campeon)};
}
function nombreRonda(victorias, totalRondas, campeon){
  if(campeon) return gx('Campeón','Campeona');
  if(victorias === totalRondas-1) return 'Final';
  if(victorias === totalRondas-2) return 'Semifinal';
  if(victorias === totalRondas-3) return 'Cuartos';
  if(victorias === 0) return '1ª ronda';
  return victorias+1 + 'ª ronda';
}
function pesoResultado(r){ return r.pts * 1000 + r.victorias; }

function hacerGira(idx){
  const j = S.j;
  const gira = S.cal[j.trimestre].giras[idx];
  if(!accesible(j, gira)) return;
  S.enGira = {
    gira, rankAntes: j.ranking, quimicaAntes: j.pareja ? j.pareja.quimica : 0,
    jugables: gira.torneos.filter(ev=>puedeJugar(j, ev)),
    i: 0, resultados: [], pts:0, plata:0, vic:0, der:0, perfecto:false, remontada:false
  };
  continuarGira();
}

function continuarGira(){
  const j = S.j, st = S.enGira;
  while(st.i < st.jugables.length){
    if(j.lesion) break;
    const ev = st.jugables[st.i];
    if(j.edad<=19 && ['P2','P1','MJ','FIN'].indexOf(ev.t) >= 0) logro(j,'premier_teen');
    const modo = modoMinijuego(ev), TT = TIERS[ev.t];
    const r = jugarTorneo(j, ev, {
      previa: entradaTorneo(j, ev) === 'previa',
      /* El punto de oro se juega SOLO en la final. Encadenar dos puntos
         sueltos (semifinal y final) hacía que un P1 fuese casi inganable:
         la semifinal se simula como cualquier otro partido. */
      pausarEnRonda: modo === 'cuadro' ? TT.rondas-3 : modo === 'duelo' ? TT.rondas-1 : null
    });
    if(r.pausaFinal){
      if(modo === 'cuadro'){ S.cuadro = crearCuadro(j, ev, r); S.pantalla = 'cuadro'; }
      else { S.duelo = crearDuelo(j, ev, r); S.pantalla = 'duelo'; }
      guardar(); render();
      return;                       // la gira sigue cuando lo resuelvas
    }
    anotarTorneo(r);
    st.i++;
  }
  cerrarGira();
}

function anotarTorneo(r){
  const j = S.j, st = S.enGira, ev = r.ev;
  st.resultados.push(r);
  st.pts += r.pts; st.plata += r.plata; st.vic += r.victorias;
  st.der += (r.campeon ? 0 : 1);
  if(r.campeon && r.perfecto) st.perfecto = true;
  if(r.remontada) st.remontada = true;
  j.energia = clamp(j.energia + 6, 0, 100);   // se descansa entre torneo y torneo
  if(r.campeon){
    j.titulos.push({nom:ev.nom, tier:ev.t, a:j.anio, edad:j.edad, pista:ev.pista, pais:ev.pais,
                    pareja: j.pareja ? j.pareja.nombre : null});
    j.moral = clamp(j.moral+12,0,100);
    j.fama += ev.t==='MJ'?25:ev.t==='FIN'?20:ev.t==='P1'?14:ev.t==='P2'?8:3;
    j.hist.push({a:j.anio, t:`🏆 ${gx('Campeón','Campeona')}: ${esc(ev.nom)}`});
  } else if(r.victorias === TIERS[ev.t].rondas-1){
    j.finales++;
    j.hist.push({a:j.anio, t:`🥈 Finalista: ${esc(ev.nom)}`});
  }
}

function cerrarGira(){
  const j = S.j, st = S.enGira, gira = st.gira;
  const resultados = st.resultados;

  const w = j.anio*TRIMESTRES_POR_ANIO + j.trimestre;
  resultados.forEach(r=>{ if(r.pts>0) j.puntosHist.push({w, pts:r.pts}); });
  j.dinero += st.plata;
  j.premiosTotal = (j.premiosTotal||0) + st.plata;
  j.premiosAnio = (j.premiosAnio||0) + st.plata;
  recalcRank(j);

  /* La química se mueve con lo que ha pasado en la pista: los títulos unen y
     las primeras rondas seguidas separan. */
  let dq = 0;
  if(j.pareja){
    dq = Math.round(st.vic*1.6 - st.der*2.4 + (resultados.some(r=>r.campeon) ? 9 : 0));
    dq = clamp(dq, -16, 16);
    moverQuimica(j, dq);
    j.pareja.trimestres = (j.pareja.trimestres||0) + 1;
  }

  const notas = [];
  /* Lo que de verdad cuenta un torneo de pádel: si tuvisteis la red o si os
     pasasteis la semana defendiendo. */
  const ptsGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.puntos||0),0),0);
  const redGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.red||0)*(x.puntos||0),0),0);
  const orosGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.oros||[]).length,0),0);
  const orosGanados = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.oros||[]).filter(Boolean).length,0),0);
  const salidasGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.salidas||0),0),0);
  if(ptsGira){
    const pcRed = Math.round(100*redGira/ptsGira);
    notas.push({tipo: pcRed>=52?'':'bad', txt:
      `🕸️ <b>La red fue vuestra el ${pcRed}%</b> de los ${ptsGira.toLocaleString('es')} puntos de la gira. ` +
      (pcRed>=58 ? 'Jugasteis casi siempre desde arriba: así es como se gana en pádel.'
       : pcRed>=48 ? 'Se repartió. Los partidos se decidieron en detalles.'
                   : 'Os pasasteis la gira defendiendo. Con el globo se recupera la red; sin él, se corre.') +
      ` · <b>${orosGanados}/${orosGira}</b> puntos de oro` +
      (salidasGira ? ` · 🚪 <b>${salidasGira}</b> ${salidasGira===1?'punto ganado saliendo de la pista':'puntos ganados saliendo de la pista'}` : '')});
  }
  if(j.lesion) notas.push({tipo:'bad', txt:`🩹 Se os cortó la gira: <b>${esc(j.lesion)}</b>. Te pierdes lo que viene.`});
  const saltados = gira.torneos.length - st.jugables.length;
  if(saltados>0) notas.push({txt:`🔒 Os quedasteis fuera de ${saltados} cuadro${saltados>1?'s':''} de la gira por ranking.`});
  if(j.pareja && j.pareja.quimica < 25) notas.push({tipo:'bad', txt:`💢 <b>Esto se rompe.</b> ${esc(j.pareja.nombre)} apenas te habla en los cambios de lado. O lo arregláis, o cambias de pareja antes de que lo haga ${gx('él','ella')}.`});

  const logros = chequearLogros(j, {perfecto: st.perfecto, remontada: st.remontada});

  const mejor = resultados.slice().sort((a,b)=>pesoResultado(b)-pesoResultado(a))[0];
  const titulos = resultados.filter(r=>r.campeon);
  /* Los partidos de la previa también son partidos: ganar dos a las nueve de la
     mañana para entrar al cuadro cuenta, aunque no dé un punto de ranking. */
  const ganados  = resultados.reduce((a,r)=>a + r.partidos.filter(x=>x.gane).length, 0);
  const perdidos = resultados.reduce((a,r)=>a + r.partidos.filter(x=>!x.gane).length, 0);
  let titulo, texto;
  if(!resultados.length){
    titulo = 'GIRA EN BLANCO';
    texto = 'No pudisteis entrar a ningún cuadro. Semanas de entrenamiento y nada más.';
  } else if(titulos.length > 1){
    titulo = `${titulos.length} TÍTULOS EN LA GIRA`;
    texto = `Arrasasteis: ${titulos.map(r=>esc(r.ev.ciudad)).join(', ')}. Una gira de esas se recuerda.`;
  } else if(mejor.campeon){
    titulo = `${gx('¡CAMPEÓN','¡CAMPEONA')} EN ${mejor.ev.ciudad.toUpperCase()}!`;
    texto = mejor.ev.t==='MJ' ? `Ganasteis un <b>Major</b>. ${paisDe(j).nom} entero os vio levantar ese trofeo.` :
            mejor.ev.t==='FIN' ? `Ganasteis las <b>Premier Padel Finals</b>. Sois la mejor pareja del año.` :
            mejor.ev.t==='P1' ? `Un <b>P1</b>. Ya jugáis de tú a tú con las mejores parejas del mundo.` :
            mejor.ev.t==='P2' ? `Título <b>Premier Padel</b>. Vuestro nombre queda en el cuadro grande.` :
            mejor.ev.t==='FIP5' ? `Título <b>Platinum</b>. Es el escalón que abre la puerta del Premier.` :
            `Trofeo en el FIP. Poco dinero, pero puntos que suman.`;
    if(mejor.perfecto) texto += ` Y sin ceder un set.`;
  } else if(mejor.victorias === TIERS[mejor.ev.t].rondas-1){
    titulo = `FINALISTAS EN ${mejor.ev.ciudad.toUpperCase()}`;
    texto = `Llegasteis a la final y se os escapó. Los puntos y el dinero quedan.`;
  } else if(ganados === 0){
    titulo = 'GIRA PARA OLVIDAR';
    texto = `${resultados.length} torneos, ninguna victoria. Aviones, hoteles y a casa. Así empieza casi todo el mundo.`;
  } else if(st.vic === 0){
    titulo = 'TODO EL VIAJE PARA LA PREVIA';
    texto = `${ganados} ${ganados===1?'partido ganado':'partidos ganados'}, todos en cuadros de clasificación, y ni un cuadro final. Levantarte a las siete para jugar a las nueve y volverte a casa el martes.`;
  } else {
    titulo = `LO MEJOR: ${mejor.ronda.toUpperCase()} EN ${mejor.ev.ciudad.toUpperCase()}`;
    texto = `Gira despareja, pero os lleváis ritmo de partido y algo de ranking.`;
  }

  const deltaRank = (st.rankAntes && j.ranking) ? st.rankAntes - j.ranking : 0;
  S.gira = { gira, resultados, pts:st.pts, plata:st.plata, vic:st.vic, titulo, texto,
             pg: ganados, pp: perdidos,
             deltaRank, logros, notas, campeon: titulos.length>0, dQuimica: dq };
  S.enGira = null;
  S.pantalla = 'gira';
  guardar(); render();
}

/* ─────────── EL CUADRO (solo Majors) ───────────
   Al llegar a cuartos de un Major el torneo se detiene. Cada casilla es un
   partido: detrás de alguna está la pareja que os saca. Cuanto mejor seáis
   respecto del cuadro, más caminos seguros. */
function crearCuadro(j, ev, parcial){
  const T = TIERS[ev.t];
  const miR = ratingDupla(j, ev.pista, ev);
  const rondas = [];
  for(let k = T.rondas-3; k < (S.torneo ? T.rondas-1 : T.rondas); k++){
    const opp = generarRival(ev.t, k, T.rondas);
    /* Llegar a cuartos de un Major ya ha costado cuatro partidos: a partir de
       aquí el cuadro tiene que premiar, no rematarte. La base va por encima
       del 50% a propósito. */
    const objetivo = clamp(0.62 + (miR - opp.rating)*0.05 + difActual().eleccion, 0.45, 0.9);
    let casillas = 4, nMinas = 2, mejorDif = Infinity;
    for(let c = 4; c <= 6; c++){
      for(let m = 1; m <= 3; m++){
        if(c - m < 1) continue;
        const dif = Math.abs((c - m)/c - objetivo);
        if(dif < mejorDif){ mejorDif = dif; casillas = c; nMinas = m; }
      }
    }
    const minas = [];
    while(minas.length < nMinas){ const m = ri(0, casillas-1); if(minas.indexOf(m)<0) minas.push(m); }
    /* LEER EL PARTIDO: con Mental alto detectas de antemano uno de los peligros.
       Solo aparece si queda otro oculto: leer el punto da ventaja, nunca certeza. */
    const probPista = clamp((j.stats.mental - 45) / 60, 0, 0.85);
    const pista = (nMinas >= 2 && Math.random() < probPista) ? minas[ri(0, minas.length-1)] : null;
    rondas.push({
      nom: k === T.rondas-1 ? 'FINAL' : k === T.rondas-2 ? 'SEMIFINAL' : 'CUARTOS',
      opp, casillas, minas, pista, elegida: null
    });
  }
  /* LA BOLA DE PARTIDO SALVADA.
     Un error no puede eliminarte de un Major. Tienes un salvavidas —dos si
     llevas psicólog@— para sobrevivir a la primera bola de partido en contra.
     Es lo que pasa en los partidos de verdad, y convierte el cuadro en una
     remontada en lugar de una ejecución. */
  const vidas = 1 + (j.equipo.psico ? 1 : 0);
  return { ev, parcial, rondas, actual:0, terminado:false, gano:false,
           vidas, vidasIniciales: vidas, salvada:false };
}

function elegirCasilla(i){
  const c = S.cuadro, r = c.rondas[c.actual];
  if(c.terminado || r.elegida !== null) return;
  r.falladas = r.falladas || [];
  if(r.falladas.indexOf(i) >= 0) return;          // ese camino ya lo probaste
  c.salvada = false;
  if(r.minas.indexOf(i) >= 0 && c.vidas > 0){
    // bola de partido en contra… y la salvas. Sigues vivo en la misma ronda.
    c.vidas--;
    r.falladas.push(i);
    S.j.moral = clamp(S.j.moral-3, 0, 100);
    c.salvada = true;
    guardar(); render();
    return;
  }
  r.elegida = i;
  if(r.minas.indexOf(i) >= 0){
    c.terminado = true; c.gano = false;
    S.j.moral = clamp(S.j.moral-8, 0, 100);
    S.j.forma = clamp(S.j.forma-2, -12, 12);
  } else {
    c.actual++;
    if(c.actual >= c.rondas.length){
      c.terminado = true; c.gano = true;
      S.j.moral = clamp(S.j.moral+12, 0, 100);
      S.j.forma = clamp(S.j.forma+3, -12, 12);
    }
  }
  guardar(); render();
}

function cerrarCuadro(){
  const j = S.j, c = S.cuadro, T = TIERS[c.ev.t];
  const p = c.parcial;
  const victorias = (T.rondas-3) + (c.gano ? c.rondas.length : c.actual);
  // los partidos del minijuego cuentan como partidos jugados
  const jugados = c.gano ? c.rondas.length : c.actual + 1;
  j.pj += jugados;
  j.pg += (c.gano ? c.rondas.length : c.actual);
  j.pgAnio = (j.pgAnio||0) + (c.gano ? c.rondas.length : c.actual);
  if(!c.gano){ j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0; }
  else j.racha = (j.racha||0) + c.rondas.length;
  j.energia = clamp(j.energia - jugados*6, 0, 100);
  c.rondas.forEach((r, k) => { if(k < c.actual || c.gano) anotarH2H(j, r.opp, true); else if(k === c.actual) anotarH2H(j, r.opp, false); });
  if(S.torneo){ S.cuadro = null; return finMinijuegoTorneo(victorias, c.gano); }
  const r = cerrarFichaTorneo(c.ev, victorias, p.partidos, p.perfecto && c.gano, p.remontada, false);
  anotarTorneo(r);
  S.cuadro = null;
  S.enGira.i++;
  continuarGira();
}

/* ─────────── EL PUNTO DE ORO ─────────── */
function resolverDuelo(i){
  const j = S.j, d = S.duelo, o = d.esc.ops[i];
  const pr = probsGolpe(j, d, o);
  const u = Math.random();
  let gana, texto;
  if(u < pr.gan){ gana = true;  texto = o.txtGan; }
  else if(u < pr.gan + pr.err){ gana = false; texto = o.txtErr; }
  else {
    const sigue = Math.random() < clamp(d.pBase + (o.delta||0), 0.05, 0.95);
    gana = sigue;
    texto = d.esc.sigue + ' ' + (sigue ? d.esc.gana : d.esc.pierde);
  }
  j.orosJugados = (j.orosJugados||0) + 1;
  if(gana) j.orosGanados = (j.orosGanados||0) + 1;
  // salir de la pista y ganar el punto de oro es de las cosas que se recuerdan
  if(gana && o.salida){
    j.salidasPista = (j.salidasPista||0) + 1;
    j.hist.push({a:j.anio, t:'🚪 Punto de oro ganado saliendo de la pista'});
  }
  d.resultado = { gana, texto, golpe:o };
  if(gana){ j.moral = clamp(j.moral+9,0,100); j.forma = clamp(j.forma+2,-12,12); moverQuimica(j, 4); }
  else    { j.moral = clamp(j.moral-7,0,100); j.forma = clamp(j.forma-2,-12,12); moverQuimica(j, -3); }
  guardar(); render();
}

function cerrarDuelo(){
  const j = S.j, d = S.duelo, res = d.resultado;

  /* El Mundial no es un torneo del calendario: es una campaña aparte */
  if(d.contexto === 'mundial'){
    if(res.gana){
      j.mundial = (j.mundial||0) + 1;
      j.mundialRonda = (j.mundialRonda||0) + 1;
      j.fama += 6;
      if(j.mundialRonda >= 4){
        j.mundialCopas = (j.mundialCopas||0) + 1;
        j.mundialRonda = 0;
        j.hist.push({a:j.anio, t:`🏅 Campe${ga()==='a'?'ona':'ón'} del Mundo con ${paisDe(j).nom}`});
        S.msgs = [{tipo:'gold', txt:`🏅 <b>¡${paisDe(j).nom} campe${ga()==='a'?'ona':'ón'} del Mundo!</b> Ganaste el punto que lo decidió todo. Eso no lo quita ningún ranking.`}];
        chequearLogros(j, {mundialCopa:true});
      } else {
        S.msgs = [{txt:`🇺🇳 <b>${paisDe(j).nom} pasa de ronda.</b> Siguiente parada: ${RONDAS_MUNDIAL[j.mundialRonda].nom.toLowerCase()}. ${RONDAS_MUNDIAL[j.mundialRonda].d}`}];
      }
    } else {
      j.mundialRonda = 0;
      S.msgs = [{tipo:'bad', txt:`🇺🇳 ${paisDe(j).nom} se despide del Mundial. El punto de oro se lo llevaron ellos.`}];
    }
    chequearLogros(j, {});
    S.duelo = null;
    S.pantalla = 'temporada';
    guardar(); render();
    return;
  }

  const T = TIERS[d.ev.t], p = d.parcial;
  if(res.gana && !d.esFinal){
    // ganó la semifinal → ahora la final, también a punto de oro
    S.duelo = crearDuelo(j, d.ev, p, T.rondas-1);
    j.pj++; j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
    j.energia = clamp(j.energia-7, 0, 100);
    guardar(); render();
    return;
  }
  const ganadas = d.esFinal ? (res.gana ? 2 : 1) : 0;
  const victorias = (T.rondas-2) + ganadas;
  j.pj++;
  if(res.gana){ j.pg++; j.pgAnio=(j.pgAnio||0)+1; j.racha=(j.racha||0)+1; }
  else { j.pp++; j.ppAnio=(j.ppAnio||0)+1; j.racha = 0; }
  j.energia = clamp(j.energia-7, 0, 100);
  if(S.torneo){ S.duelo = null; return finMinijuegoTorneo(victorias, res.gana); }
  const r = cerrarFichaTorneo(d.ev, victorias, p.partidos, p.perfecto && res.gana, p.remontada, false);
  anotarTorneo(r);
  S.duelo = null;
  S.enGira.i++;
  continuarGira();
}

function crearDueloMundial(j){
  const p = paisDe(j);
  const ciu = pick(p.ciudades).n;
  const ev = {t:'MUN', nom:'Mundial de Selecciones', ciudad:ciu, pista:p.pista, pais:null};
  return crearDuelo(j, ev, null, 2, 'mundial');
}

/* — trimestres sin competir — */
function trimestreEntreno(){
  const j = S.j;
  const posibles = STAT_KEYS.filter(k=>j.stats[k] < j.pot[k]);
  let txt;
  if(posibles.length){
    const k = pick(posibles);
    j.stats[k] = clamp(j.stats[k]+3, 10, j.pot[k]);
    txt = `🏋️ Un trimestre entero en el club de ${esc(j.ciudad)}: <b>+3 ${STAT_NOM[k]}</b>.`;
  } else {
    j.stats.mental = clamp(j.stats.mental+1,10,99);
    txt = `🏋️ Ya estás en tu techo natural. Entrenaste igual: <b>+1 Mental</b>.`;
  }
  j.energia = clamp(j.energia + 30, 0, 100);
  j.forma = clamp(j.forma - 2, -12, 12);
  S.msgs = [{txt}];
  pasarTrimestre();
}
function trimestreQuimica(){
  const j = S.j;
  if(!j.pareja){ trimestreEntreno(); return; }
  moverQuimica(j, 18);
  j.energia = clamp(j.energia + 18, 0, 100);
  j.forma = clamp(j.forma - 3, -12, 12);
  j.moral = clamp(j.moral + 6, 0, 100);
  S.msgs = [{txt:`🤝 Tres meses entrenando solo con <b>${esc(j.pareja.nombre)}</b>: señales, cruces, quién va a cada bola. <b>+18 de química</b> (ahora ${Math.round(j.pareja.quimica)}). Cero partidos oficiales.`}];
  pasarTrimestre();
}
function trimestreDescanso(){
  const j = S.j;
  j.energia = 100;
  j.moral = clamp(j.moral + 12, 0, 100);
  j.forma = clamp(j.forma - 4, -12, 12);
  S.msgs = [{txt:`🛋️ Tres meses sin competir. Vuelves enter${ga()} y con la cabeza limpia.`}];
  pasarTrimestre();
}

function pasarTrimestre(){
  if(S.j && S.j.ranking === 1) S.j.trimN1 = (S.j.trimN1 || 0) + 1;      // fechas aguantando en lo más alto
  cerrarCircuitoTrimestre(S.j);          // las demás parejas juegan su trimestre
  mundialPendiente();                    // el Mundial no se queda a medias
  const j = S.j;
  S.trim = null; S.torneo = null; S.verTorneo = null;
  const rec = 34 + j.stats.fisico/8 + (j.equipo.fisio?12:0) + (j.equipo.preparador?10:0)
            + (tieneMejora(j,'altura')?10:0) + energiaExtraLujos(j);
  j.energia = clamp(j.energia + rec, 0, 100);
  const bien = bienestar(j);
  if(bien) j.moral = clamp(j.moral + bien, 0, 100);
  if(j.animo && j.animo.n > 0){
    j.animo.n--;
    if(j.animo.n === 0){
      const eraBueno = j.animo.val > 0;
      S.msgs = (S.msgs||[]).concat([{ txt: eraBueno
        ? '😐 Se acabó la racha. Vuelves a jugar a tu nivel de siempre.'
        : '🙂 Se te pasó. Vuelves a estar enter' + ga() + ' en la pista.' }]);
      j.animo = null;
    }
  }
  j.forma = clamp(j.forma * 0.88, -12, 12);
  if(j.lesionSem > 0){ j.lesionSem--; if(j.lesionSem<=0){ j.lesion=null; S.msgs=[{txt:'✅ Te han dado el alta. De vuelta a la pista.'}]; } }
  j.trimestre++;
  const wAhora = j.anio*TRIMESTRES_POR_ANIO + j.trimestre;
  j.puntosHist = j.puntosHist.filter(x => wAhora - x.w < PESO_ANTIGUEDAD.length);
  recalcRank(j);
  if(j.ranking && j.ranking<=10) j.trimestresTop10 = (j.trimestresTop10||0)+1;
  S.candidatos = null;                 // el mercado de parejas se refresca

  if(j.trimestre >= TRIMESTRES_POR_ANIO){ finTemporada(); return; }

  if(!j.lesion && Math.random() < 0.5){
    const e = eventoAleatorio(j);
    if(e){ S.evento = e; S.eventoRes = null; S.pantalla='evento'; guardar(); render(); return; }
  }
  S.pantalla = 'temporada';
  guardar(); render();
}

/* — eventos — */
function elegirEvento(i){
  const j = S.j, e = S.evento, op = e.ops[i];
  j.eventosVistos = j.eventosVistos || [];
  if(!e.repetible) j.eventosVistos.push(e.id);
  S.tirada = tirarDado(j, op);
  if(S.tirada) S.tirada.rodando = true;
  S.eventoRes = op.f(j, op) + aplicarFallo(j, op, S.tirada) + aplicarCritico(j, S.tirada);
  if(e.mundial && i === 0) S.dueloPendiente = 'mundial';
  j.moral = clamp(j.moral,0,100); j.energia = clamp(j.energia,0,100); j.forma = clamp(j.forma,-12,12);
  j.dinero = Math.max(0, j.dinero);
  recalcRank(j);
  guardar(); render();
}
function cerrarEvento(){
  S.evento = null; S.eventoRes = null; S.tirada = null;
  if(S.dueloPendiente === 'mundial'){
    S.dueloPendiente = null;
    S.mundial = crearMundialRafaga(S.j);
    S.pantalla = 'mundial';
    guardar(); render();
    return;
  }
  S.pantalla = 'temporada';
  guardar(); render();
}

/* — fin de temporada — */
function finTemporada(){
  const j = S.j;
  const notas = [], cuentas = [];
  const rankFin = j.ranking;
  j.rankFin.push(rankFin);
  const parejaDelAnio = j.pareja ? j.pareja.nombre : null;

  cuentas.push(['Premios en torneos (tu mitad)', j.premiosAnio||0]);

  // patrocinios: en pádel se cobra menos, y la fama pesa proporcionalmente más
  const spBase = [0, 6000, 30000, 90000][j.sponsor] || 0;
  const spRank = !rankFin ? 0 : rankFin<=5 ? 420000 : rankFin<=10 ? 240000 : rankFin<=30 ? 90000 :
                 rankFin<=60 ? 32000 : rankFin<=100 ? 12000 : rankFin<=200 ? 4000 : 800;
  const sponsor = Math.round(spBase + spRank + j.fama*700);
  if(sponsor>0){ j.dinero += sponsor; cuentas.push(['Patrocinios y marcas', sponsor]); }

  const viajes = Math.round(11000 + (rankFin && rankFin<200 ? 15000 : 4000));
  j.dinero -= viajes;
  cuentas.push(['Vuelos, hoteles y overgrips', -viajes]);
  const equipo = costoStaffAnual(j);
  if(equipo){ j.dinero -= equipo; cuentas.push(['Renovación del equipo (se cobra en enero)', -equipo]); }

  if(j.dinero < 0){
    notas.push({tipo:'bad', txt:`💸 <b>Estás en números rojos.</b> Has tenido que pedir dinero en casa. Si no subes de nivel, esto no se sostiene.`});
    j.moral = clamp(j.moral-10,0,100);
    j.dinero = 0;
    if(j.equipo.entrenador>0 && Math.random()<.5){ j.equipo.entrenador--; notas.push({tipo:'bad',txt:'👋 Has tenido que soltar a tu entrenador. No daba.'}); }
  }

  /* — tu pareja decide si sigue contigo — */
  if(j.pareja){
    j.pareja.anios = (j.pareja.anios||0) + 1;
    j.pareja.edad++;
    // crece o decrece con la edad, y con tu nivel tira de ella hacia arriba
    const tiron = clamp((escalar(rawJugador(j)) - j.pareja.nivel)*0.24, -1.0, 3.2);
    j.pareja.nivel = clamp(j.pareja.nivel + (j.pareja.edad<=27 ? rnd(0.6,2.2) : j.pareja.edad<=32 ? rnd(-0.3,0.9) : rnd(-2.6,-0.6)) + tiron, 34, 96);
    if(j.pareja.edad >= 38 && Math.random() < 0.5){
      notas.push({tipo:'bad', txt:`👋 <b>${esc(j.pareja.nombre)} se retira.</b> ${j.pareja.anios} temporadas juntos y una cena larga para despedirlo. Necesitas pareja nueva.`});
      j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'se retiró'});
      j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(0,4), pick(NAC_RIV), posContraria(j.posicion), ri(20,28));
      j.pareja.quimica = 48;
    } else if(j.pareja.quimica < 22 && Math.random() < 0.62){
      notas.push({tipo:'bad', txt:`💔 <b>${esc(j.pareja.nombre)} rompe la pareja.</b> Llevabais medio año sin hablaros fuera de la pista. Te enteraste por Instagram.`});
      j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'se rompió la pareja'});
      j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(1,5), pick(NAC_RIV), posContraria(j.posicion), ri(20,32));
      j.pareja.quimica = 46;
    } else if(j.pareja.nivel > escalar(rawJugador(j)) + 6 && (!rankFin || rankFin > 120) && Math.random() < 0.45){
      notas.push({tipo:'bad', txt:`🚪 <b>${esc(j.pareja.nombre)} te deja por alguien mejor clasificad@.</b> Te lo dijo a la cara, al menos. Está ${(j.pareja.nivel - escalar(rawJugador(j))).toFixed(1)} puntos por encima de ti y tiene prisa.`});
      j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'te dejó por alguien mejor'});
      j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(0,3), pick(NAC_RIV), posContraria(j.posicion), ri(19,30));
      j.pareja.quimica = 50;
    } else {
      notas.push({txt:`🤝 <b>${esc(j.pareja.nombre)}</b> sigue contigo un año más. ${j.pareja.anios} temporada${j.pareja.anios>1?'s':''} juntos, nivel ${j.pareja.nivel.toFixed(1)} y ${Math.round(j.pareja.quimica)} de química.`});
    }
  }

  // rival
  avanzarRival(j);
  if(!j.rival.mejor || (j.rival.rank && j.rival.rank < j.rival.mejor)) j.rival.mejor = j.rival.rank;
  const batir = rankFin && j.rival.rank && rankFin < j.rival.rank;
  notas.push({txt:`${fichaPais(j.rival.flag)} <b>${esc(j.rival.nombre)}</b> cerró el año ${j.rival.rank?'#'+j.rival.rank:'sin ranking'} con ${j.rival.titulos} títulos. ${batir?'Tú estás por delante.':'Todavía te lleva ventaja.'}`});

  // envejecer
  j.edad++;
  const edadDeclive = 31 - Math.round((j.precocidad||0)*2);
  if(j.edad >= edadDeclive){
    const anios = j.edad - edadDeclive;
    const perdidas = [];
    for(const k of ['fisico','remate','volea','pared','bandeja']){
      const d = anios>=4 ? ri(3,5) : anios>=2 ? ri(2,4) : ri(1,3);
      j.stats[k] = clamp(j.stats[k]-d, 10, 99); perdidas.push('−'+d+' '+STAT_NOM[k]);
    }
    j.stats.mental = clamp(j.stats.mental+1, 10, 99);
    j.stats.globo = clamp(j.stats.globo+1, 10, 99);
    notas.push({tipo:'bad', txt:`⏳ <b>${j.edad} años.</b> El cuerpo cobra: ${perdidas.join(' · ')}. La cabeza, en cambio: <b>+1 Mental, +1 Globo</b>. En pádel se puede seguir ganando así.`});
  }

  const parejaTop = !!(rankFin && rankFin<=5 && parejaDelAnio && j.pareja && j.pareja.nombre === parejaDelAnio && j.pareja.anios>=1);
  const logros = chequearLogros(j, {batirRival: batir, parejaTop});

  const tAnio = j.titulos.filter(t=>t.a===j.anio);
  let titular, texto, bueno = false;
  if(tAnio.some(t=>t.tier==='MJ')) { titular='AÑO DE MAJOR'; texto=`Ganasteis un Major. El pádel de ${paisDe(j).nom} tiene un antes y un después.`; bueno = true; }
  else if(rankFin && rankFin<=10) { titular='TOP 10 DEL MUNDO'; texto='Terminaste el año entre las diez mejores parejas del planeta.'; bueno = true; }
  else if(rankFin && rankFin<=50) { titular='AÑO EN EL PREMIER'; texto='Top 50: entras directo a los cuadros grandes y vives del pádel.'; bueno = true; }
  else if(rankFin && rankFin<=150) { titular='AÑO DE PLATINUM'; texto='Ya no dependes de los Promises. El siguiente escalón está cerca.'; }
  else if(tAnio.length) { titular='AÑO DE APRENDIZAJE'; texto='Algún título, muchos aeropuertos y la sensación de que vas a algún sitio.'; }
  else { titular='AÑO DURO'; texto='Sin títulos, poco dinero y muchas primeras rondas. Así se forjan los que llegan… o se van.'; }

  // retiro
  let retiro = false;
  const viejo = j.edad >= 37 || (j.edad>=33 && (!rankFin || rankFin>400));
  if(viejo){
    retiro = true; j.retirado = true; cerrarIdolo(j);
    if(L_esLeyenda(j)) logro(j, 'estatua');
    S.legado = calcularLegado(j);
  }

  S.finAnio = { anio:j.anio, rankFin, titular, texto, bueno, cuentas, notas, logros, retiro,
                titulosAnio: tAnio.length, pgAnio: j.pgAnio||0, ppAnio: j.ppAnio||0 };
  S.pantalla = 'finTemporada';
  guardar(); render();
}
function L_esLeyenda(j){
  const L = calcularLegado(j);
  return L.pts >= 480;
}

function irPretemporada(){
  const j = S.j;
  if(j.retirado){ S.pantalla = 'retiro'; render(); return; }
  j.anio++; j.trimestre = 0;
  j.mejoras = [];                     // las mejoras caducan cada enero
  j.premiosAnio = 0; j.pgAnio = 0; j.ppAnio = 0;
  j.enAcademia = false;
  S.cal = generarTemporada(j);
  S.candidatos = null;

  /* Desarrollo natural: te acercas a tu techo, deprisa de joven y despacio
     después. En pádel se madura tarde — el pico llega entre los 26 y los 30 —
     así que la curva es más larga que la de un tenista. */
  let tasa = j.edad<=20 ? .05 : j.edad<=23 ? .135 : j.edad<=27 ? .115 : j.edad<=31 ? .07 : 0;
  if(j.modo === 'idolo') tasa *= IDOLO_DUREZA.tasa;
  const prec = j.precocidad || 0;
  if(j.edad <= 21) tasa *= 1 + prec*3.4;      // el precoz adelanta su curva…
  else if(j.edad >= 25) tasa *= 1 - prec*0.5; // …y después se le aplana
  const boost = 1 + j.equipo.entrenador*0.10 + (j.equipo.fisio?0.04:0);
  const natural = [];
  for(const k of STAT_KEYS){
    const gap = j.pot[k] - j.stats[k];
    if(gap <= 0 || tasa === 0) continue;
    const g = Math.max(gap >= 3 ? 1 : 0, Math.round(gap*tasa*boost));
    if(g > 0){ j.stats[k] = clamp(j.stats[k]+g, 10, j.pot[k]); natural.push('+'+g+' '+STAT_NOM[k]); }
  }
  let libres = j.edad<=20 ? 3 : j.edad<=24 ? 9 : j.edad<=29 ? 7 : 4;
  if(j.modo === 'idolo') libres = Math.max(2, libres - IDOLO_DUREZA.libres);
  libres += j.equipo.entrenador;
  S.pre = { libres, asig:{}, natural };
  S.pantalla = 'pretemporada';
  guardar(); render();
}

/* Pasado tu techo natural puedes seguir subiendo, pero cada punto cuesta el
   doble. Así nunca te quedas con puntos que no se pueden gastar. */
function costoPunto(j, p, k){
  const exceso = (j.stats[k] + (p.asig[k]||0)) - j.pot[k];
  if(exceso < 0) return 1;
  return 5 + exceso*3;
}
function puedeSubir(j, p, k){
  const v = j.stats[k] + (p.asig[k]||0);
  return v < 99 && p.libres >= costoPunto(j, p, k);
}
function asignar(k, d){
  const p = S.pre, j = S.j;
  p.asig[k] = p.asig[k] || 0;
  if(d>0){
    if(!puedeSubir(j, p, k)) return;
    p.libres -= costoPunto(j, p, k);
    p.asig[k]++;
  } else {
    if(p.asig[k] <= 0) return;
    p.asig[k]--;
    p.libres += costoPunto(j, p, k);   // devuelve exactamente lo que costó
  }
  render();
}
/* Reparte lo que queda priorizando lo que más pesa en tu estilo y lo que más
   lejos está de tu techo. */
function repartirAuto(){
  const j = S.j, p = S.pre, pesos = ESTILOS[j.estilo].pesos;
  let g = 0;
  while(p.libres > 0 && g++ < 300){
    let mejor = null, mejorVal = -1;
    for(const k of STAT_KEYS){
      if(!puedeSubir(j, p, k)) continue;
      const actual = j.stats[k] + (p.asig[k]||0);
      const val = pesos[k] * (1 + Math.max(0, j.pot[k]-actual)/25) / costoPunto(j, p, k);
      if(val > mejorVal){ mejorVal = val; mejor = k; }
    }
    if(!mejor) break;
    p.libres -= costoPunto(j, p, mejor);
    p.asig[mejor] = (p.asig[mejor]||0) + 1;
  }
  render();
}
function empezarTemporada(){
  const jj = S.j, pp = S.pre;
  if(pp){ for(const k in pp.asig) jj.stats[k] = clamp(jj.stats[k] + pp.asig[k], 10, 99); S.pre = null; }
  recalcRank(jj);
  S.msgs = [{txt:`🏓 <b>Temporada ${S.j.anio}.</b> ${S.j.edad} años, ${S.j.ranking?'#'+S.j.ranking+' del mundo':'sin ranking'} y una pareja con ${Math.round(S.j.pareja?S.j.pareja.quimica:0)} de química. A empezar otra vez.`}];
  S.pantalla = 'temporada';
  guardar(); render();
}

/* — compras — */
function comprarEntrenador(){
  const j = S.j, sig = NIVELES_ENTRENADOR[j.equipo.entrenador+1];
  if(!sig || j.dinero < sig.costo) return;
  j.dinero -= sig.costo; j.equipo.entrenador++;
  j.moral = clamp(j.moral+5,0,100);
  guardar(); render();
}
function comprarStaff(id){
  const j = S.j, s = STAFF.find(x=>x.id===id);
  if(!s || j.equipo[id] || j.dinero < s.costo) return;
  j.dinero -= s.costo; j.equipo[id] = true;
  guardar(); render();
}
function comprarMejora(id){
  const j = S.j, m = MEJORAS.find(x=>x.id===id);
  if(!m || tieneMejora(j,id) || j.dinero < m.costo) return;
  j.dinero -= m.costo; j.mejoras.push(id);
  if(id === 'altura') j.energia = clamp(j.energia+10,0,100);
  guardar(); render();
}
function comprarLujo(id){
  const j = S.j, l = LUJOS.find(x=>x.id===id);
  if(!l || tieneLujo(j,id) || j.dinero < l.costo) return;
  j.dinero -= l.costo; j.lujos.push(id);
  j.moral = clamp(j.moral + (l.moral||0), 0, 100);
  if(l.fama) j.fama += l.fama;
  j.hist.push({a:j.anio, t:`🛍️ ${nomLujo(l,j)}`});
  chequearLogros(j, {});
  guardar(); render();
}
function ficharPareja(i){
  const j = S.j, c = S.candidatos[i];
  if(!c || puedeFichar(j, c)) return;
  j.dinero -= c.prima;
  if(j.pareja) j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'la dejaste tú'});
  j.pareja = c;
  if(c.estrella) ficharEstrella(j, c);
  j.pareja.quimica = c.quimicaInicial;
  j.pareja.anios = 0; j.pareja.trimestres = 0;
  delete j.pareja.etq; delete j.pareja.quimicaInicial; delete j.pareja.prima; delete j.pareja.exigeRank;
  S.candidatos = null;
  j.hist.push({a:j.anio, t:`🤝 Nueva pareja: ${c.nombre}`});
  guardar(); render();
}


/* ═══════════════════════════════════════════════════════════════
   LA PISTA EN VIVO
   Cualquier partido del calendario se puede jugar de verdad: 2 contra 2 y
   visto desde arriba. La pista mide 10×20 m como la de verdad: tu pareja
   abajo, la rival arriba, red en y = 10 y cristal alrededor. La bola vive en
   3D (x, y y la altura z) y respeta las reglas del pádel: bote en el suelo
   antes de la pared, un bote por lado y punto de oro.

   Cuatro golpes: GOLPE (drive, volea o bandeja según la bola), REMATE,
   GLOBO y DEJADA. Tus estadísticas de la carrera deciden qué golpes te
   salen mejor; lo difícil del partido lo pone la diferencia de nivel con la
   pareja rival, la misma que usa la simulación.
   ═══════════════════════════════════════════════════════════════ */
const hayDOM = typeof document !== 'undefined' && typeof HTMLCanvasElement !== 'undefined';
const W = 10, L = 20, RED_Y = 10, RED_ALT = 0.92, PARED = 3.0, LINEA_SAQUE = 6.95;
const ALT_FONDO = 4.0, REJA_Y0 = 4, REJA_Y1 = 16;   // fondo: 3 m de cristal + 1 m de malla · laterales: cristal junto a los fondos, malla en el centro
const G = 10.5;              // gravedad un pelín más alta que la real: juego más vivo
const REST_SUELO = 0.62, REST_PARED = 0.7, REST_REJA = 0.38, ROCE = 0.86, R_BOLA = 0.1;
const DUR_SWING = 0.34;      // ventana del golpe: generosa para el móvil
const PAUSA_PUNTO = 1.05;
const NOM_PUNTO = ['0','15','30','40'];
function gauss(){ let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

/* Ajustes de la pista: se guardan en el dispositivo, aparte de la carrera */
const PREF_KEY = 'cabra_circuito_pref_v1';
const PREF_BASE = { asistencia:true, sonido:true, juegos:3, sets:1, posicion:'reves', aspecto:{ camiseta:'#DCF54A', pala:'#0F1C22', zurdo:false }, records:{}, tutorial:false, dificultad:'normal', vista:'tv', mano:'diestro', tamBotones:1, opacidad:1,
                    posBotones:null, golpeAuto:false, vibracion:true, teclas:{ golpe:'KeyJ', remate:'KeyL', globo:'KeyK', dejada:'KeyI', pausa:'KeyP' } };
function leerPref(){
  let p;
  try{ p = Object.assign({}, PREF_BASE, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); }catch(e){ p = Object.assign({}, PREF_BASE); }
  p.aspecto = Object.assign({}, PREF_BASE.aspecto, p.aspecto || {}); p.records = Object.assign({}, p.records || {});
  return p;
}
let PREF = leerPref();
function guardarPref(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(PREF)); }catch(e){} }

/* ── Sonido sintetizado: sin archivos, nada que cargar ── */
const Sonido = (() => {
  let ctx = null;
  function listo(){
    if(!PREF.sonido || !hayDOM) return null;
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tono(f, dur, tipo, vol, f2){
    const c = listo(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = tipo || 'sine'; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .03);
  }
  function ruido(dur, frec, vol){
    const c = listo(); if(!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; fl.type = 'bandpass'; fl.frequency.value = frec; fl.Q.value = 1.1; g.gain.value = vol;
    s.connect(fl).connect(g).connect(c.destination); s.start();
  }
  /* aplausos de verdad: cientos de palmadas cortas repartidas en el tiempo */
  function aplausos(dur, fuerza){
    const c = listo(); if(!c) return;
    const n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let k = 0, palmadas = Math.floor(dur*140*fuerza); k < palmadas; k++){
      const t0 = Math.floor(Math.random()*n*.9), largo = Math.floor(c.sampleRate*(.006 + Math.random()*.012)), amp = .25 + Math.random()*.75;
      for(let i = 0; i < largo && t0 + i < n; i++) d[t0 + i] += (Math.random()*2 - 1)*amp*Math.exp(-i/(largo*.28));
    }
    for(let i = 0; i < n; i++) d[i] *= Math.min(1, i/(n*.06))*Math.min(1, (n - i)/(n*.4));
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; fl.type = 'highpass'; fl.frequency.value = 650; g.gain.value = .22*fuerza;
    s.connect(fl).connect(g).connect(c.destination); s.start();
  }
  return {
    desbloquear: listo,
    golpe:  p => { ruido(.045, 1900, .25 + .35*p); tono(200 + 160*p, .07, 'triangle', .16); },
    bote:   () => tono(110, .07, 'sine', .2, 70),
    cristal:() => { tono(1320, .11, 'sine', .07); tono(2240, .08, 'sine', .045); },
    red:    () => tono(140, .13, 'square', .07, 85),
    reja:   () => { ruido(.1, 380, .24); tono(90, .1, 'square', .05); },
    punto:  gana => { tono(gana ? 523 : 330, .12, 'triangle', .14); setTimeout(()=>tono(gana ? 784 : 247, .18, 'triangle', .14), 115); },
    grada:  () => aplausos(1.5, .8),
    ovacion:() => { aplausos(2.8, 1.1); tono(220, .6, 'sawtooth', .02, 200); },
    fanfarria: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => { tono(f, .24, 'triangle', .12); tono(f/2, .24, 'sine', .05); }, i*150)),
  };
})();

/* ── Controles: joystick y cuatro botones en el móvil, teclado en el ordenador ── */
const Input = { ax:0, ay:0, accion:null, teclas:new Set(), joyId:null };
function teclasActuales(){ return Object.assign({}, PREF_BASE.teclas, PREF.teclas); }
function accionDeTecla(code){
  const t = teclasActuales();
  for(const k of ['golpe','remate','globo','dejada']) if(t[k] === code) return k;
  return code === 'Space' && !Object.values(t).includes('Space') ? 'golpe' : null;
}
function nombreTecla(code){
  if(!code) return '—';
  if(code === 'Space') return 'Espacio';
  if(/^Key/.test(code)) return code.slice(3);
  if(/^Digit/.test(code)) return code.slice(5);
  return ({ShiftLeft:'Shift', ShiftRight:'Shift der.', ControlLeft:'Ctrl', ControlRight:'Ctrl der.', AltLeft:'Alt', Enter:'Enter', Tab:'Tab', Backspace:'Borrar',
           Semicolon:'Ñ', Comma:',', Period:'.', Slash:'-', Quote:'´', BracketLeft:'`', BracketRight:'+', Backslash:'ç'})[code] || code;
}
function ejeMovimiento(){
  const t = Input.teclas;
  let x = Input.ax, y = Input.ay;
  if(!x && !y){
    x = (t.has('ArrowRight')||t.has('KeyD') ? 1 : 0) - (t.has('ArrowLeft')||t.has('KeyA') ? 1 : 0);
    y = (t.has('ArrowDown')||t.has('KeyS') ? 1 : 0) - (t.has('ArrowUp')||t.has('KeyW') ? 1 : 0);
  }
  const m = Math.hypot(x, y); if(m > 1){ x /= m; y /= m; }
  return {x, y};
}
function prepararControles(){
  if(!hayDOM) return;
  addEventListener('keydown', e => {
    if(!P || $('#juego').hidden) return;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    if(e.repeat) return;
    Input.teclas.add(e.code);
    Sonido.desbloquear();
    const acc = accionDeTecla(e.code);
    if(acc) Input.accion = acc;
    if(e.code === teclasActuales().pausa || e.code === 'Escape') alternarPausa();
  });
  addEventListener('keyup', e => Input.teclas.delete(e.code));
  addEventListener('blur', () => Input.teclas.clear());
  addEventListener('resize', () => { if($('#juego').hidden) return; ajustarLienzo(); aplicarDisenoControles(); if(EDITOR.activo) dibujarFondoEditor(); });
  document.addEventListener('visibilitychange', () => { if(document.hidden && P && !P.pausa && P.estado !== 'fin') alternarPausa(); });
  const joy = $('#joyP'), knob = $('#joyKnobP');
  const moverJoy = e => {
    const r = joy.getBoundingClientRect(), R = r.width/2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const m = Math.hypot(dx, dy); if(m > R){ dx *= R/m; dy *= R/m; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const mag = Math.hypot(dx, dy) / R;
    Input.ax = mag < .16 ? 0 : dx/R; Input.ay = mag < .16 ? 0 : dy/R;
  };
  joy.addEventListener('pointerdown', e => { if(EDITOR.activo) return; e.preventDefault(); Sonido.desbloquear(); Input.joyId = e.pointerId; joy.setPointerCapture(e.pointerId); moverJoy(e); });
  joy.addEventListener('pointermove', e => { if(!EDITOR.activo && e.pointerId === Input.joyId) moverJoy(e); });
  const soltar = e => { if(e.pointerId !== Input.joyId) return; Input.joyId = null; Input.ax = Input.ay = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerup', soltar); joy.addEventListener('pointercancel', soltar);
  for(const b of document.querySelectorAll('#controlesP .accion')){
    b.addEventListener('pointerdown', e => { if(EDITOR.activo) return; e.preventDefault(); Sonido.desbloquear(); Input.accion = b.dataset.accion; b.classList.add('pulsado'); });
    const fin = () => b.classList.remove('pulsado');
    b.addEventListener('pointerup', fin); b.addEventListener('pointercancel', fin); b.addEventListener('pointerleave', fin);
  }
  prepararArrastreEditor();
  $('#bPausaP').addEventListener('click', alternarPausa);
  $('#juego').addEventListener('contextmenu', e => e.preventDefault());
}

/* ═══════════════════════════════════════════════════════════════
   LA BOLA Y LAS REGLAS
   Suelo antes que pared, un solo bote por lado, la red, el cristal y la malla.
   Si una bola bota y sale de la pista, es punto del que la pegó: por 3 (por
   encima del lateral, 3 m) o por 4 (por encima del fondo, 4 m).
   ═══════════════════════════════════════════════════════════════ */
let P = null;   // el partido en curso

function nuevaBola(){
  return { x:5, y:15, z:.9, vx:0, vy:0, vz:0, botes:0, golpeo:null, cruzo:false, viva:true,
           saque:false, porTres:false, ultimoTiro:null, golpeador:null, pared:false, rastro:[], efecto:null, tocoRed:false, letForzado:false };
}
function ladoDe(y){ return y >= RED_Y ? 0 : 1; }   // 0 = vosotros (abajo) · 1 = ellos (arriba)

/* Un paso de física. Con `sim` no se aplican reglas: sirve para predecir */
function pasoBola(b, dt, sim){
  const py = b.y;
  b.vz -= G*dt;
  b.x += b.vx*dt; b.y += b.vy*dt; b.z += b.vz*dt;
  if(b.golpeo !== null && !b.cruzo && (py >= RED_Y) !== (b.y >= RED_Y)){
    if(b.z < RED_ALT){
      if(sim) return 'red';
      b.y = py; b.vy *= -.15; b.vx *= .3;
      return regla(b, 'red');
    }
    b.cruzo = true;
    /* el saque que roza la cinta y entra es let */
    if(b.saque && (b.z < RED_ALT + .07 || b.letForzado)){ b.tocoRed = true; b.vy *= .86; if(!sim) Sonido.red(); }
  }
  if(b.z <= 0 && b.vz < 0){
    b.z = 0; b.vz = -b.vz*REST_SUELO; b.vx *= ROCE; b.vy *= ROCE;
    const r = sim ? simBote(b) : regla(b, 'bote'); if(r) return r;
  }
  /* devuelta desde fuera de la pista: no choca con la malla hasta que vuelve a entrar por encima */
  if(b.fueraPista){ if(b.x > R_BOLA && b.x < W - R_BOLA && b.y > R_BOLA && b.y < L - R_BOLA) b.fueraPista = false; else return null; }
  if(b.x < R_BOLA || b.x > W - R_BOLA){
    if(b.z > PARED) return sim ? 'fuera' : regla(b, 'fuera', 'lateral');
    const reja = b.y > REJA_Y0 && b.y < REJA_Y1;
    b.x = clamp(b.x, R_BOLA, W - R_BOLA); b.vx = -b.vx*(reja ? REST_REJA : restPared(b));
    if(reja) rebotarReja(b, sim, 'x');
    const r = sim ? simPared(b) : regla(b, 'pared', reja ? 'reja' : 'cristal'); if(r) return r;
  }
  if(b.y < R_BOLA || b.y > L - R_BOLA){
    if(b.z > ALT_FONDO) return sim ? 'fuera' : regla(b, 'fuera', 'fondo');
    const reja = b.z > PARED;
    b.y = clamp(b.y, R_BOLA, L - R_BOLA); b.vy = -b.vy*(reja ? REST_REJA : restPared(b));
    if(reja) rebotarReja(b, sim, 'y');
    const r = sim ? simPared(b) : regla(b, 'pared', reja ? 'reja' : 'cristal'); if(r) return r;
  }
  return null;
}
/* la bola cortada sale muerta del cristal */
function restPared(b){ return REST_PARED * (b.efecto === 'corte' ? .8 : 1); }
/* la malla no devuelve la bola limpia: la frena y la desvía (al predecir, sin azar) */
function rebotarReja(b, sim, eje){
  b.vz *= .6;
  if(sim) return;
  b.vx += gauss()*.7; b.vy += gauss()*.7; b.vz += gauss()*.4;
  if(eje === 'x') b.vx = b.x < W/2 ? Math.abs(b.vx) : -Math.abs(b.vx);
  else b.vy = b.y < L/2 ? Math.abs(b.vy) : -Math.abs(b.vy);
}
/* Al botar manda el efecto: el remate perfecto sale de la pista, lo cortado bota bajo, lo liftado corre
   y la víbora se abre hacia el lateral */
function reboteRemate(b){
  if(b.botes !== 1) return;
  if(b.porTres){
    if(Math.abs(b.x - W/2) > 2.4){                       // por 3: por encima de la malla del lateral
      const lat = Math.max(.4, b.x < W/2 ? b.x : W - b.x), vxl = 9, t = lat/vxl;
      b.vx = (b.x < W/2 ? -1 : 1)*vxl; b.vz = (PARED + .6 + .5*G*t*t)/t; b.vy *= .6;
    } else {                                              // por 4: por encima del fondo
      const hasta = Math.max(.8, b.vy > 0 ? L - b.y : b.y), vy = Math.max(6, Math.abs(b.vy)*.7), t = hasta/vy;
      b.vy = Math.sign(b.vy || -1)*vy; b.vz = (ALT_FONDO + .6 + .5*G*t*t)/t;
    }
    return;
  }
  if(b.efecto === 'corte'){ b.vz *= .8; b.vx *= .92; b.vy *= .92; }
  else if(b.efecto === 'liftado'){ b.vz *= 1.07; b.vx *= 1.04; b.vy *= 1.04; }
  else if(b.efecto === 'lateral'){ b.vz *= .72; b.vx += (b.x < W/2 ? -1 : 1)*1.3; }
}
function simBote(b){
  if(!b.cruzo) return 'corta';
  if(ladoDe(b.y) === b.golpeo) return 'vuelve';
  b.botes++; reboteRemate(b);
  return b.botes >= 2 ? 'dobleBote' : null;
}
function simPared(b){ if(!b.cruzo || b.botes === 0) return 'paredDirecta'; b.pared = true; return null; }

function enCajaSaque(b){
  const rec = 1 - b.golpeo;
  const fondo = rec === 1 ? (b.y >= RED_Y - LINEA_SAQUE - .15 && b.y <= RED_Y) : (b.y <= RED_Y + LINEA_SAQUE + .15 && b.y >= RED_Y);
  const cruzado = P.saqueX < 5 ? b.x >= 4.85 : b.x <= 5.15;
  return fondo && cruzado;
}
function motivoDobleBote(b){
  if(b.ultimoTiro === 'dejada' || b.ultimoTiro === 'chiquita') return '¡Dejada!';
  if(b.ultimoTiro === 'vibora') return '¡Víbora ganadora!';
  if(b.ultimoTiro === 'remate' || b.ultimoTiro === 'plano') return '¡Remate ganador!';
  return 'Doble bote';
}
function regla(b, ev, extra){
  const pega = b.golpeo; if(pega === null) return null;
  const recibe = 1 - pega;
  if(ev === 'red'){ Sonido.red(); return terminar(recibe, 'A la red'); }
  if(ev === 'bote'){
    if(!b.cruzo) return terminar(recibe, 'No pasa la red');
    if(ladoDe(b.y) === pega) return terminar(pega, 'No la devuelven');
    b.botes++;
    if(P.drill && pega === 0 && b.botes === 1) return finDrill(evaluarDrill(b));     // entrenamiento: se mira dónde bota tu golpe
    if(b.saque && b.botes === 1){
      if(!enCajaSaque(b)) return terminar(recibe, 'Falta de saque');
      if(b.tocoRed) return repetirSaque();
    }
    reboteRemate(b);
    if(b.botes >= 2) return terminar(pega, b.saque ? '¡Ace!' : motivoDobleBote(b));
    Sonido.bote(); Efectos.bote(b.x, b.y);
    return null;
  }
  if(ev === 'pared'){
    if(!b.cruzo) return terminar(recibe, 'Pared en su campo');
    if(b.botes === 0) return terminar(recibe, extra === 'reja' ? 'Reja directa' : 'Pared directa');
    if(b.saque && extra === 'reja') return terminar(recibe, 'Saque a la reja');
    b.pared = true;                                  // ya se puede sacar de la pared
    if(extra === 'reja'){ Sonido.reja(); Efectos.reja(b.x, b.y, b.z); P.prediccion = predecirBola(b, 3, P.t - P.tGolpe); }
    else { Sonido.cristal(); Efectos.cristal(b.x, b.y, b.z); }
    return null;
  }
  if(ev === 'fuera'){
    if(b.cruzo && b.botes >= 1 && ladoDe(b.y) === recibe){
      if(extra !== 'fondo' && intentarSalida(b, recibe)) return 'salida';     // por el lateral se puede salir a buscarla
      return terminar(pega, extra === 'fondo' ? '¡Por 4!' : '¡Por 3!', {porTres:true});
    }
    return terminar(recibe, 'Fuera');
  }
  return null;
}
/* En el saque, cualquier error es falta: con la primera hay segundo saque; con la segunda, doble falta */
const FALTAS_SAQUE = ['A la red', 'No pasa la red', 'Falta de saque', 'Pared en su campo', 'Pared directa', 'Reja directa', 'Saque a la reja', 'Fuera'];
function terminar(ganador, motivo, extra){
  const b = P.bola;
  if(!b.viva) return 'fin';
  b.viva = false;
  if(!P.drill && b.saque && ganador !== b.golpeo && FALTAS_SAQUE.includes(motivo)){
    if(P.saqueN !== 2){ faltaSaque(motivo); return 'fin'; }
    motivo = 'Doble falta';
  }
  finPunto(ganador, motivo, extra || {});
  return 'fin';
}

/* Adónde va a ir la bola: la usan la máquina, la asistencia y las sugerencias */
function predecirBola(b, maxT, t0){
  const c = Object.assign({}, b, {rastro:null}), out = [], dt = 1/60;
  for(let t = dt; t <= maxT; t += dt){
    const r = pasoBola(c, dt, true);
    out.push({ t:(t0 || 0) + t, x:c.x, y:c.y, z:c.z, botes:c.botes, cruzo:c.cruzo, saque:c.saque, pared:c.pared });
    if(r) break;
  }
  return out;
}
function actualizarBola(dt){
  const b = P.bola; if(!b.viva || P.estado !== 'juego') return;
  for(let i = 0; i < 3; i++) if(pasoBola(b, dt/3, false)) break;
  b.rastro.push({x:b.x, y:b.y, z:b.z}); if(b.rastro.length > 9) b.rastro.shift();
  /* red de seguridad: una bola que no se decide en 7 s es del que la pegó */
  if(b.viva && P.t - P.tGolpe > 7) terminar(b.golpeo === null ? 1 : b.golpeo, 'Bola muerta');
}

/* ═══════════════════════════════════════════════════════════════
   LOS GOLPES · TU JUGADOR · LA MÁQUINA
   ═══════════════════════════════════════════════════════════════ */
/* dist = metros desde la red hasta donde bota la bola en el otro campo */
const TIROS = {
  saque:   {T:1.05, dist:[4.2,6.4]},
  drive:   {T:0.82, dist:[5.8,8.8]},
  plano:   {T:0.60, dist:[6.4,9.0]},
  volea:   {T:0.62, dist:[3.8,7.4]},
  globo:   {T:1.95, dist:[7.9,9.4]},
  remate:  {T:0.36, dist:[2.6,5.2]},
  vibora:  {T:0.52, dist:[5.2,8.4]},
  bandeja: {T:0.80, dist:[5.6,8.2]},
  dejada:  {T:0.95, dist:[0.9,2.3]},
  chiquita:{T:0.80, dist:[2.8,4.6]},
};
/* Lo que arriesga cada golpe por sí mismo, además de lo bien que lo pegues */
const RIESGO_TIRO = { plano:1.35, remate:1.12, vibora:1.05, dejada:1.2, chiquita:1.05 };
/* El efecto de cada golpe: cortado (bota bajo y muere en el cristal), liftado (bota y corre) o la víbora, que se abre */
const EFECTO_TIRO = { saque:'corte', bandeja:'corte', volea:'corte', dejada:'corte', chiquita:'corte', vibora:'lateral', drive:'liftado', globo:'liftado' };
const NOMBRE_GOLPE = { remate:'REMATE', vibora:'VÍBORA', bandeja:'BANDEJA', globo:'GLOBO', dejada:'DEJADA', chiquita:'CHIQUITA', plano:'PLANO', volea:'VOLEA', drive:'DRIVE' };
const PERFECTO_GOLPE = { remate:'¡REMATE PERFECTO!', vibora:'¡VÍBORA PERFECTA!', bandeja:'¡BANDEJA PERFECTA!', globo:'¡GLOBO PERFECTO!', dejada:'¡DEJADA PERFECTA!',
                         chiquita:'¡CHIQUITA PERFECTA!', plano:'¡PLANO PERFECTO!', volea:'¡VOLEA PERFECTA!', drive:'¡PERFECTO!' };
const COLOR_GOLPE = { remate:'#FF9F43', vibora:'#FF9F43', plano:'#FF9F43', globo:'#7FD3F7', dejada:'#E4F3EF', chiquita:'#E4F3EF', bandeja:'#DCF54A', volea:'#DCF54A', drive:'#DCF54A' };

function tiroHacia(b, tx, ty, T){ return { vx:(tx-b.x)/T, vy:(ty-b.y)/T, vz:(-b.z)/T + .5*G*T }; }
function pasaRed(b, v, margen){
  if(Math.abs(v.vy) < 1e-4) return false;
  const tn = (RED_Y - b.y) / v.vy; if(tn <= 0) return true;
  return b.z + v.vz*tn - .5*G*tn*tn >= RED_ALT + margen;
}
function golpear(j, tipo, calidad, apuntarX, prof){
  const b = P.bola, T = TIROS[tipo];
  /* Dos cosas distintas: la dispersión normal (dónde bota dentro de la pista) y
     el FALLO, que es explícito. Cuanto peor el contacto, más probable fallar: a
     la red, larga contra el cristal o ancha contra la pared. */
  const disp = (1 - calidad) * .9 + .1;
  /* con el joystick se elige la profundidad: arriba, al fondo; abajo, corta */
  const largo = prof > 0 && tipo !== 'dejada' && tipo !== 'chiquita' ? T.dist[1] + .5 : prof < 0 ? Math.max(1.2, T.dist[0] - 1) : rnd(T.dist[0], T.dist[1]);
  let d = clamp(largo + gauss()*disp*.5, .8, 9.5);
  let tx = apuntarX != null ? apuntarX : (j.x < 5 ? rnd(6.2, 8.8) : rnd(1.2, 3.8));
  tx = clamp(tx + gauss()*disp*.7, .5, W - .5);
  const mf = (j.multFalloTiro && j.multFalloTiro[tipo]) || j.multFallo || 1;
  const aLaLinea = apuntarX != null && Math.abs(apuntarX - W/2) > 3.4 ? 1.25 : 1;          // apuntar pegado a la pared arriesga más
  const pFallo = clamp((.02 + Math.pow(1 - calidad, 2) * .4) * mf * (RIESGO_TIRO[tipo] || 1) * aLaLinea, .015, .55);
  let fallo = Math.random() < pFallo ? pick(['red','larga','ancha','larga']) : null;
  if(tipo === 'saque'){
    /* el primer saque se arriesga más; el segundo entra casi siempre */
    const pF = clamp((P.saqueN === 2 ? .03 : .11) * (1.35 - calidad) * mf, .008, .3);
    fallo = Math.random() < pF ? pick(['red','largo','largo','cruce']) : null;
    if(fallo === 'largo') d = rnd(7.15, 8.2);
    if(fallo === 'cruce') tx = P.saqueX < W/2 ? rnd(3.3, 4.6) : rnd(5.4, 6.7);
  }
  if((tipo === 'dejada' || tipo === 'chiquita') && fallo === 'larga') fallo = 'red';   // la dejada que sale mal muere en la red
  if(fallo === 'larga') d = rnd(10.3, 11.4);
  if(fallo === 'ancha') tx = Math.random() < .5 ? rnd(-.8, -.3) : rnd(W + .3, W + .8);
  const ty = j.lado === 0 ? RED_Y - d : RED_Y + d;
  const mt = (j.multTTiro && j.multTTiro[tipo]) || j.multT || 1;
  let TT = T.T * (1.15 - .3*calidad) * mt, v = tiroHacia(b, tx, ty, TT);

  if(fallo === 'red') v.vz *= .5;
  const dePared = b.pared && b.botes >= 1;
  Object.assign(b, { vx:v.vx, vy:v.vy, vz:v.vz, golpeo:j.lado, botes:0, cruzo:false, saque:tipo==='saque', pared:false, efecto: EFECTO_TIRO[tipo] || null, tocoRed:false, salioDePared: dePared,

  for(const o of P.jug) if(o.lado !== j.lado && !o.humano){

    const st = P.stats; st.golpes++;
    if(tipo === 'globo') st.globos++;

}
function alcanzable(j){
  const b = P.bola;
  if(P.estado !== 'juego' || !b.viva || b.golpeo === null || b.golpeo === j.lado) return false;
  if(!b.cruzo || ladoDe(b.y) !== j.lado || (b.saque && b.botes === 0)) return false;
  return Math.hypot(b.x - j.x, b.y - j.y) <= j.alcance && b.z <= 2.9;
}

function aplicarMovimiento(j, dt){
  const m = j.fuera ? 2.4 : 0;                     // en una salida de pista se corre por fuera

  j.y = clamp(j.y + j.vy*dt, j.lado === 0 ? RED_Y + .45 : .35, j.lado === 0 ? L - .35 : RED_Y - .45);
  if(j.fuera && j.x > .35 && j.x < W - .35 && P && P.estado !== 'salida') j.fuera = false;
}

/* ── Tu jugador ──
   El botón decide la intención y la bola decide el golpe que sale. */
function tipoHumano(j, accion){
  const b = P.bola, cercaRed = Math.abs(j.y - RED_Y) < 5.2;
  if(accion === 'globo') return 'globo';
  if(accion === 'dejada') return (cercaRed || b.botes === 0) ? 'dejada' : 'chiquita';
  if(accion === 'remate'){
    if(b.z > 1.75 && cercaRed) return 'remate';
    if(b.z > 1.2) return 'vibora';
    return 'plano';
  }
  if(b.z > 1.65) return 'bandeja';

}
function actualizarHumano(j, dt){

  const eje = ejeMovimiento(), mov = Math.hypot(eje.x, eje.y) > .12;
  P.apunte = alcanzable(j) || j.swing > 0 ? apuntarHumano(j, eje) : null;       // la diana que se ve en la pista
  if(mov){ j.vx = eje.x*j.vel; j.vy = eje.y*j.vel; j.ultimoMov = P.t; }
  else if(PREF.asistencia && P.t - (j.ultimoMov || -9) > .2){ const o = objetivoJugador(j); moverHacia(j, o.x, o.y, j.vel*.92); }
  else { j.vx *= .75; j.vy *= .75; }
  aplicarMovimiento(j, dt);
  if(Input.accion){

    j.pedido = Input.accion;                 // cambiar de idea dentro de la ventana también vale
    Input.accion = null;
  }
  /* Golpe automático: si no pulsas nada, sale el golpe básico; los especiales siguen siendo tuyos */
  if(PREF.golpeAuto && j.swing <= 0 && alcanzable(j) && P.t - (j.tAuto || -9) > .3 && (P.bola.z < 1.45 || P.bola.z > 1.7)){
    j.swing = DUR_SWING*.78; j.pedido = 'golpe'; j.tAuto = P.t;
  }

    if(alcanzable(j)){
      const b = P.bola, prog = 1 - j.swing/DUR_SWING, d = Math.hypot(b.x - j.x, b.y - j.y);
      const dificultad = clamp((Math.hypot(b.vx, b.vy) - 9)/16, 0, .25);

      let cal = (1 - Math.abs(prog - .4)/.6) * (1 - .3*clamp(d/j.alcance, 0, 1)) + .15 + (j.bonusCal || 0) - dificultad;
