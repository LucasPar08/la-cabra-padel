/* una persona: hombros, cuello, cabeza y pelo (o gorra). Con los brazos arriba si festeja */

  if(p.a != null && p.a < 1) c.globalAlpha = p.a;

    c.strokeStyle = p.piel; c.lineWidth = Math.max(1, t*.3); c.lineCap = 'round';
    c.beginPath(); c.moveTo(p.x - t*.68, y - t*.85); c.lineTo(p.x - t*1.1, y - t*2.15);

function gradas(c, es){

function tendido(c, es, gx0, gx1, yBase, yTop, tam){

  for(let f = 0; f < (exterior ? 4 : 40) && y - paso > yTop; f++){ filas.push({ y, t }); y -= paso; t *= .94; paso = t*2.5; }
  if(!filas.length) return;

  if(exterior){ gF.addColorStop(0, '#5F6870'); gF.addColorStop(1, '#8A949C'); }
  else { gF.addColorStop(0, '#07111B'); gF.addColorStop(1, '#122438'); }

    c.fillStyle = 'rgba(255,255,255,.32)'; c.fillRect(gx0, yv, gw, Math.max(1, tam*.2));
    c.fillStyle = 'rgba(12,18,22,.5)'; c.fillRect(gx0, yv + tam*1.45, gw, Math.max(1, tam*.5));
    c.fillStyle = '#4C555C';
    for(let x = gx0 + tam*2.5; x < gx1 - tam; x += tam*7) c.fillRect(x, yv + tam*1.8, Math.max(1.5, tam*.32), tam*2.6);

function terrazaClub(c, es, gx0, gx1, yBase, tam){

function planta(c, x, y, alto){

/* ── Los jugadores, de cuerpo entero ──

  /* el diseño de la camiseta: rayas, franja o la bandera de tu país */
  const tX = hombro[0] - ancho/2, tY = hombro[1] - s*.05, tW = ancho, tH = cadera[1] - hombro[1] + s*.03;
  if(j.diseno && j.diseno !== 'lisa'){
    c.save(); rrect(c, tX, tY, tW, tH, s*.12); c.clip();
    if(j.diseno === 'bandera' && j.banda){ j.banda.forEach((col, i) => { c.fillStyle = col; c.fillRect(tX, tY + i*tH/3, tW, tH/3 + 1); }); c.fillStyle = 'rgba(0,0,0,.14)'; c.fillRect(tX + tW*.58, tY, tW*.42, tH); }
    else if(j.diseno === 'rayas'){ c.fillStyle = 'rgba(0,0,0,.24)'; for(let k = 0; k < 3; k++) c.fillRect(tX + tW*(.1 + k*.32), tY, tW*.13, tH); }
    else if(j.diseno === 'franja'){ c.fillStyle = 'rgba(255,255,255,.78)'; c.beginPath(); c.moveTo(tX, tY + tH*.14); c.lineTo(tX + tW*.8, tY + tH); c.lineTo(tX + tW, tY + tH); c.lineTo(tX + tW, tY + tH*.82); c.lineTo(tX + tW*.22, tY); c.lineTo(tX, tY); c.closePath(); c.fill(); }
    c.restore();
  }
  if(j.diseno !== 'bandera'){ c.fillStyle = oscurecer(j.color, .38); c.fillRect(hombro[0] - ancho*.07, hombro[1] - s*.01, ancho*.14, (cadera[1] - hombro[1])*.88); }
  /* los brazos: el de la pala hace el gesto del golpe; el otro acompaña o festeja */
  const lado = (j.lado === 0 ? 1 : -1)*(j.zurdo ? -1 : 1);
  let angP = -.35;
  if(festeja) angP = -1.25;
  else if(golpe > 0) angP = porArriba ? -2.5 + golpe*3.1 : tipo === 'globo' ? 1.3 - golpe*3.2 : tipo === 'saque' ? 1.5 - golpe*2.1 : .95 - golpe*2.6;
  else if(j.swing > 0) angP = P.bola && P.bola.z > 1.6 ? -2.4 : .95;
  let angO = 1.25 + f*.6;
  if(festeja) angO = -1.75 + Math.sin(t*14)*.15;
  else if(golpe > 0 && porArriba) angO = -1.9;
  const brazo = (sx, sy, ang, sgn, largo, conPala) => {
    const codo = [sx + sgn*Math.cos(ang - .3)*largo*.5, sy + Math.sin(ang - .3)*largo*.5];
    const mano = [codo[0] + sgn*Math.cos(ang)*largo*.5, codo[1] + Math.sin(ang)*largo*.5];
    c.strokeStyle = piel; c.lineWidth = Math.max(2, s*.09);
    c.beginPath(); c.moveTo(sx, sy); c.lineTo(codo[0], codo[1]); c.lineTo(mano[0], mano[1]); c.stroke();
    if(conPala){
      const px = mano[0] + sgn*Math.cos(ang)*s*.18, py = mano[1] + Math.sin(ang)*s*.18;
      c.strokeStyle = '#0F1C22'; c.lineWidth = Math.max(2, s*.06); c.beginPath(); c.moveTo(mano[0], mano[1]); c.lineTo(px, py); c.stroke();
      const cx = px + sgn*Math.cos(ang)*s*.13, cy = py + Math.sin(ang)*s*.13, rp = Math.max(3, s*.16);
      const gp = c.createRadialGradient(cx - rp*.3, cy - rp*.3, 1, cx, cy, rp*1.2);
      gp.addColorStop(0, aclarar(j.colorPala || '#0F1C22', .4)); gp.addColorStop(1, j.colorPala || '#0F1C22');
      c.fillStyle = gp; c.beginPath(); c.ellipse(cx, cy, rp, Math.max(2.5, s*.13), sgn*ang, 0, Math.PI*2); c.fill();
      c.strokeStyle = j.color; c.lineWidth = 1.5; c.stroke();
      const ry2 = Math.max(2.5, s*.13);
      if(j.palaDiseno === 'rayo'){ c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = Math.max(1, s*.03); c.beginPath(); c.moveTo(cx - rp*.3, cy - ry2*.75); c.lineTo(cx + rp*.25, cy - ry2*.05); c.lineTo(cx - rp*.15, cy + ry2*.05); c.lineTo(cx + rp*.3, cy + ry2*.75); c.stroke(); }
      else if(j.palaDiseno === 'aro'){ c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = Math.max(1, s*.025); c.beginPath(); c.ellipse(cx, cy, rp*.6, ry2*.6, sgn*ang, 0, Math.PI*2); c.stroke(); }
      else if(j.palaDiseno === 'degradado'){ const g2 = c.createLinearGradient(cx - rp, cy - ry2, cx + rp, cy + ry2); g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(1, 'rgba(255,255,255,.6)'); c.fillStyle = g2; c.beginPath(); c.ellipse(cx, cy, rp, ry2, sgn*ang, 0, Math.PI*2); c.fill(); }
    } else if(festeja){ c.fillStyle = piel; c.beginPath(); c.arc(mano[0], mano[1], Math.max(1.5, s*.05), 0, Math.PI*2); c.fill(); }
  };
  const sh = hombro[1] + s*.02;
  brazo(hombro[0] - lado*ancho*.46, sh, angO, -lado, s*.45, false);
  brazo(hombro[0] + lado*ancho*.46, sh, angP, lado, s*.5, true);
  const rc = Math.max(3, s*.13), gC = c.createRadialGradient(cabeza[0] - rc*.3, cabeza[1] - rc*.3, rc*.2, cabeza[0], cabeza[1], rc);
  gC.addColorStop(0, aclarar(piel, .15)); gC.addColorStop(1, pielOsc);
  c.fillStyle = gC; c.beginPath(); c.arc(cabeza[0], cabeza[1], rc, 0, Math.PI*2); c.fill();
  if(j.lado === 0 && tv){ c.fillStyle = '#2B1B12'; c.beginPath(); c.arc(cabeza[0], cabeza[1] - rc*.05, rc*.98, Math.PI*.95, Math.PI*2.05); c.fill(); }   // de espaldas: el pelo
  else { c.fillStyle = '#1B1B1B'; c.beginPath(); c.arc(cabeza[0] - rc*.35, cabeza[1] + rc*.05, Math.max(.8, rc*.12), 0, Math.PI*2); c.arc(cabeza[0] + rc*.35, cabeza[1] + rc*.05, Math.max(.8, rc*.12), 0, Math.PI*2); c.fill(); }
  c.fillStyle = oscurecer(j.color, .2); c.beginPath(); c.arc(cabeza[0], cabeza[1] - rc*.2, rc*1.03, Math.PI*1.02, Math.PI*1.98); c.fill();
  if(j.humano){ c.fillStyle = '#DCF54A'; c.font = `900 ${Math.max(11, s*.4)}px Inter, system-ui, sans-serif`; c.textAlign = 'center'; c.fillText('TÚ', cabeza[0], cabeza[1] - rc - 5); }
}

const nomTrim = w => `año ${Math.floor(w/4)} · T${(w % 4) + 1}`;

/* barra con la punta redondeada y la base recta, apoyada en el eje */
const barraPunta = (x, y, w, h, r) => { r = Math.min(r, w/2, h); return `M${x.toFixed(1)} ${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)} ${y.toFixed(1)} ${(x + w).toFixed(1)} ${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z`; };

/* la etiqueta de los gráficos: al pasar el dedo o el ratón por una barra o un punto */

/* ── Números que cuentan hasta su valor, y lo que hay que preparar después de pintar ── */
const NUMEROS_VISTOS = {};
function animarNumeros(){
  if(!hayDOM) return;
  prepararTooltips();
  const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(const el of document.querySelectorAll('[data-num]')){
    const v = +el.getAttribute('data-num'), k = el.getAttribute('data-clave') || '';
    const antes = k in NUMEROS_VISTOS ? NUMEROS_VISTOS[k] : el.hasAttribute('data-desde0') ? 0 : v;
    NUMEROS_VISTOS[k] = v;
    if(reducir || antes === v || !isFinite(v)) continue;
    const fmt = el.getAttribute('data-fmt'), pre = el.getAttribute('data-pre') || '', t0 = performance.now(), dur = 800;
    const pinta = x => { el.textContent = pre + (fmt === 'money' ? money(Math.round(x)) : Math.round(x)); };
    const paso = ahora => { const p = Math.min(1, (ahora - t0)/dur), e = 1 - Math.pow(1 - p, 3); pinta(antes + (v - antes)*e); if(p < 1 && el.isConnected) requestAnimationFrame(paso); };
    pinta(antes); requestAnimationFrame(paso);
  }
  for(const el of document.querySelectorAll('.llaves:not([data-visto])')){
    el.setAttribute('data-visto', '1');
    const a = el.querySelector('.llave-col.actual');
    if(a) el.scrollLeft = Math.max(0, a.offsetLeft - el.offsetLeft - 24);
  }
}

/* ═══ En el móvil, mientras juegas: la página de atrás no se mueve y no se hace zoom ═══
   Safari del iPhone ignora el overflow:hidden del body y el touch-action cuando hay dos
   dedos a la vez (joystick + botón) o toques muy seguidos: el juego se corría y se agrandaba. */
const BLOQUEO = { activo:false, y:0, meta:null };
function enPista(si){
  if(!hayDOM) return;
  document.body.classList.toggle('en-pista', si);
  if(BLOQUEO.activo === si) return;
  BLOQUEO.activo = si;
  const html = document.documentElement, meta = document.querySelector('meta[name="viewport"]');
  if(si){
    BLOQUEO.y = window.scrollY || html.scrollTop || 0;
    document.body.style.top = -BLOQUEO.y + 'px';
    html.classList.add('bloqueada');
    /* quita el zoom que hubiera y no deja hacerlo durante el partido */
    if(meta){ BLOQUEO.meta = meta.getAttribute('content'); meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'); }
  } else {
    html.classList.remove('bloqueada'); document.body.style.top = '';
    window.scrollTo(0, BLOQUEO.y);
    if(meta && BLOQUEO.meta) meta.setAttribute('content', BLOQUEO.meta);   // en los menús se puede volver a hacer zoom
  }
}
if(hayDOM){
  const bloqueada = () => document.documentElement.classList.contains('bloqueada');
  const noZoom = e => { if(bloqueada()) e.preventDefault(); };
  for(const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, noZoom, { passive:false });
  document.addEventListener('dblclick', noZoom, { passive:false });
  document.addEventListener('touchmove', e => { if(bloqueada() && (e.touches.length > 1 || (e.scale && e.scale !== 1))) e.preventDefault(); }, { passive:false });
  /* si cambia lo que se ve (la barra de Safari, girar el móvil), la pista se recoloca */
  const recolocar = () => { const jg = document.getElementById('juego'); if(jg && !jg.hidden && typeof ajustarLienzo === 'function'){ ajustarLienzo(); aplicarDisenoControles(); } };
  if(window.visualViewport) visualViewport.addEventListener('resize', recolocar);
  addEventListener('orientationchange', () => setTimeout(recolocar, 350));
}

   La bandera del país de fondo y, encima, la silueta de lo más conocido

   ═══════════════════════════════════════════════════════════════ */
/* ── Banderas, dibujadas para cualquier tamaño ── */
const f2 = x => +x.toFixed(2);
const rectB = (x, y, w, h, c) => `<rect x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}" fill="${c}"/>`;
const circB = (x, y, r, c) => `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" fill="${c}"/>`;
function bandasH(w, h, cols, pesos){
  pesos = pesos || cols.map(() => 1);
  const tot = pesos.reduce((a, b) => a + b, 0); let y = 0;
  return cols.map((c, i) => { const hh = h*pesos[i]/tot, r = rectB(0, y, w, hh + .4, c); y += hh; return r; }).join('');
}
function bandasV(w, h, cols, pesos){
  pesos = pesos || cols.map(() => 1);
  const tot = pesos.reduce((a, b) => a + b, 0); let x = 0;
  return cols.map((c, i) => { const ww = w*pesos[i]/tot, r = rectB(x, 0, ww + .4, h, c); x += ww; return r; }).join('');
}
const triB = (h, punta, c) => `<path d="M0 0L${f2(punta)} ${f2(h/2)}L0 ${f2(h)}Z" fill="${c}"/>`;
function estrellaB(x, y, r, c){
  let d = '';
  for(let i = 0; i < 10; i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r*.42 : r; d += (i ? 'L' : 'M') + f2(x + Math.cos(a)*rr) + ' ' + f2(y + Math.sin(a)*rr); }
  return `<path d="${d}Z" fill="${c}"/>`;
}
function cruzNordica(w, h, c){ const t = h*.2, x = Math.min(w*.3, h*.55); return rectB(x, 0, t, h, c) + rectB(0, h/2 - t/2, w, t, c); }
function dentado(w, h, ancho, c){
  let d = `M0 0H${f2(ancho)}`; const n = 9, p = h/n;
  for(let i = 0; i < n; i++) d += `L${f2(ancho + Math.min(w*.06, h*.12))} ${f2((i + .5)*p)}L${f2(ancho)} ${f2((i + 1)*p)}`;
  return `<path d="${d}H0Z" fill="${c}"/>`;
}

/* ═══════════════════════════════════════════════════════════════
   MIS CARRERAS
   Cada carrera vive en su propio hueco de este dispositivo y se guarda sola
   mientras juegas. Desde aquí cambias de carrera, guardas una copia, cambias
   los nombres o borras la que ya no quieras.
   ═══════════════════════════════════════════════════════════════ */
const CARRERAS_KEY = 'cabra_padel_carreras', CARRERA_PREF = 'cabra_padel_carrera_', MAX_CARRERAS = 12;
function leerCarreras(){
  try{ const x = JSON.parse(localStorage.getItem(CARRERAS_KEY) || 'null'); if(x && Array.isArray(x.lista)) return x; }catch(e){}
  return { lista: [] };
}
function escribirCarreras(idx){ try{ localStorage.setItem(CARRERAS_KEY, JSON.stringify(idx)); return true; }catch(e){ return false; } }
function nuevoIdCarrera(){ return 'c' + Date.now().toString(36) + Math.floor(Math.random()*46656).toString(36); }
function resumenCarrera(j){
  return { jugador: j.nombre, pais: j.pais, edad: j.edad, anio: j.anio, ranking: j.ranking || null,
           titulos: (j.titulos || []).length, retirado: !!j.retirado };
}
/* lo llama guardar(): la carrera que estás jugando, a su hueco */
function guardarEnCarrera(j, txt){
  if(!j || !j.idCarrera) return;
  try{
    localStorage.setItem(CARRERA_PREF + j.idCarrera, txt);
    const idx = leerCarreras();
    let c = idx.lista.find(x => x.id === j.idCarrera);
    if(!c){ c = { id: j.idCarrera, nombre: j.nombre, creada: Date.now() }; idx.lista.unshift(c); }
    c.guardada = Date.now(); c.resumen = resumenCarrera(j); idx.activa = j.idCarrera;
    escribirCarreras(idx);
  }catch(e){}
}
/* partidas de antes de que existieran los huecos: la carrera suelta pasa a la lista */
function asegurarCarreras(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d = JSON.parse(raw); if(!d || !d.j) return;
    const idx = leerCarreras();
    if(d.j.idCarrera && idx.lista.some(x => x.id === d.j.idCarrera)) return;
    const id = d.j.idCarrera || nuevoIdCarrera();
    d.j.idCarrera = id;
    if(S.j && !S.j.idCarrera) S.j.idCarrera = id;      // la misma carrera, si la estás jugando
    const txt = JSON.stringify(d);
    localStorage.setItem(SAVE_KEY, txt);
    guardarEnCarrera(d.j, txt);
  }catch(e){}
}
function listaCarreras(){ asegurarCarreras(); return leerCarreras().lista; }
function idCarreraActiva(){ try{ const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && d.j ? d.j.idCarrera || null : null; }catch(e){ return null; } }
function haceCuanto(t){
  if(!t) return 'hace un rato';
  const s = (Date.now() - t)/1000, d = new Date(t), hoy = new Date();
  const hh = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if(s < 60) return 'recién';
  if(s < 3600) return `hace ${Math.floor(s/60)} min`;
  if(d.toDateString() === hoy.toDateString()) return 'hoy, ' + hh;
  return `${d.getDate()}/${d.getMonth() + 1}, ${hh}`;
}
const fechaCorta = t => { const d = new Date(t); return `${d.getDate()}/${d.getMonth() + 1}`; };

/* ── Acciones ── */
function abrirCarreras(desde){ S.volverCarreras = desde || S.pantalla; S.pidiendo = null; S.pantalla = 'carreras'; render(); }
function jugarCarrera(id){
  let raw = null;
  try{ raw = localStorage.getItem(CARRERA_PREF + id); }catch(e){}
  if(!raw){ S.avisoCarreras = 'Esa carrera ya no está guardada en este dispositivo.'; render(); return; }
  if(S.j && S.j.idCarrera && S.j.idCarrera !== id) guardar();      // lo que llevabas queda en su hueco
  try{ localStorage.setItem(SAVE_KEY, raw); }catch(e){}
  S.pidiendo = null; S.avisoCarreras = null;
  continuarPartida();
}
function guardarAhora(){ if(!S.j) return; guardar(); S.avisoCarreras = 'Carrera guardada.'; render(); }
function guardarCopia(){
  if(!S.j) return;
  guardar();
  const idx = leerCarreras();
  if(idx.lista.length >= MAX_CARRERAS){ S.avisoCarreras = `Ya tienes ${MAX_CARRERAS} carreras: borra alguna para guardar otra copia.`; render(); return; }
  const orig = idx.lista.find(x => x.id === S.j.idCarrera), id = nuevoIdCarrera();
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    d.j.idCarrera = id;
    localStorage.setItem(CARRERA_PREF + id, JSON.stringify(d));
    idx.lista.splice(Math.max(0, idx.lista.indexOf(orig) + 1), 0,
      { id, nombre: `${orig ? orig.nombre : S.j.nombre} · copia ${fechaCorta(Date.now())}`, creada: Date.now(), guardada: Date.now(), resumen: resumenCarrera(d.j), copia: true });
    if(!escribirCarreras(idx)) throw 0;
    S.avisoCarreras = 'Copia guardada. Sigues jugando la carrera de siempre.';
  }catch(e){
    try{ localStorage.removeItem(CARRERA_PREF + id); }catch(_){}
    S.avisoCarreras = 'No queda sitio en este dispositivo para otra copia.';
  }
  render();
}
function guardarEdicion(id){
  const val = (sel, max) => { try{ const e = $(sel); return e && typeof e.value === 'string' ? e.value.trim().slice(0, max) : ''; }catch(err){ return ''; } };
  const nom = val('#ecNom', 32), jug = val('#ecJug', 26);
  if(nom.length < 1 || jug.length < 2){ S.avisoCarreras = 'Ponle un nombre a la carrera y al jugador (dos letras como mínimo).'; render(); return; }
  const idx = leerCarreras(), c = idx.lista.find(x => x.id === id);
  if(!c){ S.avisoCarreras = 'Esa carrera ya no está.'; render(); return; }
  c.nombre = nom;
  try{
    const raw = localStorage.getItem(CARRERA_PREF + id);
    if(raw){
      const d = JSON.parse(raw); d.j.nombre = jug;
      const txt = JSON.stringify(d);
      localStorage.setItem(CARRERA_PREF + id, txt);
      c.resumen = resumenCarrera(d.j);
      if(idCarreraActiva() === id) localStorage.setItem(SAVE_KEY, txt);
    }
  }catch(e){}
  if(S.j && S.j.idCarrera === id) S.j.nombre = jug;
  escribirCarreras(idx);
  S.pidiendo = null; S.avisoCarreras = 'Cambios guardados.';
  render();
}
function borrarCarrera(id){
  const idx = leerCarreras(), c = idx.lista.find(x => x.id === id);
  idx.lista = idx.lista.filter(x => x.id !== id);
  if(idx.activa === id) idx.activa = null;
  try{ localStorage.removeItem(CARRERA_PREF + id); }catch(e){}
  if(idCarreraActiva() === id) borrarSave();
  if(S.j && S.j.idCarrera === id){
    S.j = null; S.cal = null; S.trim = null; S.torneo = null; S.verTorneo = null; S.legado = null;
    S.pantalla = 'carreras';                 // sin carrera no hay temporada que pintar
  }
  escribirCarreras(idx);
  S.pidiendo = null; S.avisoCarreras = `Carrera borrada${c ? ': ' + c.nombre : ''}.`;
  render();
}
function nuevaCarreraLista(){
  if(listaCarreras().length >= MAX_CARRERAS){ S.avisoCarreras = `Ya tienes ${MAX_CARRERAS} carreras guardadas: borra alguna para empezar otra.`; abrirCarreras(S.pantalla); return; }
  CFG.error = null; irCrear();
}
/* al retirarte: la carrera queda guardada en su hueco y sueltas el mando */
function soltarCarrera(){ guardar(); borrarSave(); S.j = null; S.torneo = null; S.verTorneo = null; S.pantalla = 'inicio'; render(); }

/* ── La pantalla ── */
function vCarreras(){
  const lista = listaCarreras(), activa = idCarreraActiva(), aviso = S.avisoCarreras, pid = S.pidiendo || '';
  S.avisoCarreras = null;
  const volver = S.j ? (S.volverCarreras && S.volverCarreras !== 'carreras' ? S.volverCarreras : 'temporada') : 'inicio';

    <p class="sub" style="margin:0">Cada carrera se guarda sola mientras juegas. Aquí cambias de carrera, guardas una copia antes de un torneo grande, cambias los nombres o borras la que ya no quieras.</p>
    ${aviso ? `<div class="log ${/No queda|ya no|mínimo/.test(aviso) ? 'bad' : 'gold'}" style="margin:10px 0 0">${esc(aviso)}</div>` : ''}
    ${S.j ? `<div style="height:10px"></div><div class="row">
      <button class="btn sm" onclick="guardarAhora()">${ico('guardar')} GUARDAR AHORA</button>
      <button class="btn ghost sm" onclick="guardarCopia()">${ico('copiar')} GUARDAR UNA COPIA</button></div>` : ''}
  </div>
  ${lista.length ? lista.map(c => tarjetaCarrera(c, c.id === activa, pid)).join('')
    : `<div class="card"><p class="muted" style="margin:0">Todavía no tienes ninguna carrera guardada. Empieza una y se guardará sola.</p></div>`}
  <button class="btn" onclick="nuevaCarreraLista()">${ico('mas')} NUEVA CARRERA</button>
  <div style="height:8px"></div>
  ${volverAtras(() => { S.pantalla = volver; })}
  <p class="muted center" style="margin-top:12px">Todo se guarda en este dispositivo: si borras los datos del navegador, se van con ellos.</p>
  </div>`;
}
function tarjetaCarrera(c, activa, pid){
  const r = c.resumen || {}, p = r.pais ? paisPorId(r.pais) : null;
  const datos = [p ? p.nom : '', r.edad ? r.edad + ' años' : '', r.anio ? 'temporada ' + r.anio : '',
                 r.ranking ? '#' + r.ranking : 'sin ranking', `${r.titulos || 0} título${r.titulos === 1 ? '' : 's'}`].filter(Boolean).join(' · ');
  const estado = r.retirado ? '<span class="pill mal">RETIRADA</span>' : activa ? '<span class="pill acc">EN JUEGO</span>' : '';
  let acciones;
  if(pid === 'editar:' + c.id) acciones = `<div class="carrera-edit">
      <label>NOMBRE DE LA CARRERA<input type="text" id="ecNom" maxlength="32" value="${esc(c.nombre)}"></label>
      <label>NOMBRE DEL JUGADOR<input type="text" id="ecJug" maxlength="26" value="${esc(r.jugador || '')}"></label>

  else if(pid === 'borrar:' + c.id) acciones = `<div class="log bad" style="margin:0 0 9px">Se borra <b>${esc(c.nombre)}</b> y no se puede recuperar.</div>
    <div class="row"><button class="btn danger sm" onclick="borrarCarrera('${c.id}')">SÍ, BORRARLA</button>
      <button class="btn ghost sm" onclick="S.pidiendo=null;render()">CANCELAR</button></div>`;
  else acciones = `<div class="row">
      <button class="btn sm" onclick="jugarCarrera('${c.id}')">${ico('jugar')} ${activa && S.j ? 'SEGUIR' : 'JUGAR'}</button>
      <button class="btn ghost sm" onclick="S.pidiendo='editar:${c.id}';render()">${ico('lapiz')} EDITAR</button>
      <button class="btn ghost sm" onclick="S.pidiendo='borrar:${c.id}';render()">${ico('papelera')} BORRAR</button></div>`;
  return `<div class="card carrera ${activa ? 'activa' : ''}">
    <div class="carrera-cab">
      <span class="carrera-bandera"><svg viewBox="0 0 100 100" aria-hidden="true">${fondoBandera(r.pais, 100, 100)}</svg></span>
      <div class="carrera-info"><b>${esc(c.nombre)}</b><span>${c.nombre === r.jugador ? '' : esc(r.jugador || '') + (datos ? ' · ' : '')}${datos}</span><small>Guardada ${haceCuanto(c.guardada)}</small></div>
      ${estado}
    </div>
    ${acciones}</div>`;
}

const RONDAS_MUN = ['OCTAVOS', 'CUARTOS', 'SEMIFINAL', 'FINAL'];
const PREMIO_MUN = [1000, 3000, 6000, 12000, 25000];          // según hasta dónde llegues (el último, campeones)
const SIEMBRA16 = [1,16,8,9,4,13,5,12,2,15,7,10,3,14,6,11];
const nomSel = id => (SELECCIONES[id] || [id])[0];
const codSel = id => (SELECCIONES[id] || [0, id])[1];
const hayMundial = anio => anio >= 2 && anio % 2 === 0;
const TRIM_MUNDIAL = 3;                                          // octubre · diciembre
/* el nivel de cada pareja de una selección: la 1, la 2 y la 3 */
function rankParejaSel(id, k){ const f = (SELECCIONES[id] || [0, 0, 50])[2]; return Math.max(1, Math.round(Math.pow(10, (100 - f)/22)*[1, 2.6, 5.5][k])); }
const ratingParejaSel = (id, k) => ratingDeRank(rankParejaSel(id, k));
const probRatings = (a, b) => 1/(1 + Math.exp(-(a - b)/4.2));
const probEliminatoria = (p1, p2, p3) => p1*p2 + p1*p3 + p2*p3 - 2*p1*p2*p3;
function evMundial(mu){ return { t:'P1', nom:'Mundial de Selecciones', ciudad: mu.sede, pista:'indoor', pais: mu.sedePais, mundial:true }; }
function parejaSel(id, k){
  const o = duplaRival(rankParejaSel(id, k));
  o.flag = codSel(id); o.rating = ratingParejaSel(id, k) + rnd(-1, 1);
  return o;
}
/* ── Sorteo: las 16, el cuadro y los ganadores de todo lo que no es tuyo ── */
function crearMundial(j){
  const ed = j.anio/2, [sede, sedePais] = SEDES_MUNDIAL[(ed - 1) % SEDES_MUNDIAL.length], mio = j.pais;
  let ids = Object.keys(SELECCIONES).filter(id => id !== mio).sort((a, b) => SELECCIONES[b][2] - SELECCIONES[a][2]).slice(0, 15);
  ids.push(mio); ids.sort((a, b) => SELECCIONES[b][2] - SELECCIONES[a][2]);
  const cuadro = SIEMBRA16.map(s => ids[s - 1]);
  /* tu selección: tu pareja ocupa el sitio que le toca por nivel */
  const ev0 = { t:'P1', nom:'Mundial de Selecciones', ciudad: sede, pista:'indoor', pais: sedePais };
  const miNivel = ratingDupla(j, 'indoor', ev0);
  const slot = [0, 1, 2].filter(k => ratingParejaSel(mio, k) > miNivel).length > 1 ? 2 : ratingParejaSel(mio, 0) > miNivel ? 1 : 0;
  const pares = [0, 1, 2].map(k => { if(k === slot) return { yo:true }; const o = duplaRival(rankParejaSel(mio, k)); return { nombre:o.nombre, nombre2:o.nombre2, rating: ratingParejaSel(mio, k) }; });
  /* se sortea todo lo que no es tuyo: así cada rival de tu camino (y cada %) se sabe desde el principio */
  const rivales = [], arbol = []; let ronda = cuadro;
  for(let r = 0; r < 4; r++){
    const sig = [];
    for(let i = 0; i < ronda.length; i += 2){
      const a = ronda[i], b = ronda[i + 1];
      if(a === mio || b === mio){ rivales.push(a === mio ? b : a); sig.push(mio); }
      else sig.push(Math.random() < probSelecciones(a, b) ? a : b);
    }
    arbol.push(sig); ronda = sig;
  }
  const ev = { t:'P1', nom:'Mundial de Selecciones', ciudad: sede, pista:'indoor', pais: sedePais, mundial:true };
  const elims = rivales.map((riv, r) => ({ k: r, riv, fin: null, partidos: [0, 1, 2].map(k => {
    const opp = parejaSel(riv, k);
    if(k === slot) return { yo:true, opp, p: probPartido(j, opp, ev)/100, res:null };
    return { yo:false, opp, nuestra: pares[k], p: probRatings(pares[k].rating, opp.rating), res:null };
  }) }));
  return { a: j.anio, ed, sede, sedePais, mio, cuadro, rivales, arbol, elims, slot, pares, ronda:0, fin:null, hist:[], partidosGanados:0 };
}
const elimActual = mu => mu.elims[Math.min(mu.ronda, 3)];
/* dos selecciones que no son la tuya: la eliminatoria, con el nivel de sus tres parejas */
function probSelecciones(a, b){ const p = [0, 1, 2].map(k => probRatings(ratingParejaSel(a, k), ratingParejaSel(b, k))); return probEliminatoria(p[0], p[1], p[2]); }
/* los ganadores que se ven en el cuadro: cada ronda se destapa cuando se juega */
function ganadoresMundial(mu){
  const out = [], visible = r => !!mu.fin || r < mu.ronda || (r === mu.ronda && !!elimActual(mu).fin);
  let ronda = mu.cuadro;
  for(let r = 0; r < 4; r++){
    const sig = [];
    for(let i = 0; i < ronda.length; i += 2){
      const a = ronda[i], b = ronda[i + 1];
      let g = null;
      if(a != null && b != null && visible(r)){
        if(a === mu.mio || b === mu.mio){ const h = mu.hist.find(x => x.r === r); g = h ? (h.gane ? mu.mio : (a === mu.mio ? b : a)) : null; }
        else { const pre = mu.arbol[r][i/2]; g = pre === a || pre === b ? pre : ganadorOculto(mu, r, a, b); }
      }
      sig.push(g);
    }
    out.push(sig); ronda = sig;
  }
  return out;
}
/* las eliminatorias ajenas se deciden al sortear; para enseñarlas basta con repetir la misma cuenta, fija por semilla */
function ganadorOculto(mu, r, a, b){ return conSemilla(`${mu.a}|${r}|${a}|${b}`, () => Math.random() < probSelecciones(a, b) ? a : b); }
function chanceEliminatoria(e){ const p = e.partidos.map(x => x.res ? (x.res.gane ? 1 : 0) : x.p); return probEliminatoria(p[0], p[1], p[2]); }
function chanceTituloMundial(mu){
  if(mu.fin) return mu.fin.campeon ? 1 : 0;
  let acc = 1;
  for(let r = mu.ronda; r < 4; r++) acc *= chanceEliminatoria(mu.elims[r]);     // cada eliminatoria, con el % que se verá al jugarla
  return acc;
}
/* ── Acciones ── */
function abrirMundial(){

}
function simularMiPartidoMundial(){
  const mu = trimActual().mundial, e = mu && elimActual(mu); if(!e || e.fin || mu.fin) return;
  const x = e.partidos[mu.slot]; if(x.res) return;

}
function jugarMiPartidoMundial(){
  const j = S.j, mu = trimActual().mundial, e = mu && elimActual(mu); if(!e || e.fin || mu.fin) return;
  const x = e.partidos[mu.slot]; if(x.res) return;
  const ev = evMundial(mu), f = formatoCarrera(), rotulo = `MUNDIAL · ${RONDAS_MUN[mu.ronda]}`;
  const cfg = cfgPartidoCarrera(j, x.opp, ev, rotulo);

  cfg.equipos = [`${codSel(mu.mio)} ${apellido(j.nombre)}/${apellido(j.pareja ? j.pareja.nombre : 'Pareja')}`, `${codSel(e.riv)} ${apellido(x.opp.nombre)}/${apellido(x.opp.nombre2)}`];
  cfg.titulo = `${nomSel(mu.mio).toUpperCase()} – ${nomSel(e.riv).toUpperCase()}`;
  cfg.subtitulo = `Mundial de Selecciones · ${RONDAS_MUN[mu.ronda].toLowerCase()} · ${formatoTexto(f.sets, f.juegos, true)}`;
  cfg.avisoSub = `${nomSel(mu.mio)} contra ${nomSel(e.riv)}<br>${Math.round(x.p*100)}% de ganar si lo simulas`;
  cfg.alTerminar = rp => {
    const sets = (rp.sets && rp.sets.length ? rp.sets : [rp.juegos]).map(s => s[0] + '-' + s[1]);
    S.pantalla = 'mundialSel';

/* un marcador creíble para un partido ya decidido */
function marcadorMun(gane){ const a = pick(['6-3','6-4','7-5','6-2','7-6']); const s = [a]; if(Math.random() < .35) s.push(pick(['4-6','3-6','5-7'])), s.push(pick(['6-4','7-5','6-3'])); else s.push(pick(['6-4','6-3','7-5'])); return gane ? s : s.map(x => x.split('-').reverse().join('-')); }
function resolverMiPartidoMundial(gane, sets, silencio){
  const j = S.j, mu = trimActual().mundial, e = elimActual(mu), x = e.partidos[mu.slot];
  x.res = { gane, sets: sets || marcadorMun(gane), enPista: !!sets };
  j.energia = clamp(j.energia - 5, 0, 100);
  if(gane){ mu.partidosGanados++; j.mundial = (j.mundial || 0) + 1; }
  /* los otros dos partidos, con su % exacto */
  for(const y of e.partidos) if(!y.res) { const g = Math.random() < y.p; y.res = { gane: g, sets: marcadorMun(g) }; }
  const nuestros = e.partidos.filter(y => y.res.gane).length;

}

/* ═══════════════════════════════════════════════════════════════
   EL DESAFÍO DEL DÍA
   Uno por día, el mismo para todos ese día. Si lo cumples, plata para tu
   carrera y un día más de racha. Se puede reintentar hasta conseguirlo.
   ═══════════════════════════════════════════════════════════════ */
const fechaTexto = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const hoyTexto = () => fechaTexto(new Date());
const ayerTexto = () => { const d = new Date(); d.setDate(d.getDate() - 1); return fechaTexto(d); };
function estadoDesafio(){ return Object.assign({ f:null, racha:0, mejor:0, total:0 }, PREF.desafio || {}); }
const desafioHecho = () => estadoDesafio().f === hoyTexto();
const rachaSiGana = () => { const st = estadoDesafio(); return st.f === ayerTexto() ? st.racha + 1 : 1; };
const premioDesafio = racha => 2500 + 500*Math.min(Math.max(racha, 1), 6);
function desafioDeHoy(){
  const f = hoyTexto();
  return conSemilla('desafio|' + f, () => {
    const tipo = pick(['drill', 'drill', 'rival', 'limpio']);
    if(tipo === 'drill'){
      const id = pick(Object.keys(DRILLS)), obj = Math.min(9, DRILLS[id].objetivo + 2);
      return { f, tipo, id, obj, ic:'diana', tit:`${DRILLS[id].nom}: ${obj} de 10`, d:`En el entrenamiento de ${DRILLS[id].nom.toLowerCase()}, acierta ${obj} de las 10 bolas.` };
    }
    if(tipo === 'rival'){
      const k = Math.floor(Math.random()*ARQUETIPOS.length);
      return { f, tipo, k, ic:'trofeo', tit:'Gánale a una pareja top', d:`Partido a 4 juegos contra una pareja más fuerte de lo normal que juega a ${ARQUETIPOS[k].nom}.` };
    }
    return { f, tipo, ic:'estrella', tit:'Partido perfecto', d:'Gana un partido a 3 juegos sin ceder ni un juego: 3-0.' };
  });
}
function jugarDesafio(){
  if(desafioHecho()) return;
  const d = desafioDeHoy();
  S.desafio = d; S.volverDesafio = S.pantalla === 'desafio' ? (S.volverDesafio || 'inicio') : S.pantalla;
  if(d.tipo === 'drill'){ empezarEntreno(d.id); return; }
  const j = S.j && !S.j.retirado ? S.j : null, pos = j ? j.posicion : (PREF.posicion || 'reves');
  iniciarPartidoPista({
    humano: paramsHumanoPista(j), pareja: paramsParejaPista(j),
    rival: paramsRivalPista(difActual().rival + (d.tipo === 'rival' ? 1.3 : 0), ARQUETIPOS[d.k] || ARQUETIPOS[0]),
    carril: pos === 'drive' ? 'der' : 'izq', juegos: d.tipo === 'rival' ? 4 : 3, sets: 1, pPunto: .5, rapido: true,
    escena: { tipo:'pabellon', gente:.9, ciudad:'' }, equipos: [j ? nombreEquipo(j.nombre, j.pareja ? j.pareja.nombre : 'Pareja') : 'TÚ / PAREJA', 'DESAFÍO'],
    titulo: 'DESAFÍO DEL DÍA', subtitulo: d.d, avisoSub: d.d, rotulo: 'DESAFÍO DEL DÍA',
    alTerminar: res => cerrarDesafio(res),
  });
}
function cerrarDesafio(res){
  const d = S.desafio; S.desafio = null;
  if(!d) return;
  let ok = false;
  if(d.tipo === 'drill') ok = !!(res.drill && res.drill.aciertos >= d.obj);
  else if(d.tipo === 'rival') ok = !!res.gano;
  else { const s0 = (res.sets && res.sets[0]) || res.juegos; ok = !!res.gano && !!s0 && s0[1] === 0; }
  let premio = 0;
  if(ok && !desafioHecho()){
    const st = estadoDesafio(), racha = rachaSiGana();
    Object.assign(st, { f: hoyTexto(), racha, mejor: Math.max(st.mejor, racha), total: st.total + 1 });
    PREF.desafio = st; guardarPref();
    const j = S.j && !S.j.retirado ? S.j : null;
    if(j){ premio = premioDesafio(racha); j.dinero += premio; guardar(); }
  }
  S.desafioRes = { d, ok, premio, res };
  S.pantalla = 'desafio'; render();
}
/* ── La tarjeta, en la portada y en la temporada ── */
function desafioHTML(){
  if(typeof DRILLS === 'undefined') return '';
  const d = desafioDeHoy(), st = estadoDesafio(), hecho = desafioHecho(), j = S.j && !S.j.retirado ? S.j : null;
  const racha = hecho ? st.racha : (st.f === ayerTexto() ? st.racha : 0);
  return `<div class="card desafio ${hecho ? 'hecho' : ''}">
    <div class="des-top"><div class="eyebrow">${ico('calendario')} DESAFÍO DEL DÍA</div><span class="des-racha" title="Días seguidos">${ico('rayo')} ${racha} día${racha === 1 ? '' : 's'}</span></div>
    <div class="des-cuerpo"><span class="des-ico">${ico(d.ic)}</span><div style="min-width:0"><div class="des-tit">${esc(d.tit)}</div><p class="muted" style="margin:2px 0 0">${esc(d.d)}</p></div></div>
    ${hecho ? `<div class="des-ok">${ico('escudo')} Cumplido hoy. Mañana, otro.</div>`
      : `<div class="des-pie"><span class="des-premio">${j ? `Premio: <b>${money(premioDesafio(rachaSiGana()))}</b>` : 'Suma a tu racha'}</span><button class="btn sm" onclick="jugarDesafio()">${ico('jugar')} JUGAR</button></div>`}
  </div>`;
}
function vDesafio(){
  const r = S.desafioRes; if(!r){ S.pantalla = 'inicio'; return vInicio(); }
  const st = estadoDesafio(), volver = S.volverDesafio && !['desafio','finEntreno','finRapido'].includes(S.volverDesafio) ? S.volverDesafio : (S.j ? 'temporada' : 'inicio');
  return `<div class="fade">
  <div class="card ${r.ok ? 'event-hero' : 'event-hero mal'}">
    <div class="eyebrow">${ico('calendario')} DESAFÍO DEL DÍA</div>
    <div class="title-xl" style="margin:6px 0 6px">${r.ok ? '¡DESAFÍO CUMPLIDO!' : 'ESTA VEZ NO'}</div>
    <p class="sub" style="margin:0">${esc(r.d.tit)}. ${r.ok ? (r.premio ? `Cobras <b>${money(r.premio)}</b> para tu carrera.` : '') + ` Racha: <b>${st.racha} día${st.racha === 1 ? '' : 's'}</b> (tu mejor: ${st.mejor}).` : 'Puedes intentarlo otra vez: el desafío dura todo el día.'}</p>
  </div>
  ${r.ok ? '' : `<button class="btn" onclick="jugarDesafio()">${ico('jugar')} OTRA VEZ</button><div style="height:8px"></div>`}
  ${volverAtras(() => { S.desafioRes = null; S.pantalla = volver; })}</div>`;
}

/* ═══════════════════════════════════════════════════════════════
   EL ÍDOLO
   El modo para hacer una de las grandes carreras de la historia. Todo es más
   duro que en la carrera normal: rivales, ranking, crecimiento y ayudas. Se
   puede empezar de dos formas: desde abajo, con 17 años, o ya siendo una
   estrella del top 10 con 24. Al retirarte, tu carrera entra en la tabla.
   ═══════════════════════════════════════════════════════════════ */
const IDOLOS_KEY = 'cabra_padel_idolos', MAX_IDOLOS = 10;
const esIdolo = () => !!(typeof S !== 'undefined' && S && S.j && S.j.modo === 'idolo');
/* lo que endurece el modo, además de la dificultad que tengas puesta */
const IDOLO_DUREZA = { sim: 1.6, eleccion: .04, rival: 3, escala: 1.08, tasa: .88, libres: 1 };

/* ── Las metas de leyenda ── */
const METAS_IDOLO = [
  { id:'tit',  ic:'trofeo',   n:12, nom:'12 títulos',            d:'Doce torneos ganados en toda la carrera.',        v: j => j.titulos.length },
  { id:'mj',   ic:'estrella', n:3,  nom:'3 Majors',              d:'Los cuatro grandes del año son otra cosa.',       v: j => j.titulos.filter(t => t.tier === 'MJ').length },
  { id:'p1',   ic:'ranking',  n:5,  nom:'5 Premier P1 o Finals', d:'Los torneos más gordos después de los Majors.',   v: j => j.titulos.filter(t => t.tier === 'P1' || t.tier === 'FIN').length },
  { id:'n1',   ic:'pelota',   n:8,  nom:'8 fechas de nº 1',      d:'Aguantar en lo más alto, no solo llegar.',        v: j => j.trimN1 || 0 },
  { id:'mun',  ic:'llaves',   n:1,  nom:'1 Mundial',             d:'Levantar el Mundial con tu selección.',           v: j => j.mundialCopas || 0 },
  { id:'anos', ic:'calendario', n:12, nom:'12 temporadas',       d:'Vivir del pádel una carrera entera.',             v: j => j.anio },
];
const metaHecha = (m, j) => m.v(j) >= m.n;
function puntajeIdolo(j){
  const l = calcularLegado(j);
  const metas = METAS_IDOLO.filter(m => metaHecha(m, j)).length;
  return { pts: Math.round(l.pts + metas*12), rango: l.rango, txt: l.txt, metas, legado: l.pts };
}

/* ── La tabla de tus mejores carreras (en este dispositivo) ── */
function leerIdolos(){
  try{ const x = JSON.parse(localStorage.getItem(IDOLOS_KEY) || 'null'); if(Array.isArray(x)) return x; }catch(e){}
  return [];
}
function guardarIdolo(j){
  if(!j || j.modo !== 'idolo') return null;
  const p = puntajeIdolo(j);
  const ficha = { nombre: j.nombre, pais: j.pais, pts: p.pts, rango: p.rango, metas: p.metas, inicio: j.idoloInicio || 'abajo',
                  tit: j.titulos.length, mj: j.titulos.filter(t => t.tier === 'MJ').length, mun: j.mundialCopas || 0,
                  n1: j.trimN1 || 0, mejor: j.mejorRank || null, anios: j.anio, cuando: Date.now() };
  const lista = leerIdolos().concat([ficha]).sort((a, b) => b.pts - a.pts).slice(0, MAX_IDOLOS);
  try{ localStorage.setItem(IDOLOS_KEY, JSON.stringify(lista)); }catch(e){}
  return { ficha, puesto: lista.indexOf(ficha) + 1, lista };
}

/* ── Empezar una carrera de Ídolo ── */
function empezarIdolo(inicio){
  CFG.modo = 'idolo'; CFG.idoloInicio = inicio === 'estrella' ? 'estrella' : 'abajo';
  CFG.error = null;
  if(listaCarreras().length >= MAX_CARRERAS){ S.avisoCarreras = `Ya tienes ${MAX_CARRERAS} carreras guardadas: borra alguna para empezar otra.`; abrirCarreras('idolo'); return; }
  irCrear();
}
/* lo llama crearYEmpezar al final: ajusta la carrera según el modo elegido */
function arrancarIdolo(){
  const j = S.j; if(!j || CFG.modo !== 'idolo') { if(j) j.modo = j.modo || 'normal'; CFG.modo = null; return; }
  j.modo = 'idolo'; j.idoloInicio = CFG.idoloInicio || 'abajo'; j.trimN1 = 0;
  CFG.modo = null;
  if(j.idoloInicio !== 'estrella'){
    S.msgs = [{ tipo:'gold', txt:`🐐 <b>Modo Ídolo.</b> Empiezas como todos, pero aquí no regalan nada: rivales más duros, ranking más lento y ninguna ayuda. Al retirarte, tu carrera entra en la tabla de las mejores.` }].concat(S.msgs || []);
    return;
  }
  /* ya eres una estrella: 24 años, top 10 y una pareja de las buenas */
  j.edad = 24;
  for(const k of STAT_KEYS){ j.pot[k] = clamp(Math.max(j.pot[k], 86 + ri(-2, 4)), 60, 99); j.stats[k] = clamp(Math.round(j.pot[k] - ri(3, 8)), 40, 99); }
  j.dinero = 90000;
  const pts = ptsDeRank(8) + ri(0, 250);
  j.puntosHist = [];
  for(let t = 0; t < 4; t++) j.puntosHist.push({ w: j.anio*4 + t - 3, pts: Math.round(pts/4) });
  recalcRank(j);
  j.mejorRank = j.ranking;
  if(j.pareja){ j.pareja.nivel = clamp(ratingDeRank(ri(6, 16)), 40, 95); j.pareja.quimica = 62; j.pareja.nombre = j.pareja.nombre; }
  S.msgs = [{ tipo:'gold', txt:`🐐 <b>Modo Ídolo · ya eres una estrella.</b> Tienes 24 años y estás ${j.ranking ? 'el <b>#' + j.ranking + '</b> del mundo' : 'en el top 10'}, pero la vitrina está vacía. Ahora empieza lo difícil: ganar y quedarte arriba.` },
             { txt:`🤝 Juegas con <b>${esc(nomPareja(j.pareja))}</b>, de los mejores del circuito. La química se construye con victorias.` }];
}
/* al retirarte, la carrera entra en la tabla */
function cerrarIdolo(j){
  if(!j || j.modo !== 'idolo' || j.idoloGuardado) return;
  j.idoloGuardado = true;
  const r = guardarIdolo(j);
  if(r) S.idoloPuesto = r.puesto;
}

const realesDe = () => REALES[esF() ? 'F' : 'M'];
const idPareja = i => 'r' + (esF() ? 'f' : 'm') + i;

/* ── El circuito: las parejas de verdad ocupan los primeros puestos ── */
function parejaRealCircuito(rank, pool){
  const R = realesDe(), usados = new Set((pool || []).map(p => p.id));
  let i = rank - 1;
  if(!(R.parejas[i] && !usados.has(idPareja(i)))){          // ese puesto ya está cogido: la primera libre
    i = R.parejas.findIndex((p, k) => !usados.has(idPareja(k)));
    if(i < 0) return null;
  }
  const p = R.parejas[i];
  return { id: idPareja(i), nombre: p.a[0], nombre2: p.b[0], flag: p.a[1], flag2: p.b[1],
           arq: arqDe(p.arq), forma: rnd(-2, 2), titulos: p.tit, real: true };
}
/* Las carreras empezadas antes de que existiera el circuito real guardaron su
   top 40 inventado y se lo quedaban para siempre. Al retomarlas, las parejas de
   verdad ocupan los primeros puestos: cada casilla conserva la forma que
   llevaba y entra con los títulos que tiene esa pareja en 2026. */
function migrarCircuitoReal(j){
  if(!j || !j.circuito || !j.circuito.length) return false;
  if(j.circuito.some(p => p.real)) return false;
  const R = realesDe();
  for(let i = 0; i < R.parejas.length && i < j.circuito.length; i++){
    const p = R.parejas[i], viejo = j.circuito[i] || {};
    j.circuito[i] = { id: idPareja(i), nombre: p.a[0], nombre2: p.b[0], flag: p.a[1], flag2: p.b[1],
                      arq: arqDe(p.arq), forma: viejo.forma || 0, titulos: p.tit, real: true };
  }
  return true;
}

/* Los que andan sueltos, para cuando buscas pareja. Sólo aparecen cuando ya
   estás en el circuito de verdad (de club para abajo, la gente es de club) y
   cuando la edad que te ofrecen es la suya: si te buscan una promesa de 19,
   no te van a poner a un veterano de 40. */
const REALES_DADOS = [];
function jugadorRealLibre(cod, pos, nivel, edad){
  if(!(nivel >= 62)) return null;
  const R = realesDe(), usados = new Set(REALES_DADOS);
  const j = typeof S !== 'undefined' && S ? S.j : null;
  for(const p of (j && j.circuito) || []){ usados.add(p.nombre); usados.add(p.nombre2); }
  if(j && j.pareja) usados.add(j.pareja.nombre);
  let libres = R.libres.filter(x => !usados.has(x[0]) && (!pos || !x[2] || x[2] === pos));
  libres = edad ? libres.filter(x => Math.abs(x[3] - edad) <= 4) : libres.filter(x => x[3] <= 34);
  if(!libres.length) return null;
  const delPais = cod ? libres.filter(x => x[1] === cod) : [];
  const x = pick(delPais.length ? delPais : libres);
  REALES_DADOS.push(x[0]);
  if(REALES_DADOS.length > 6) REALES_DADOS.shift();
  return { nombre: x[0], flag: x[1], edad: x[3] };
}

/* ═══════════════════════════════════════════════════════════════
   EL CIRCUITO JUEGA SOLO
   Las otras parejas no están quietas esperándote. Al cerrarse cada trimestre
   juegan su calendario, con las mismas tablas de puntos que tú y la misma
   ventana de resultados, y el ranking sale de ahí: quien gana sube y quien deja
   de ganar se cae. Lo que pasó se cuenta en las noticias. Los puntos que se
   ven en el ranking son los de la tabla para cada puesto, los mismos con los
   que se mide el tuyo: así la lista siempre cuadra.
   ═══════════════════════════════════════════════════════════════ */

/* Qué torneos juega cada pareja según su puesto. Los de arriba no van a un FIP,
   y los del 25 para abajo no entran en todos los grandes. */
function juegaTorneo(puesto, t){
  if(t === 'FIN')  return puesto <= 8;
  if(t === 'MJ')   return Math.random() < (puesto <= 24 ? .94 : .82);
  if(t === 'P1')   return Math.random() < (puesto <= 24 ? .90 : .86);
  if(t === 'P2')   return Math.random() < (puesto <= 10 ? .30 : puesto <= 24 ? .62 : .82);
  if(t === 'FIP5') return Math.random() < (puesto <= 14 ? .02 : puesto <= 26 ? .10 : .26);
  if(t === 'FIP4') return puesto > 30 && Math.random() < .08;
  return false;                       // los FIP pequeños no son para el top 40
}
/* El nivel de una pareja es suyo, no de la casilla que ocupa */
function nivelPareja(p, puesto){
  if(p.nivel == null) p.nivel = ratingDeRank(puesto) + rnd(-.8, .8);
  return p.nivel + (p.forma || 0);
}
/* Sus puntos se cuentan igual que los tuyos: los diez mejores resultados de
   los últimos seis trimestres, y los dos más viejos pesan menos. */
function puntosPareja(p, w){
  const vig = [];
  for(const x of p.hist || []){ const peso = PESO_ANTIGUEDAD[w - x.w]; if(peso) vig.push(x.pts*peso); }
  vig.sort((a, b) => b - a);
  return Math.round(vig.slice(0, RESULTADOS_QUE_CUENTAN).reduce((a, b) => a + b, 0));
}
const wDe = j => j.anio*TRIMESTRES_POR_ANIO + j.trimestre;
/* los puntos de la tabla para un puesto, sin el recorte del Ídolo (ése es sólo tuyo) */
const ptsTabla = puesto => Math.round(ptsDeRank(puesto) / (typeof esIdolo === 'function' && esIdolo() ? IDOLO_DUREZA.escala : 1));
/* Al empezar (o al arreglar una carrera vieja) cada pareja arranca con los
   puntos que le tocan por su puesto, repartidos en los tres últimos trimestres. */
function sembrarCircuito(pool, ref, forzar){
  pool.forEach((p, i) => {
    const puesto = i + 1;
    if(p.nivel == null) p.nivel = ratingDeRank(puesto) + rnd(-.8, .8);
    if(forzar || !p.hist || !p.hist.length){
      p.hist = [];
      const trozo = Math.round(ptsTabla(puesto)/8);
      for(let k = 0; k < 8; k++) p.hist.push({ w: ref - 1 - (k % 3), pts: trozo });
    }
    p.pts = puntosPareja(p, ref);
  });
}
/* Un torneo suyo: cuántas rondas aguantan contra el cuadro de esa categoría */
function rondasQueGana(nivel, t, T){
  let r = 0;
  for(; r < T.rondas; r++){
    const riv = generarRival(t, r, T.rondas);
    if(Math.random() >= probRatings(nivel, riv.rating)) break;
  }
  return r;
}
/* Nadie juega el calendario entero: cada pareja elige tres o cuatro torneos
   del trimestre, los más gordos a los que llega, igual que tú. */
function torneosDePareja(puesto, evs){
  const puede = evs.filter(ev => juegaTorneo(puesto, ev.t));
  puede.sort((a, b) => (orden(b.t) + rnd(-.7, .7)) - (orden(a.t) + rnd(-.7, .7)));
  /* los de arriba eligen; los de abajo persiguen puntos y juegan más */
  return puede.slice(0, puesto <= 24 ? ri(3, 4) : ri(4, 5));
}
/* El trimestre del circuito, torneo a torneo. Cada pareja aguanta lo que aguanta
   contra el cuadro, y luego se pone orden como en un cuadro de verdad: un solo
   campeón, como mucho dos en la final, cuatro en semis... Así en las noticias
   nunca hay dos campeones del mismo torneo. */
function simularTrimestreCircuito(j, pool, w, jugados, evs){
  const mios = new Set(jugados || []);
  evs = (evs || []).filter(ev => !mios.has(ev.id) && TIERS[ev.t] && TIERS[ev.t].pts && TIERS[ev.t].pts[0]);
  const inscritos = new Map();
  pool.forEach((p, i) => {
    for(const ev of torneosDePareja(i + 1, evs)){
      if(!inscritos.has(ev.id)) inscritos.set(ev.id, []);
      inscritos.get(ev.id).push({ p, puesto: i + 1 });
    }
  });
  const resultados = [];
  for(const ev of evs){
    const lista = inscritos.get(ev.id);
    if(!lista) continue;
    const T = TIERS[ev.t];
    for(const x of lista){ x.ganadas = rondasQueGana(nivelPareja(x.p, x.puesto), ev.t, T); x.azar = Math.random(); }
    lista.sort((a, b) => b.ganadas - a.ganadas || a.azar - b.azar);
    lista.forEach((x, k) => {
      x.ganadas = Math.min(x.ganadas, T.rondas - Math.ceil(Math.log2(k + 1)));
      const pts = T.pts[Math.max(0, T.rondas - x.ganadas)] || 0;
      if(pts > 0) x.p.hist.push({ w, pts });
      if(x.ganadas >= T.rondas) x.p.titulos = (x.p.titulos || 0) + 1;
    });
    resultados.push({ ev, campeon: lista[0].ganadas >= T.rondas ? lista[0].p : null,
                      finalista: lista[1] && lista[1].ganadas >= T.rondas - 1 ? lista[1].p : null });
  }
  return resultados;
}
/* Y el nivel se mueve despacio: se mejora, se aguanta y se cae. Tira un poco
   hacia el nivel que se le supone a su puesto; si no, el que sube por suerte
   se queda arriba para siempre y el circuito acaba siendo imbatible. */
function moverNivelCircuito(pool){
  pool.forEach((p, i) => {
    p.forma = clamp((p.forma || 0)*.7 + rnd(-1.2, 1.2), -3, 3);
    const suyo = p.nivel == null ? ratingDeRank(i + 1) : p.nivel;
    p.nivel = clamp(suyo*.9 + ratingDeRank(i + 1)*.1 + rnd(-.5, .5), ratingDeRank(90), ratingDeRank(1) + 1.2);
  });
}

/* ── El cierre del trimestre del circuito: se llama al pasar de trimestre, una
      sola vez por trimestre, pase lo que pase en el tuyo (torneos, entreno,
      lesión). Los puntos quedan contados para el trimestre que empieza, que es
      cuando se mira tu ranking. ── */
function cerrarCircuitoTrimestre(j){
  if(!j || j.retirado) return;
  const w = wDe(j);
  if(j.circuitoW === w) return;
  const pool = asegurarCircuito(j);
  if(!pool.length) return;
  if(j.circuitoW == null) sembrarCircuito(pool, w, true);        // carrera de antes del arreglo: se reparte de nuevo
  j.circuitoW = w;
  const antes = pool.slice(0, 20).map(p => p.id), numero1 = pool[0].id;
  let evs = [];
  try{ evs = torneosDelTrimestre(); }catch(e){ evs = []; }
  const jugados = S.trim && S.trim.clave === j.anio + '-' + j.trimestre ? S.trim.jugados : [];
  moverNivelCircuito(pool);
  const res = simularTrimestreCircuito(j, pool, w, jugados, evs);
  for(const p of pool){
    p.hist = (p.hist || []).filter(x => w + 1 - x.w < PESO_ANTIGUEDAD.length).slice(-40);
    p.pts = puntosPareja(p, w + 1);
  }
  pool.sort((a, b) => (b.pts || 0) - (a.pts || 0));
  /* relevo abajo: alguien deja el circuito y entra una pareja nueva con los puntos de su puesto */
  if(Math.random() < .3){
    pool.splice(ri(28, pool.length - 1), 1);
    const nueva = nuevaParejaCircuito(40, pool), puesto = ri(30, 40);
    nueva.nivel = ratingDeRank(puesto) + rnd(-.5, .5);
    nueva.hist = [];
    const trozo = Math.round(ptsTabla(puesto)/8);
    for(let k = 0; k < 8; k++) nueva.hist.push({ w: w - (k % 3), pts: trozo });
    nueva.pts = puntosPareja(nueva, w + 1);
    pool.push(nueva);
    pool.sort((a, b) => (b.pts || 0) - (a.pts || 0));
  }
  j.noticias = hacerNoticias(j, pool, res, antes, numero1, w);
}

/* ── Las noticias del trimestre ── */
const nomCorto = p => `${esc(apellidoDe(p.nombre))} / ${esc(apellidoDe(p.nombre2))}`;
function apellidoDe(n){ const x = String(n || '').trim().split(' '); return x.length > 2 && /^(di|de|del|dal|van|la)$/i.test(x[x.length - 2]) ? x.slice(-2).join(' ') : x[x.length - 1]; }
function hacerNoticias(j, pool, res, antes, numero1, w){
  const items = [];
  if(j.noticiasFichaje){ items.push(...j.noticiasFichaje); j.noticiasFichaje = null; }
  const rivales = new Set((typeof rivalidades === 'function' ? rivalidades(j) : []).map(r => r.id));
  /* los títulos grandes; si no hubo, los P2 */
  const grandes = res.filter(r => r.campeon && ['FIN','MJ','P1'].includes(r.ev.t)).sort((a, b) => orden(b.ev.t) - orden(a.ev.t));
  const lista = grandes.length ? grandes : res.filter(r => r.campeon && r.ev.t === 'P2');
  for(const r of lista.slice(0, 3)){
    const que = r.ev.t === 'FIN' ? 'las Finals' : 'el ' + esc(r.ev.nom);
    const rival = rivales.has(r.campeon.id);
    items.push({ ic: rival ? '⚔️' : '🏆', txt: `${rival ? 'Tus rivales ' : ''}<b>${nomCorto(r.campeon)}</b> ganan ${que}${r.finalista ? ` contra ${nomCorto(r.finalista)}` : ''}.` });
  }
  /* el número 1 */
  if(pool[0] && pool[0].id !== numero1) items.push({ ic:'👑', txt:`<b>${nomCorto(pool[0])}</b>, nuevo número 1 del mundo.` });
  /* quién sube y quién cae en el top 20 (con tu casilla contada) */
  const tuyo = pos => pos + (j.ranking && j.ranking <= pos ? 1 : 0);
  let sube = null, cae = null;
  pool.forEach((p, i) => {
    const a = antes.indexOf(p.id);
    if(a < 0) return;
    const d = a - i;
    if(i < 20 && d >= 3 && (!sube || d > sube.d)) sube = { p, d, de: tuyo(a + 1), a: tuyo(i + 1) };
    if(-d >= 3 && (!cae || -d > cae.d)) cae = { p, d: -d, de: tuyo(a + 1), a: tuyo(i + 1) };
  });
  if(sube) items.push({ ic:'📈', txt:`<b>${nomCorto(sube.p)}</b> suben del #${sube.de} al #${sube.a}.` });
  if(cae)  items.push({ ic:'📉', txt:`<b>${nomCorto(cae.p)}</b> caen del #${cae.de} al #${cae.a}.` });
  return { w, anio: j.anio, trimestre: j.trimestre, items: items.slice(0, 6) };
}
function noticiasHTML(j){
  const n = j && j.noticias;
  if(!n || !n.items || !n.items.length || n.w !== wDe(j) - 1) return '';
  return `<div class="card"><div class="eyebrow">📰 EL CIRCUITO, EL TRIMESTRE PASADO</div><div style="height:4px"></div>
    ${n.items.map(x => `<div class="li"><span class="ic" style="font-size:17px;width:22px;text-align:center">${x.ic}</span><div class="g"><span style="color:var(--text);font-size:14px;line-height:1.45">${x.txt}</span></div></div>`).join('')}
    <button class="btn ghost sm" style="margin-top:9px" onclick="S.pantalla='ranking';render()">${ico('ranking')} VER EL RANKING</button></div>`;
}

/* ── En el ranking: quién tienes justo delante y detrás, y cuánto te falta ── */
function alrededorHTML(j){
  const r = j && j.ranking;
  if(!r || r <= 20) return '';
  const pool = asegurarCircuito(j), pts = puntosActuales(j);
  const faltan = rr => Math.max(1, ptsDeRank(rr) - pts + 1);
  if(r > pool.length + 1){
    const ult = pool[pool.length - 1];
    return `<div class="card"><div class="eyebrow">${ico('ranking')} A TU ALREDEDOR</div>
      <p class="sub" style="margin:6px 0 0">Estás en el <b>#${r}</b> con ${pts} pts. Para entrar en el top 40 te faltan <b>${faltan(40)} pts</b>. Ahí están ${fichaPais(ult.flag)} <b>${esc(ult.nombre)} / ${esc(ult.nombre2)}</b>.</p></div>`;
  }
  const fila = rr => {
    if(rr === r) return `<div class="rk-fila tu"><span class="rk-n">#${rr}</span><span class="rk-nm">${fichaPais(j.cod)} <b>${esc(j.nombre)} / ${esc(j.pareja ? j.pareja.nombre : '—')}</b><small>Vosotros</small></span><span class="rk-pt">${pts} pts</span></div>`;
    const p = pool[casillaDeRank(j, rr) - 1];
    if(!p) return '';
    return `<div class="rk-fila"><span class="rk-n">#${rr}</span><span class="rk-nm">${fichaPais(p.flag)} ${esc(p.nombre)} / ${p.flag2 && p.flag2 !== p.flag ? fichaPais(p.flag2) + ' ' : ''}${esc(p.nombre2)}<small>${p.titulos || 0} título${p.titulos === 1 ? '' : 's'}</small></span><span class="rk-pt">${ptsDeRank(rr)} pts</span></div>`;
  };
  const arriba = pool[casillaDeRank(j, r - 1) - 1];
  return `<div class="card"><div class="eyebrow">${ico('ranking')} A TU ALREDEDOR</div><div style="height:4px"></div>
    ${[r - 2, r - 1, r, r + 1, r + 2].filter(x => x >= 1).map(fila).join('')}
    ${arriba ? `<p class="muted" style="margin:9px 0 0">Para pasar a <b style="color:var(--text)">${esc(arriba.nombre)} / ${esc(arriba.nombre2)}</b> (#${r - 1}) te faltan <b style="color:var(--text)">${faltan(r - 1)} pts</b>.</p>` : ''}</div>`;
}

/* ── Jugar con una estrella: si estás arriba, alguien del top te llama.
      Deja a su pareja y ella busca otra. ── */
function candidataEstrella(j){
  if(!j || !j.ranking || j.ranking > 12 || typeof REALES === 'undefined') return null;
  if(Math.random() > .6) return null;
  const pool = asegurarCircuito(j), R = realesDe();
  /* nadie deja el número 1 para irse con el 12: te llaman los que andan cerca de ti */
  const desde = Math.max(0, j.ranking - 7), hasta = Math.min(pool.length, j.ranking + 6);
  const opciones = pool.slice(desde, hasta).filter(p => p.real);
  if(!opciones.length) return null;
  const par = pick(opciones), puesto = pool.indexOf(par) + 1, quiere = posContraria(j.posicion);
  const datos = [];
  for(const x of R.parejas) for(const pl of [x.a, x.b]) if(pl[0] === par.nombre || pl[0] === par.nombre2) datos.push(pl);
  if(!datos.length) return null;
  const el = datos.find(pl => pl[2] === quiere) || pick(datos);
  const otro = el[0] === par.nombre ? par.nombre2 : par.nombre;
  const nivel = clamp(ratingDeRank(puesto) + rnd(.5, 2), 60, 97);
  const encajan = Object.keys(ESTILOS).filter(e => ROL_ESTILO[e] !== ROL_ESTILO[j.estilo]);
  const c = nuevaPareja(nivel, el[1], quiere, el[3], pick(encajan.length ? encajan : Object.keys(ESTILOS)));
  Object.assign(c, { nombre: el[0], flag: el[1], edad: el[3], apodo: null, real: true, etq: 'ESTRELLA DEL CIRCUITO' });
  c.quimicaInicial = ri(30, 42);
  c.prima = Math.round(1.4 * (2000 + Math.pow(Math.max(0, nivel - 45), 2.4)*38));
  c.exigeRank = Math.max(3, puesto + 3);
  c.estrella = { par: par.id, companero: otro, puesto };
  return c;
}
function ficharEstrella(j, c){
  const pool = asegurarCircuito(j), par = pool.find(p => p.id === c.estrella.par);
  if(!par) return;
  const libre = jugadorRealLibre(null, null, 80, null);
  const nuevo = libre || { nombre: pick(nombresDePila()) + ' ' + pick(NOM_B), flag: pick(NAC_RIV) };
  if(par.nombre === c.nombre){ par.nombre = par.nombre2; par.flag = par.flag2; }
  par.nombre2 = nuevo.nombre; par.flag2 = nuevo.flag;
  par.nivel = (par.nivel == null ? ratingDeRank(c.estrella.puesto) : par.nivel) - 1.8;   // la pareja nueva todavía no rinde
  j.noticiasFichaje = [{ ic:'💔', txt:`<b>${esc(c.nombre)}</b> deja a <b>${esc(c.estrella.companero)}</b> para jugar contigo. ${esc(c.estrella.companero)} sigue con <b>${esc(nuevo.nombre)}</b>.` }];
}

/* ═══════════════════════════════════════════════════════════════
   DOS TEMAS
   "Día de pista" (claro, el de siempre desde ahora) y el oscuro de antes.
   Todo el color de la interfaz sale de variables: cambiar de tema es cambiar
   un atributo en <html>. La pista, las banderas y las cartas no cambian.
   ═══════════════════════════════════════════════════════════════ */
const FAVICON_CLARO = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233D4BFF'/%3E%3Crect x='14' y='11' width='36' height='42' rx='17' fill='%23C6F000'/%3E%3Ccircle cx='24' cy='24' r='2.6' fill='%233D4BFF'/%3E%3Ccircle cx='32' cy='24' r='2.6' fill='%233D4BFF'/%3E%3Ccircle cx='40' cy='24' r='2.6' fill='%233D4BFF'/%3E%3Ccircle cx='24' cy='33' r='2.6' fill='%233D4BFF'/%3E%3Ccircle cx='32' cy='33' r='2.6' fill='%233D4BFF'/%3E%3Ccircle cx='40' cy='33' r='2.6' fill='%233D4BFF'/%3E%3C/svg%3E";
function temaActual(){ return typeof PREF !== 'undefined' && PREF && PREF.tema === 'oscuro' ? 'oscuro' : 'claro'; }
function aplicarTema(){
  if(!hayDOM) return;
  const t = temaActual(), html = document.documentElement;
  if(html.getAttribute('data-tema') !== t) html.setAttribute('data-tema', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'claro' ? '#EEF1FF' : '#08191C');
  const link = document.querySelector('link[rel="icon"]');
  if(link){
    if(!link.dataset.oscuro) link.dataset.oscuro = link.getAttribute('href');
    const quiere = t === 'claro' ? FAVICON_CLARO : link.dataset.oscuro;
    if(link.getAttribute('href') !== quiere) link.setAttribute('href', quiere);
  }
}
function cambiarTema(t){
  PREF.tema = (t === 'claro' || t === 'oscuro') ? t : (temaActual() === 'claro' ? 'oscuro' : 'claro');
  guardarPref(); aplicarTema(); render();
}
/* el botón de arriba a la derecha: enseña el tema al que te lleva */
function botonTema(){
  const claro = temaActual() === 'claro';
  return `<button class="tema-top" onclick="cambiarTema()" aria-label="${claro ? 'Pasar al modo oscuro' : 'Pasar al modo claro'}">${ico(claro ? 'luna' : 'sol')}<span>${claro ? 'OSCURO' : 'CLARO'}</span></button>`;
}
/* y la tarjeta en Cómo se juega, con las dos opciones a la vista */
function temaHTML(){
  const t = temaActual();
  const opcion = (id, ic, nom, d) => `<button class="opt ${t === id ? 'on' : ''}" onclick="cambiarTema('${id}')"><span class="ic">${ico(ic)}</span><span><span class="t">${nom}</span><span class="d">${d}</span></span></button>`;
  return `<div class="card"><div class="eyebrow">${ico(t === 'claro' ? 'sol' : 'luna')} APARIENCIA</div><div style="height:8px"></div>
    <div class="g2">
      ${opcion('claro', 'sol', 'MODO CLARO', 'Día de pista: blanco, azul y rosa.')}
      ${opcion('oscuro', 'luna', 'MODO OSCURO', 'El de noche: verde pista y lima.')}
    </div>
    <p class="muted" style="margin:8px 0 0">También se cambia con el botón de arriba a la derecha.</p></div>`;
}

/* ─────────── ARRANQUE ─────────── */
S = { pantalla:'inicio', j:null, cal:null, msgs:[], pantallaPrevia:null, trim:null, torneo:null };
render();
</script>
