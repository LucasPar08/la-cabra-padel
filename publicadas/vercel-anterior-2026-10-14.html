      if(cal >= .88){ P.stats.perfectos++; Efectos.texto(j.x, j.y - .9, dePared ? '¡SALIDA PERFECTA!' : PERFECTO_GOLPE[tipo], '#F5C542'); }
      else if(dePared) Efectos.texto(j.x, j.y - .9, 'SALIDA DE PARED', '#7FD3F7');
      else if(tipo !== 'drive' && tipo !== 'volea') Efectos.texto(j.x, j.y - .9, NOMBRE_GOLPE[tipo], COLOR_GOLPE[tipo]);
      else if(ap && ap.nombre) Efectos.texto(j.x, j.y - .9, ap.nombre, '#F4F6F8');

}
/* Con la asistencia puesta, brilla el botón que conviene para la bola que viene */
function sugerencia(j){
  const b = P.bola;

  const pasado = P.t - P.tGolpe;
  let mejor = null, dMin = 3.5;
  for(const s of P.prediccion){
    if(s.t < pasado || ladoDe(s.y) !== j.lado || !s.cruzo || (s.saque && s.botes === 0) || s.z > 2.9) continue;
    if(s.botes === 0 && Math.abs(s.y - RED_Y) > 5.5) continue;
    const d = Math.hypot(s.x - j.x, s.y - j.y);
    if(d < dMin){ dMin = d; mejor = s; }
  }
  if(!mejor) return null;
  const enRed = P.jug.filter(o => o.lado !== j.lado && Math.abs(o.y - RED_Y) < 4.3).length, cercaRed = Math.abs(j.y - RED_Y) < 5.2;

}
function sugerirBoton(j){

  if(sg === P.sug) return;
  P.sug = sg;
  for(const el of document.querySelectorAll('#controlesP .accion')) el.classList.toggle('sugerido', el.dataset.accion === sg);

/* ── La máquina: tu pareja y los rivales ── */
function esMiBola(j, s){
  const comp = P.jug.find(o => o.lado === j.lado && o.id !== j.id);
  if(!comp || comp.inactivo) return true;
  if(j.carril === 'izq' ? s.x >= 5.4 : s.x < 4.6) return false;
  if(s.x >= 4.6 && s.x < 5.4) return Math.hypot(s.x-j.x, s.y-j.y) <= Math.hypot(s.x-comp.x, s.y-comp.y);
  return true;
}
function objetivoJugador(j){
  const b = P.bola;

    const pasado = P.t - P.tGolpe, ajuste = j.lado === 0 ? .3 : -.3;

      const ok = P.drill && j.humano ? okDrill(s) : s.botes >= 1 ? (s.z >= .2 && s.z <= 1.6) : (s.z >= .6 && s.z <= 2.3 && Math.abs(s.y - RED_Y) < 5.5);

      if(Math.hypot(s.x - j.x, s.y - j.y) / j.vel <= s.t - pasado + .06) return conLectura(j, s, ajuste);

}
function posicionBase(j){
  const b = P.bola, x = j.carril === 'izq' ? 2.7 : 7.3;

  if(P.estado === 'juego' && b.viva && b.golpeo !== null && b.golpeo !== j.lado && ['globo','remate','vibora'].includes(b.ultimoTiro)) arriba = false;

}
function actualizarIA(j, dt){
  const o = objetivoJugador(j);
  moverHacia(j, o.x, o.y, j.vel * (o.va ? 1 : .7));
  aplicarMovimiento(j, dt);
  if(j.cd > 0) j.cd -= dt;
  if(j.anim > 0) j.anim -= dt;
  if(P.estado === 'saque' && P.saqueDe === j.id){ if(P.timer <= 0) sacar(j, clamp(j.hab + .15 + gauss()*.08, .3, 1)); return; }
  if(j.cd <= 0 && !j.noGolpea && alcanzable(j)) decidirIA(j);
}
function decidirIA(j){
  const b = P.bola, rivales = P.jug.filter(o => o.lado !== j.lado);
  const enRed = rivales.filter(o => Math.abs(o.y - RED_Y) < 4.3).length, cercaRed = Math.abs(j.y - RED_Y) < 5;
  let tipo;
  if(b.z > 1.7) tipo = cercaRed && Math.random() < j.agresivo ? (b.z > 2 ? 'remate' : 'vibora') : (Math.random() < .3 ? 'vibora' : 'bandeja');
  else if(enRed >= 1 && Math.random() < j.globeador) tipo = 'globo';
  else if(b.botes === 0) tipo = 'volea';
  else if(enRed === 0 && cercaRed && Math.random() < .22) tipo = 'dejada';
  else if(enRed === 2 && !cercaRed && Math.random() < .18) tipo = 'chiquita';
  else tipo = 'drive';
  const cerca = rivales.slice().sort((p,q) => Math.abs(p.x - b.x) - Math.abs(q.x - b.x))[0];
  /* Devolver un remate o una bola muy baja o muy alta cuesta más */
  const dificultad = clamp((Math.hypot(b.vx, b.vy) - 8)/14, 0, .35) + (b.z > 2.3 || b.z < .25 ? .12 : 0);
  golpear(j, tipo, clamp(j.hab + gauss()*.12 - dificultad, .12, .97), cerca.x < 5 ? rnd(6.2, 8.9) : rnd(1.1, 3.8));
}
function sacar(j, calidad){
  const b = P.bola;
  Object.assign(b, { x:j.x, y:j.y + (j.lado === 0 ? -.35 : .35), z:.9, viva:true, rastro:[] });
  P.saqueX = j.x; P.estado = 'juego';

/* ═══════════════════════════════════════════════════════════════
   EFECTOS · DIBUJO · MARCADOR
   ═══════════════════════════════════════════════════════════════ */
const Efectos = {
  particulas:[], shake:0,
  reset(){ this.particulas = []; this.shake = 0; },
  golpe(x, y, tipo, cal){
    const z = P && P.bola ? P.bola.z : .9, fuerte = tipo === 'remate' || tipo === 'vibora' || tipo === 'plano', n = fuerte ? 16 : 6;
    for(let i = 0; i < n; i++) this.particulas.push({ x, y, z, vx:rnd(-2.5,2.5), vy:rnd(-2.5,2.5), vida:.35, max:.35, color: fuerte ? '#F5C542' : '#DCF54A' });
    this.particulas.push({ x, y, z, pared:true, anillo:true, vida:.25, max:.25, r0:.15, r1: fuerte ? 1.1 : .6, color: fuerte ? '#F5C542' : 'rgba(255,255,255,.7)' });
    if(fuerte) this.sacudir(6);
  },
  bote(x, y){ this.particulas.push({ x, y, anillo:true, vida:.3, max:.3, r0:.1, r1:.6, color:'rgba(255,255,255,.55)' }); },
  cristal(x, y, z){ this.particulas.push({ x, y, z: z == null ? 1 : z, pared:true, anillo:true, vida:.4, max:.4, r0:.15, r1:.8, color:'#7FD3F7' }); this.sacudir(2); },
  reja(x, y, z){ this.particulas.push({ x, y, z: z == null ? 1 : z, pared:true, anillo:true, vida:.35, max:.35, r0:.1, r1:.55, color:'#C9D3DC' }); this.sacudir(1); },
  sacudir(m){ this.shake = Math.max(this.shake, m); },
  confeti(){ for(let i = 0; i < 40; i++) this.particulas.push({ x:rnd(1,9), y:rnd(11,19), z:rnd(.8,2.2), vx:rnd(-1.5,1.5), vy:rnd(-3,-.5), vida:rnd(.7,1.2), max:1.2, color:pick(['#DCF54A','#22D3A5','#F5C542','#7FD3F7']) }); },
  texto(x, y, t, color){ this.particulas.push({ x, y, texto:t, vida:.85, max:.85, color }); },
  actualizar(dt){
    for(const p of this.particulas){ p.vida -= dt; if(!p.anillo && !p.texto){ p.x += p.vx*dt; p.y += p.vy*dt; } }
    this.particulas = this.particulas.filter(p => p.vida > 0);
    this.shake *= Math.pow(.02, dt);
  },
};

/* ── La cámara ──
   Como en la tele: detrás y por encima de tu fondo, con perspectiva (lo de lejos se ve más pequeño y los
   cristales y la malla se levantan). También se puede ver desde arriba, como antes.
   proy(x, y, z) → [X, Y, s]: el punto en pantalla y cuántos píxeles mide un metro a esa distancia. */
let CV = null, CX = null, DPR = 1, VISTA = 'tv', CAM = null, FONDO = null, ESC = 20, OX = 0, OY = 0;
const ANG_TV = 52*Math.PI/180, ANG_TV_MIN = 40*Math.PI/180, DIST_TV = 27;
function proyTV(x, y, z){
  const dy = CAM.yc - y, dz = CAM.hc - z, d = Math.max(.5, dy*CAM.cos + dz*CAM.sin), u = dy*CAM.sin - dz*CAM.cos, s = CAM.F/d;
  return [CAM.cx + (x - W/2)*s, CAM.cy - u*s, s];
}
function proy(x, y, z){
  z = z || 0;
  return VISTA === 'tv' ? proyTV(x, y, z) : [OX + x*ESC, OY + y*ESC - z*ESC*.55, ESC];
}
function ajustarLienzo(){
  if(!hayDOM) return;
  CV = $('#lienzo'); CX = CV.getContext('2d');
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  CV.width = Math.round(w*DPR); CV.height = Math.round(h*DPR);
  const tactil = !matchMedia('(hover:hover) and (pointer:fine)').matches;
  const arriba = 64, abajo = tactil && !PREF.posBotones ? Math.round(232*(PREF.tamBotones || 1)) : tactil ? 150 : 44, Ha = h - arriba - abajo;
  VISTA = PREF.vista === 'arriba' ? 'arriba' : 'tv';
  if(VISTA === 'tv'){
    /* la cámara baja en pantallas anchas: así la pista llena el ancho y no queda todo pared */
    const caja = ang => {
      CAM = { cos:Math.cos(ang), sin:Math.sin(ang), yc: 10.6 + DIST_TV*Math.cos(ang), hc: DIST_TV*Math.sin(ang), F:1, cx:0, cy:0 };
      const pts = [[-.5,0,ALT_FONDO+1],[W+.5,0,ALT_FONDO+1],[-.3,L,0],[W+.3,L,0],[-.3,L,PARED],[W+.3,L,PARED]].map(p => proyTV(p[0], p[1], p[2]));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      return { x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys) };
    };
    let mejor = null;
    for(let g = ANG_TV; g >= ANG_TV_MIN - 1e-6; g -= Math.PI/180){
      const b = caja(g), F = Math.min((w - 12)/(b.x1 - b.x0), Ha/(b.y1 - b.y0));
      if(!mejor || F > mejor.F + 1e-4) mejor = { g, F };
    }
    const b = caja(mejor.g);
    CAM.F = mejor.F;
    CAM.cx = (w - (b.x0 + b.x1)*CAM.F)/2; CAM.cy = arriba + (Ha - (b.y0 + b.y1)*CAM.F)/2;
  } else {
    const m = .7;
    ESC = Math.min((w - 20) / (W + m*2), Ha / (L + m*2));
    OX = (w - W*ESC) / 2; OY = arriba + (Ha - L*ESC) / 2;
  }

}
function poli(c, pts){ c.beginPath(); pts.forEach((p, i) => { const q = proy(p[0], p[1], p[2]); if(i) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); }); c.closePath(); }
function lineaP(c, a, b){ const p = proy(a[0], a[1], a[2]), q = proy(b[0], b[1], b[2]); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke(); }
function anilloSuelo(c, x, y, r, color, ancho){
  c.beginPath();
  for(let i = 0; i <= 28; i++){ const a = i/28*Math.PI*2, q = proy(x + Math.cos(a)*r, y + Math.sin(a)*r, 0); if(i) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]); }
  c.strokeStyle = color; c.lineWidth = ancho; c.stroke();
}
function rrect(c, x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h/2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ── El decorado: pabellón, césped azul, líneas, cristales y malla. Se pinta una vez y se reutiliza ── */
function dibujarPared(c, a, b, z0, z1, tipo){
  poli(c, [[a[0],a[1],z0],[b[0],b[1],z0],[b[0],b[1],z1],[a[0],a[1],z1]]);
  if(tipo === 'cristal'){
    c.fillStyle = 'rgba(160,215,255,.09)'; c.fill();
    c.strokeStyle = 'rgba(200,235,255,.5)'; c.lineWidth = 1.2; c.stroke();
    /* reflejos de los focos en el cristal */
    const qs = [proy(a[0], a[1], z0), proy(b[0], b[1], z0), proy(b[0], b[1], z1), proy(a[0], a[1], z1)], xs = qs.map(q => q[0]), ys = qs.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    c.save(); c.clip(); c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = Math.max(3, (x1 - x0)*.06);
    for(const f of [.2, .58]){ c.beginPath(); c.moveTo(x0 + (x1 - x0)*f, y1); c.lineTo(x0 + (x1 - x0)*(f + .22), y0); c.stroke(); }
    c.restore();

  }
  c.fillStyle = 'rgba(10,18,26,.30)'; c.fill();
  c.save(); c.clip();
  c.strokeStyle = 'rgba(205,215,225,.22)'; c.lineWidth = 1;
  const largo = Math.hypot(b[0] - a[0], b[1] - a[1]), alto = z1 - z0, en = u => [a[0] + (b[0] - a[0])*u/largo, a[1] + (b[1] - a[1])*u/largo];
  for(let u = -alto; u <= largo + alto; u += .32){
    const p = en(u), q = en(u + alto);
    lineaP(c, [p[0], p[1], z0], [q[0], q[1], z1]);
    lineaP(c, [q[0], q[1], z0], [p[0], p[1], z1]);

function dibujarBola(c){
  const b = P.bola; if(!b) return;
  if(P.estado === 'juego' && b.golpeo === 1 && PREF.asistencia){
    const cae = P.prediccion.find(s => s.botes >= 1 && s.t > P.t - P.tGolpe);
    if(cae && ladoDe(cae.y) === 0) anilloSuelo(c, cae.x, cae.y, .42, 'rgba(220,245,74,.5)', 2);
  }

function dibujar(){
  if(!hayDOM || !CX || !P) return;
  const c = CX;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(!FONDO) pintarFondo();
  c.drawImage(FONDO, 0, 0, innerWidth, innerHeight);
  publicoAnimado(c);
  ledMarcador(c);
  if(P.drill) dibujarZonaDrill(c);
  if(P.apunte && P.estado === 'juego') dibujarApunte(c);
  c.save();
  const s = Efectos.shake; if(s > .3) c.translate(rnd(-s, s)*.7, rnd(-s, s)*.7);
  /* de lejos a cerca: lo que está detrás de la red, la red y lo de delante */
  const cosas = P.jug.filter(j => !j.inactivo).map(j => ({ y:j.y, pinta: () => dibujarFigura(c, j) })).concat([{ y:P.bola.y + .01, pinta: () => dibujarBola(c) }]).sort((a, b) => a.y - b.y);
  for(const o of cosas) if(o.y < RED_Y) o.pinta();
  dibujarRed(c);
  for(const o of cosas) if(o.y >= RED_Y) o.pinta();
  dibujarCristalCercano(c);
  for(const p of Efectos.particulas){
    const a = p.vida / p.max;
    c.globalAlpha = a;
    if(p.texto){ const q = proy(p.x, p.y, 2.2); c.fillStyle = p.color; c.font = `900 ${Math.max(13, q[2]*.55)}px Inter, system-ui, sans-serif`; c.textAlign = 'center'; c.fillText(p.texto, q[0], q[1] - (1-a)*24); continue; }
    if(p.anillo){
      if(p.pared){ const q = proy(p.x, p.y, p.z); c.strokeStyle = p.color; c.lineWidth = 2.5; c.beginPath(); c.arc(q[0], q[1], (p.r0 + (p.r1 - p.r0)*(1 - a))*q[2], 0, Math.PI*2); c.stroke(); }
      else anilloSuelo(c, p.x, p.y, p.r0 + (p.r1 - p.r0)*(1 - a), p.color, 2.5);
    } else { const q = proy(p.x, p.y, p.z != null ? p.z : .6); c.fillStyle = p.color; c.beginPath(); c.arc(q[0], q[1], Math.max(1.5, q[2]*.07), 0, Math.PI*2); c.fill(); }
  }
  c.globalAlpha = 1;
  c.restore();
}

/* ═══════════════════════════════════════════════════════════════
   EL PARTIDO EN LA PISTA
   Dos formatos: un partido corto a pocos juegos (el partido rápido) o un
   MOMENTO CLAVE de la carrera, un juego o un punto que decide el partido.
   Al terminar avisa a quien lo pidió con el resultado.
   ═══════════════════════════════════════════════════════════════ */
const ERRORES_PUNTO = ['A la red', 'No pasa la red', 'Fuera', 'Pared directa', 'Pared en su campo', 'Falta de saque', 'Doble falta', 'Reja directa', 'Saque a la reja'];
function crearJugador(id, lado, carril, humano, cfg){
  return Object.assign({ id, lado, carril, carrilBase:carril, humano, x: carril === 'izq' ? 2.7 : 7.3, y: lado === 0 ? 17.5 : 2.5, vx:0, vy:0,
    vel:5, alcance:1.3, hab:.6, reaccion:.18, agresivo:.5, globeador:.35, swing:0, cd:0, anim:0, pedido:'golpe', ultimoMov:-9, color:'#fff' }, cfg);
}
function iniciarPartidoPista(cfg){
  const carril = cfg.carril || 'izq', otro = carril === 'izq' ? 'der' : 'izq', H = cfg.humano, M = cfg.momento || null;
  P = { cfg, momento:M, finMomento:null, escena: cfg.escena || { tipo:'pabellon', gente:.8, ciudad:'' }, equipos: cfg.equipos || ['TÚ', 'RIVALES'], estado:'saque', t:0, tGolpe:0, timer:0, lento:0, juegosGanar: [3,4,6].includes(cfg.juegos) ? cfg.juegos : 3, setsGanar: cfg.sets === 3 ? 2 : 1, setsG:[0,0], marcadorSets:[],
        nJuego: M ? (M.juegos || [5,5])[0] + (M.juegos || [5,5])[1] : 0, set: !M, tb:false, tbSaca:0, acabado:false, saqueN:1, sacaAhora:null,
        puntos: M ? M.inicio.slice() : [0,0], juegos: M ? (M.juegos || [5,5]).slice() : [0,0], sacaLado: M ? M.saca : (Math.random() < .5 ? 0 : 1),
        saqueDe:0, saqueX:5, rally:0, prediccion:[], pausa:false, humanoIA: !!cfg.humanoIA, bola: nuevaBola(), sug:null, tSug:-1, puntosJugados:0,
        stats:{ golpes:0, globos:0, remates:0, bandejas:0, dejadas:0, paredes:0, porTres:0, rallyMax:0, orosJ:0, orosG:0, perfectos:0, puntosG:0, puntosJ:0,
                golpesPareja:0, erroresPareja:0, erroresTuyos:0 },
        jug:[

          crearJugador(1, 0, otro, false,   Object.assign({ color:'#9BE36B' }, cfg.pareja)),
          crearJugador(2, 1, 'izq', false,  Object.assign({ alcance:1.15, color:'#FF8A7A' }, cfg.rival)),
          crearJugador(3, 1, 'der', false,  Object.assign({ alcance:1.15, color:'#FFB29E' }, cfg.rival)),
        ] };

  if(cfg.drill){ P.drill = Object.assign({ intentos:0, aciertos:0 }, cfg.drill); P.jug[1].inactivo = true; P.jug[3].inactivo = true; P.jug[2].noGolpea = true; }

function prepararSaque(repite){
  if(!repite) P.saqueN = 1;
  /* quién saca: por juegos; en el tie-break, uno el primero y luego de dos en dos */
  const n = P.puntos[0] + P.puntos[1];
  let lado = P.sacaLado, idx = Math.floor(P.nJuego / 2) % 2;             // el turno de saque sigue de un set al otro
  if(P.tb){ const k = Math.floor((n + 1)/2); lado = k % 2 === 0 ? P.tbSaca : 1 - P.tbSaca; idx = (Math.floor(P.nJuego / 2) + Math.floor(k/2)) % 2; }
  const equipo = P.jug.filter(j => j.lado === lado), servidor = equipo[idx];
  /* se saca cruzado y alternando lado (el primer punto, desde la derecha). Cada uno conserva SIEMPRE su posición, drive
     o revés: si le toca sacar desde el otro lado, saca desde ahí y vuelve al suyo; su pareja le espera en la red, en su lado */

  for(const j of P.jug) j.carril = j.carrilBase;
  P.saqueDe = servidor.id; P.sacaAhora = lado;
  for(const j of P.jug){
    j.x = j === servidor ? xSaque : j.carril === 'izq' ? 2.7 : 7.3;
    if(j.lado === lado) j.y = j === servidor ? (lado === 0 ? 17.4 : 2.6) : (lado === 0 ? 12.8 : 7.2);
    else j.y = Math.abs(j.x - xResto) < 1 ? (j.lado === 0 ? 18.1 : 1.9) : (j.lado === 0 ? 15.6 : 4.4);   // resta al fondo; su pareja, más adelante
    j.vx = j.vy = 0; j.swing = 0; j.cd = 0; j.anim = 0; j.fuera = false;
  }
  P.bola = Object.assign(nuevaBola(), { x:servidor.x + (lado === 0 ? .3 : -.3), y:servidor.y + (lado === 0 ? -.35 : .35), z:.5 });
  P.estado = 'saque'; P.rally = 0; P.prediccion = [];
  P.timer = servidor.humano && !P.humanoIA ? 2.2 : .8;
  actualizarHUD();
  const teclaGolpe = hayDOM && matchMedia('(hover:hover) and (pointer:fine)').matches ? ' (' + nombreTecla(teclasActuales().golpe) + ')' : '';
  mostrarAyuda(servidor.humano && !P.humanoIA ? (P.saqueN === 2 ? 'Segundo saque: pulsa GOLPE' : 'Te toca sacar: pulsa GOLPE') + teclaGolpe
                                              : (P.puntosJugados < 6 && !PREF.tutorial ? consejo() : ''));
}
function consejo(){
  return ['Muévete y pulsa GOLPE justo antes de que la bola llegue a tu anillo',
          'Bola alta cerca de la red: REMATE. Si sale perfecto, ¡por 3 o por 4!',
          'Si los dos rivales están en la red: GLOBO por encima',
          'Cuidado con la malla del lateral: frena la bola y la desvía',
          'Si están atrás y tú en la red: DEJADA',
          'Bandeja y víbora van cortadas: botan bajo y mueren en el cristal'][P.puntosJugados % 6];
}
function finPunto(ganador, motivo, extra){
  if(P.drill){ finDrill(false, ganador === 1 && !ERRORES_PUNTO.includes(motivo) ? 'No llegaste' : motivo); return; }
  P.ultimoGanador = ganador;            // para que festejen
  const yo = ganador === 0, oro = !P.tb && P.puntos[0] === 3 && P.puntos[1] === 3, st = P.stats, g = P.bola.golpeador;
  P.estado = 'punto'; P.timer = PAUSA_PUNTO; P.puntosJugados++;
  st.rallyMax = Math.max(st.rallyMax, P.rally); st.puntosJ++; if(yo) st.puntosG++;
  if(g != null && ERRORES_PUNTO.includes(motivo) && P.jug[g].lado !== ganador){ if(g === 1) st.erroresPareja++; if(g === 0) st.erroresTuyos++; }
  if(extra.porTres && yo) st.porTres++;
  if(oro){ st.orosJ++; if(yo) st.orosG++; }
  P.puntos[ganador]++;
  let sub = oro ? 'PUNTO DE ORO' : '';
  if(P.momento){
    if(P.puntos[ganador] >= 4){ P.finMomento = ganador; sub = yo ? '¡EL PARTIDO ES VUESTRO!' : 'SE ESCAPA EL PARTIDO'; }
    else sub = textoPuntos(P.puntos);
  } else if(P.tb){
    const a = P.puntos[ganador], o = P.puntos[1 - ganador];
    if(a >= 7 && a - o >= 2){
      P.juegos[ganador]++; P.tb = false; P.puntos = [0, 0]; P.nJuego++;
      P.sacaLado = 1 - P.tbSaca;                // el set siguiente lo empieza sacando quien restó primero en el tie-break
      sub = cerrarSet(ganador);
    } else sub = `TIE-BREAK · ${P.puntos[0]}-${P.puntos[1]}`;
  } else if(P.puntos[ganador] >= 4){
    P.juegos[ganador]++; P.puntos = [0, 0]; P.sacaLado = 1 - P.sacaLado; P.nJuego++;
    const a = P.juegos[ganador], o = P.juegos[1 - ganador], N = P.juegosGanar;
    sub = `JUEGO PARA ${yo ? 'VOSOTROS' : 'ELLOS'} · ${P.juegos[0]}-${P.juegos[1]}`;
    if(a >= N && a - o >= 2) sub = cerrarSet(ganador);
    else if(a === N && o === N){ P.tb = true; P.tbSaca = P.sacaLado; sub = `${N}-${N} · ¡TIE-BREAK A 7!`; }
  }
  mostrarAviso(motivo, sub, yo ? '#DCF54A' : '#FF8A7A', PAUSA_PUNTO);
  mostrarAyuda('');
  Sonido.punto(yo);
  /* el público: aplaude los puntos buenos y los peloteos largos, y se viene arriba al final */
  if(P.finMomento !== null || P.acabado){ Sonido.ovacion(); P.fiesta = 2.6; }
  else if(extra.porTres || oro || P.rally >= 9 || /Por|Dejada|Remate|Víbora|Ace/.test(motivo) || sub.startsWith('SET')){ Sonido.grada(); P.fiesta = 1.5; }
  if(!P.momento && !P.acabado && (P.puntosJugados % 6 === 0 || sub.startsWith('SET'))) setTimeout(mostrarEstadistica, 700);   // datos de la tele entre puntos
  Efectos.sacudir(extra.porTres ? 12 : 3);
  if(yo && (/Por|Dejada|Remate|Víbora|Doble bote|Ace/.test(motivo) || P.finMomento === 0)){ P.lento = .45; Efectos.confeti(); }
  actualizarHUD();
}
/* Set terminado: si alguien llega a los sets que hacen falta se acaba el partido; si no, empieza otro */
function cerrarSet(ganador){
  const yo = ganador === 0, marcador = P.juegos.slice();
  P.marcadorSets.push(marcador); P.setsG[ganador]++;
  if(P.setsG[ganador] >= P.setsGanar){ P.acabado = true; return yo ? '¡PARTIDO PARA VOSOTROS!' : 'SE ACABÓ'; }
  P.juegos = [0, 0];
  return `SET PARA ${yo ? 'VOSOTROS' : 'ELLOS'} · ${marcador[0]}-${marcador[1]} · SETS ${P.setsG[0]}-${P.setsG[1]}`;
}
function formatoTexto(sets, juegos, corto){
  if(corto) return `${sets === 3 ? 'al mejor de 3 sets' : '1 set'} a ${juegos} juegos`;
  return `${sets === 3 ? 'Al mejor de 3 sets' : 'A 1 set'} de ${juegos} juegos, con 2 de ventaja y tie-break a 7 si llegáis a ${juegos}-${juegos}`;
}
function marcadorPartido(){
  return P.marcadorSets.map(s => s.join('-')).concat([P.juegos.join('-') + (P.tb ? ` (TB ${P.puntos[0]}-${P.puntos[1]})` : '')]).join(' · ');
}
/* Falta en el primer saque: se saca otra vez, con el segundo. El saque que toca la red y entra es let: se repite igual */
function faltaSaque(motivo){
  P.estado = 'falta'; P.timer = .95; P.saqueN = 2;
  if(P.jug[P.saqueDe] && P.jug[P.saqueDe].humano) P.stats.faltas = (P.stats.faltas || 0) + 1;
  mostrarAviso('FALTA', (motivo === 'Falta de saque' ? 'Fuera del cuadro' : motivo) + ' · segundo saque', '#F5C542', .95);
  mostrarAyuda('');
  actualizarHUD();
}
function repetirSaque(){
  P.bola.viva = false;
  P.estado = 'falta'; P.timer = .85;
  mostrarAviso('LET', 'Tocó la red y entró: se repite el saque', '#7FD3F7', .85);
  return 'fin';
}
function actualizar(dt){
  if(!P || P.pausa || P.estado === 'fin') return;
  P.t += dt; if(P.timer > 0) P.timer -= dt; if(P.fiesta > 0) P.fiesta -= dt;
  if(P.estado === 'punto' || P.estado === 'falta' || P.estado === 'drillPausa'){
    Input.accion = null;
    for(const j of P.jug){ j.vx *= .9; j.vy *= .9; aplicarMovimiento(j, dt); if(j.anim > 0) j.anim -= dt; }
    if(P.timer <= 0){
      if(P.estado === 'drillPausa'){ if(P.drill.intentos >= P.drill.total) terminarPartidoPista(); else prepararDrill(); }
      else if(P.estado === 'falta') prepararSaque(true);
      else if(P.momento) (P.finMomento !== null ? terminarPartidoPista : prepararSaque)();
      else if(P.acabado) terminarPartidoPista();
      else prepararSaque();
    }
  } else if(P.estado === 'saque'){
    const s = P.jug[P.saqueDe];
    P.bola.z = .08 + Math.abs(Math.sin(P.t*4.4))*.62;           // bota la bola antes de sacar, como manda el reglamento
    if(s.humano && !P.humanoIA){ if(Input.accion || P.timer <= 0){ Input.accion = null; mostrarAyuda(''); sacar(s, .8 + .2*Math.random()); } }
    else if(P.timer <= 0){ mostrarAyuda(''); sacar(s, clamp(s.hab + .15 + gauss()*.08, .3, 1)); }
  } else if(P.estado === 'salida'){
    actualizarSalida(dt);
  } else {
    for(const j of P.jug) if(!j.inactivo) (j.humano ? actualizarHumano : actualizarIA)(j, dt);
    actualizarBola(dt);
  }
  Efectos.actualizar(dt);
}

  const cb = P.cfg.alTerminar;
  if(!P.humanoIA && P.puntosJugados >= 3 && !PREF.tutorial){ PREF.tutorial = true; guardarPref(); }
  P = null;

/* Desde la pausa: lo que queda se decide con la misma probabilidad que la simulación */
function simularRestoPista(){
  if(!P) return;
  const pr = P.cfg.pPunto || .5, pu = P.puntos.slice(), jg = P.juegos.slice(), N = P.juegosGanar, st = P.stats, cb = P.cfg.alTerminar, M = P.momento;
  let gano, sets = [];
  if(M){ for(let g = 0; pu[0] < 4 && pu[1] < 4 && g < 50; g++){ if(Math.random() < pr) pu[0]++; else pu[1]++; } gano = pu[0] >= 4; }
  else {
    let tb = P.tb, fin = P.acabado;
    const sg = P.setsG.slice();
    sets = P.marcadorSets.slice();
    for(let g = 0; !fin && g < 6000; g++){
      if(Math.random() < pr) pu[0]++; else pu[1]++;
      const w = pu[0] > pu[1] ? 0 : 1;
      let setGanado = false;
      if(tb){ if(pu[w] < 7 || pu[w] - pu[1-w] < 2) continue; jg[w]++; tb = false; setGanado = true; }
      else { if(pu[w] < 4) continue; jg[w]++; const a = jg[w], o = jg[1-w]; if(a >= N && a - o >= 2) setGanado = true; else if(a === N && o === N) tb = true; }
      pu[0] = pu[1] = 0;
      if(setGanado){ sets.push(jg.slice()); sg[w]++; if(sg[w] >= P.setsGanar) fin = true; else jg[0] = jg[1] = 0; }
    }
    gano = sg[0] > sg[1];
  }
  P = null; if(hayDOM) $('#pausaP').hidden = true; ocultarJuego();
  if(cb) cb({ gano, sets, juegos: jg, puntos: pu, stats: st, simulado:true });
}

/* ── El bucle: física a 120 Hz, dibujo a lo que dé la pantalla ── */

/* ═══════════════════════════════════════════════════════════════
   EL CIRCUITO JUGABLE
   Cada trimestre se ven TODOS los torneos del calendario, sueltos. Eliges
   los que quieras (hasta tres) y el cuadro avanza ronda a ronda: los
   partidos se simulan, pero cuando uno se aprieta te toca jugar el JUEGO o
   el PUNTO CLAVE (en la pista o en un minijuego). Los Majors mantienen su
   cuadro en cuartos y semis, y todas las finales se juegan en la pista.
   ═══════════════════════════════════════════════════════════════ */
const TORNEOS_POR_TRIMESTRE = 3;
const PROB_MOMENTO = .55, PROB_MOMENTO_PREVIA = .5;     // en cada ronda, la probabilidad de que toque un momento clave

const DIFICULTADES = {
  facil:   { nom:'Fácil',   rival:12, cal:.1,  alcance:.16, sim:7.5, eleccion:.17, ayuda:{FIP1:5, FIP2:3.5, FIP3:2, FIP4:1}, rafaga:.1, rafagaMs:400, d:'Lo más llevadero: rivales lentos, más caminos buenos y más partidos ganados.' },
  normal:  { nom:'Normal',  rival:8,  cal:.07, alcance:.1,  sim:5.8, eleccion:.142, ayuda:{FIP1:1.35, FIP2:.7, FIP3:0, FIP4:0}, rafaga:.06, rafagaMs:220, d:'Exigente: de joven se sufre, el primer título tarda y el número 1 es de unos pocos.' },
  dificil: { nom:'Difícil', rival:0,  cal:.02, alcance:.03, sim:3.8, eleccion:.09, ayuda:{}, rafaga:.01, rafagaMs:0, d:'Como el circuito de verdad: cada título es una hazaña.' },
};
let DIF_CACHE = { k:null, v:null };
function difActual(){
  const base = DIFICULTADES[PREF.dificultad] ? PREF.dificultad : 'normal', idolo = esIdolo(), k = base + (idolo ? '|idolo' : '');
  if(DIF_CACHE.k === k) return DIF_CACHE.v;
  const D = DIFICULTADES[base];
  /* en El Ídolo todo aprieta un punto más: menos ventaja al simular, rivales más duros y cero ayudas */
  const v = idolo ? Object.assign({}, D, { nom: D.nom + ' · Ídolo', sim: D.sim - IDOLO_DUREZA.sim, eleccion: Math.max(0, D.eleccion - IDOLO_DUREZA.eleccion),
                                           rival: Math.max(0, D.rival - IDOLO_DUREZA.rival), ayuda: {} }) : D;
  DIF_CACHE = { k, v };
  return v;
}

/* ── De la carrera a la pista ──
   Tus estadísticas no te hacen más rápido que todo el circuito: deciden qué
   golpes te salen mejor que el resto. Lo difícil lo pone la diferencia de
   nivel con la pareja rival (la misma que usa la simulación) y la dificultad. */
function paramsHumanoPista(j){
  const s = j ? j.stats : null, D = difActual();
  const media = s ? STAT_KEYS.reduce((a,k)=>a+s[k], 0)/STAT_KEYS.length : 0;
  const rel = k => s ? clamp((s[k] - media)/22, -1, 1) : 0;
  const e = j ? clamp(j.energia, 0, 100) : 100, cansancio = e < 45 ? (45 - e)/45 : 0, lesion = j && j.lesion ? 1 : 0;
  const fallo = k => clamp(1 - .28*rel(k), .72, 1.28);
  return aplicarMaterial(j, {
    vel: (5 + .35*rel('fisico')) * (1 - .12*cansancio - .1*lesion),
    alcance: 1.24 + D.alcance + .05*rel('volea') + .05*rel('pared'),
    bonusCal: .04 + D.cal + .05*rel('mental') - .06*cansancio,
    multFalloTiro: { drive:fallo('pared'), plano:fallo('pared'), volea:fallo('volea'), dejada:fallo('volea'), chiquita:fallo('volea'),
                     globo:fallo('globo'), bandeja:fallo('bandeja'), vibora:fallo('remate'), remate:fallo('remate'), saque:fallo('mental') },
    multTTiro: { remate:1 - .1*rel('remate'), vibora:1 - .08*rel('remate'), drive:1 - .06*rel('pared'), plano:1 - .06*rel('pared') },
    umbralPorTres: .8 - .07*rel('remate'),
    bonusPared: .05 + .05*rel('pared'),
    hab: .62 + .05*rel('mental'), reaccion: .16,
  });
}
/* Tu pareja juega con cabeza: falla poco y llega a casi todo. Su nivel y la química la hacen aún mejor */
function paramsParejaPista(j){
  const p = j && j.pareja;
  if(!p) return { vel:4.6, alcance:1.2, hab:.72, reaccion:.16, multFallo:.62, agresivo:.55, globeador:.35 };
  const rel = clamp((p.nivel - escalar(rawJugador(j))) / 12, -1, 1), q = (p.quimica - 50)/50;
  return { vel: 4.65 + .25*rel, alcance: 1.2 + .04*rel, hab: clamp(.76 + .06*rel + .04*q, .6, .9), reaccion: clamp(.15 - .02*rel - .01*q, .1, .22),
           multFallo: clamp(.58 - .08*rel - .05*q, .4, .75),
           agresivo: p.estilo === 'rematador' ? .7 : p.estilo === 'voleador' ? .6 : .45,
           globeador: p.estilo === 'tactico' ? .5 : p.estilo === 'paredista' ? .45 : .32 };
}
/* edge = vuestro nivel de dupla menos el suyo. Negativo: son mejores */
function paramsRivalPista(edge, arq){
  const e = clamp(edge, -25, 25);
  return { vel: clamp(4.35 - .045*e, 3.5, 5.3), alcance: 1.15, hab: clamp(.56 - .018*e, .28, .88), reaccion: clamp(.2 + .008*e, .1, .34),
           agresivo: clamp(.5*(arq ? arq.remate : 1), .3, .75), globeador: clamp(.35*(arq ? arq.globo : 1), .22, .5) };
}
function edgeDupla(j, opp, ev){
  const fatiga = Math.max(0, 58 - j.energia) * 0.09;
  return ratingDupla(j, ev.pista, ev) - fatiga - opp.rating;
}
function cfgPartidoCarrera(j, opp, ev, rotulo){
  const edge = edgeDupla(j, opp, ev);
  return {
    humano: paramsHumanoPista(j), pareja: paramsParejaPista(j), rival: paramsRivalPista(edge + difActual().rival, opp.arq),
    carril: j.posicion === 'drive' ? 'der' : 'izq', juegos: PREF.juegos || 3, edge,
    pPunto: perfilDupla(j, opp, ev, j.energia).p, humanoIA: !!S.pruebaIA,
    escena: escenaDe(ev), equipos: [nombreEquipo(j.nombre, j.pareja ? j.pareja.nombre : 'Pareja'), nombreEquipo(opp.nombre, opp.nombre2)],
    titulo: `${opp.nombre.split(' ')[0]} / ${opp.nombre2.split(' ')[0]}`,
    subtitulo: `juegan a ${opp.arq ? opp.arq.nom : 'todo'}`, rotulo,
  };
}

/* ── El calendario del trimestre ── */
function torneosDelTrimestre(){
  const tri = S.cal[S.j.trimestre], out = [], vistos = new Set();
  tri.giras.forEach((g, gi) => g.torneos.forEach((ev, ti) => {
    const clave = ev.t + '|' + ev.nom;
    if(vistos.has(clave)) return;
    vistos.add(clave);
    out.push(Object.assign({}, ev, { id: gi + '-' + ti, gira: g.nom }));
  }));
  return out.sort((a,b) => orden(b.t) - orden(a.t) || a.nom.localeCompare(b.nom));
}
function trimActual(){
  const j = S.j, clave = j.anio + '-' + j.trimestre;
  if(!S.trim || S.trim.clave !== clave){
    anotarRankingTrimestre(j);
    S.trim = { clave, jugados:[], resultados:[], rankAntes:j.ranking, pts:0, plata:0, vic:0, der:0, perfecto:false, remontada:false, cerrado:false };
  }
  return S.trim;
}
/* Como en el circuito de verdad: con ranking de Premier no te dejan jugar un Promises */
function torneoDemasiadoBajo(j, ev){
  if(!j.ranking) return false;
  if(ev.t === 'FIP1' || ev.t === 'FIP2') return j.ranking <= 150;
  if(ev.t === 'FIP3' || ev.t === 'FIP4') return j.ranking <= 80;
  if(ev.t === 'FIP5') return j.ranking <= 35;
  return false;
}
function estadoTorneo(j, ev){
  const tr = trimActual(), hecho = tr.jugados.find(x => x.id === ev.id);
  if(hecho) return { tipo:'jugado', r:hecho };
  if(tr.cerrado) return { tipo:'lleno', txt:'Trimestre cerrado' };
  if(torneoDemasiadoBajo(j, ev)) return { tipo:'bajo', txt:'Ya estás por encima de este torneo' };
  const e = entradaTorneo(j, ev);
  if(!e){
    const acc = TIERS[ev.t].acc;
    return { tipo:'cerrado', txt: ev.t === 'FIN' ? 'Solo juegan las 8 mejores parejas' : `Necesitas top ${acc*4} (previa) o top ${acc} (directo)` };
  }
  if(j.lesion && j.lesionSem > 0) return { tipo:'lesion', txt:'Estás de baja' };
  if(tr.jugados.length >= TORNEOS_POR_TRIMESTRE) return { tipo:'lleno', txt:`Ya jugaste ${TORNEOS_POR_TRIMESTRE} torneos este trimestre` };
  return { tipo:e };
}

/* ── Un torneo, ronda a ronda ── */
function abrirTorneo(id){
  const ev = torneosDelTrimestre().find(x => x.id === id);
  if(!ev) return;
  S.verTorneo = ev; S.pantalla = 'torneo'; render();
}
function inscribirse(){
  const j = S.j, ev = S.verTorneo; if(!ev || S.torneo) return;
  const est = estadoTorneo(j, ev);
  if(est.tipo !== 'directo' && est.tipo !== 'previa') return;
  if(j.edad <= 19 && ['P2','P1','MJ','FIN'].indexOf(ev.t) >= 0) logro(j, 'premier_teen');
  /* el sorteo que visteis, con sus %, es el que se juega */
  const habitual = j.pareja, elegida = parejaElegida(j, ev);      // con la pareja elegida para este torneo
  if(elegida !== habitual) j.pareja = elegida;
  const so = chancesTorneo(j, ev, est.tipo), copia = JSON.parse(JSON.stringify(so));
  delete copia.cache;
  S.torneo = { ev, previa: est.tipo === 'previa', enPrevia: est.tipo === 'previa', kPrevia:0, ronda:0, partidos:[], rival:null,
               ultimo:null, momento:null, perfecto:true, remontada:false, lesionado:false, fin:null, sorteo: copia,
               cambioPareja: elegida !== habitual, parejaHabitual: elegida !== habitual ? habitual : null };
  delete trimActual().sorteos[ev.id];
  nuevoRivalTorneo();
  guardar(); render();
}
function nuevoRivalTorneo(){
  const to = S.torneo, T = TIERS[to.ev.t], so = to.sorteo, k = to.enPrevia ? to.kPrevia : to.ronda;
  /* en los torneos pequeños los rivales aprietan menos: el primer título tiene que llegar pronto */
  const ayuda = (difActual().ayuda || {})[to.ev.t] || 0;
  /* la pareja y su % ya salieron en el sorteo del torneo */
  const base = so && (to.enPrevia ? so.previa : so.cuadro)[k];

  if(!gana && c.vidas > 0){ c.vidas--; c.falladas.push(i); c.salvada = true; guardar(); render(); return; }
  c.elegida = i;
  c.minas = colocarMinas(c, i, gana);
  m.eleccion = { i, gana, texto: gana ? pick(CAMINO_BIEN) : pick(CAMINO_MAL) };
  guardar(); render();
}
/* al destapar: las falladas, la que visteis venir, la elegida si os sacó y el resto al azar hasta completar */
function colocarMinas(c, elegida, gana){
  const minas = c.falladas.slice();
  if(c.pista !== null && minas.indexOf(c.pista) < 0) minas.push(c.pista);
  if(!gana && minas.indexOf(elegida) < 0) minas.push(elegida);
  const libres = [...Array(c.casillas).keys()].filter(x => x !== elegida && minas.indexOf(x) < 0);
  while(minas.length < c.nMinas && libres.length) minas.push(libres.splice(ri(0, libres.length - 1), 1)[0]);
  return minas;
}
function continuarMomento(){
  const m = S.torneo && S.torneo.momento; if(!m || !m.eleccion || rafagaRecienAcabada(m.rafaga)) return;
  resolverMomento(m.eleccion.gana, false, null, m.forma);
}
function probMomento(m){
  if(m.prob == null) m.prob = m.obj != null ? Math.round(m.obj*100) : Math.round(100*probJuego(m.pPunto, m.inicio[0], m.inicio[1]));
  return m.prob;
}
/* ganar 2 de 3 cuando ya lleváis `bien` aciertos y `mal` fallos, acertando cada una con probabilidad s */
function probDosDeTres(s, bien, mal){ return bien >= 2 ? 1 : mal >= 2 ? 0 : s*probDosDeTres(s, bien + 1, mal) + (1 - s)*probDosDeTres(s, bien, mal + 1); }
const momentoEmpezado = m => m.forma === 'leer' ? !!(m.leer && m.leer.k > 0) : m.forma === 'tiempo' ? !!(m.rafaga && m.rafaga.golpes.some(g => g.res))
  : m.forma === 'camino' ? !!(m.camino && m.camino.falladas.length) : false;
/* La probabilidad de ganar AHORA, con lo que ya se jugó del minijuego. Antes de empezar es la del torneo; a mitad,
   la que queda. Simular a mitad se decide con esta: no da ni más ni menos de lo que toca */
function probActualMomento(m){
  if(m.obj == null) return probJuego(m.pPunto, m.inicio[0], m.inicio[1]);
  if(m.forma === 'leer' && m.leer) return probDosDeTres(aciertoParaDosDeTres(m.obj), m.leer.aciertos, m.leer.fallos);
  if(m.forma === 'tiempo' && m.rafaga){
    const g = m.rafaga.golpes;
    return probDosDeTres(aciertoParaDosDeTres(m.obj), g.filter(x => x.res === 'bien' || x.res === 'perfecto').length, g.filter(x => x.res === 'fuera').length);
  }
  if(m.forma === 'camino' && m.camino && m.camino.q != null) return 1 - Math.pow(1 - m.camino.q, 1 + m.camino.vidas);
  return m.obj;
}
function jugarMomento(){
  const j = S.j, to = S.torneo, m = to && to.momento; if(!m) return;
  const rotulo = m.tipo === 'punto' ? 'PUNTO CLAVE' : 'JUEGO CLAVE';
  const cfg = cfgPartidoCarrera(j, to.rival, to.ev, rotulo);
  if(m.obj != null) cfg.rival = paramsRivalPista(edgeDesdeProb(m.obj) + difActual().rival, to.rival.arq);   // rivales tan buenos como dice el %
  cfg.momento = { inicio:m.inicio, saca:m.saca, juegos:m.juegos };
  cfg.pPunto = m.pPunto;
  cfg.titulo = rotulo;
  cfg.avisoSub = m.tipo === 'punto' ? 'un punto y se acaba' : `empezáis ${textoPuntos(m.inicio)}<br>primero a 4 puntos`;
  cfg.subtitulo = `${to.rival.nombre.split(' ')[0]} / ${to.rival.nombre2.split(' ')[0]} · juegan a ${to.rival.arq.nom}`;
  cfg.alTerminar = rp => resolverMomento(rp.gano, !rp.simulado, rp.stats);
  S.pantalla = 'momento';
  iniciarPartidoPista(cfg);
}
function simularMomento(){
  const m = S.torneo && S.torneo.momento; if(!m) return;
  /* exactamente el % que se ve: el del torneo, o el que queda si el minijuego ya había empezado */
  resolverMomento(Math.random() < probActualMomento(m), false, null);
}
/* Un set para cada pareja y el tercero, el que se decidió en el momento clave */
function setsConClave(sets, gano){
  const gana = s => { const p = s.split('-').map(Number); return p[0] > p[1]; };
  const s1 = sets[0] || '6-4';
  let s2 = sets[1] || '4-6';
  if(gana(s1) === gana(s2)) s2 = s2.split('-').reverse().join('-');
  return [s1, s2, gano ? pick(['7-5','7-6']) : pick(['5-7','6-7'])];          // se decidió a partir del 5-5
}
function resolverMomento(gano, enVivo, st, forma){
  const j = S.j, to = S.torneo, m = to && to.momento; if(!m) return;
  const res = m.res;
  res.gane = gano;
  res.sets = setsConClave(res.sets, gano);
  res.clave = { tipo:m.tipo, enVivo, gano, forma: forma || (enVivo ? 'pista' : null) };
  if(m.tipo === 'punto') res.oros = (res.oros || []).concat([gano]);
  if(enVivo && st){
    res.vivo = { golpes:st.golpes, rallyMax:st.rallyMax, porTres:st.porTres, remates:st.remates, globos:st.globos, dejadas:st.dejadas, perfectos:st.perfectos };
    const pi = j.pista = j.pista || { jugados:0, ganados:0, porTres:0, rallyMax:0, perfectos:0 };
    pi.jugados++; if(gano) pi.ganados++; pi.porTres += st.porTres; pi.rallyMax = Math.max(pi.rallyMax, st.rallyMax); pi.perfectos += st.perfectos;
  }
  to.momento = null;
  S.pantalla = 'torneo';
  aplicarPartido(res);
}
/* Lo llaman el cuadro y el punto de oro de siempre cuando se acaban */
function finMinijuegoTorneo(victorias, gano){
  const to = S.torneo; if(!to) return;
  to.perfecto = to.perfecto && gano;
  to.ronda = victorias;
  S.pantalla = 'torneo';

  if(gano && to.ronda < TIERS[to.ev.t].rondas){ to.ultimo = { cuadro:true, gane:true, sets:[], ronda:'SEMIFINAL' }; nuevoRivalTorneo(); guardar(); render(); return; }
  cerrarTorneoActual();
}

function lesionar(j){
  j.lesion = pick(['Rotura de fibras en el gemelo','Esguince de tobillo','Sobrecarga lumbar','Epicondilitis','Fascitis plantar','Tendinitis del hombro']);
  j.lesionSem = ri(1,2);
}
function aplicarPartido(res){
  const j = S.j, to = S.torneo, T = TIERS[to.ev.t], opp = to.rival;
  j.pj++;
  j.orosJugados = (j.orosJugados||0) + (res.oros||[]).length;
  j.orosGanados = (j.orosGanados||0) + (res.oros||[]).filter(Boolean).length;
  j.salidasPista = (j.salidasPista||0) + (res.salidas||0);
  if(!to.enPrevia && res.red != null){ j.puntosRed = (j.puntosRed||0) + Math.round(res.red*(res.puntos||0)); j.puntosTot = (j.puntosTot||0) + (res.puntos||0); }
  j.energia = clamp(res.energia - (to.enPrevia ? 7 : 0), 0, 100);
  to.partidos.push(res); to.ultimo = res;
  anotarH2H(j, opp, res.gane);
  let fin = false;
  if(res.gane){
    j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
    j.forma = clamp(j.forma + (opp.rank < (j.ranking||3000) ? 1.6 : 0.7), -12, 12);
    j.moral = clamp(j.moral + 2, 0, 100);
    if(to.enPrevia){ to.kPrevia++; if(to.kPrevia >= RONDAS_PREVIA) to.enPrevia = false; }
    else {
      const sets = res.sets.map(s => s.split('-').map(Number));
      if(sets.some(p => p[0] < p[1])) to.perfecto = false;
      if(sets.length === 3 && sets[0][0] < sets[0][1]) to.remontada = true;
      to.ronda++;
    }
    if(res.lesionEnPartido && !j.lesion){ lesionar(j); to.lesionado = true; fin = true; }
    else if(!to.enPrevia && to.ronda >= T.rondas) fin = true;
    else nuevoRivalTorneo();
  } else {
    j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0;
    j.forma = clamp(j.forma - (to.enPrevia ? 1.2 : 1.8), -12, 12);
    j.moral = clamp(j.moral - (to.enPrevia ? 2 : 3), 0, 100);
    to.perfecto = false;
    fin = true;
  }
  if(fin) return cerrarTorneoActual();
  if(!S.silencio){ guardar(); render(); }
}
function cerrarTorneoActual(){
  const j = S.j, to = S.torneo, T = TIERS[to.ev.t], ev = to.ev;
  let r;
  if(to.previa && to.enPrevia){
    /* Caer en la previa no es irse con las manos vacías: algo de dinero y medio punto */
    r = cerrarFichaTorneo(ev, 0, to.partidos, false, false, false);

  } else r = cerrarFichaTorneo(ev, to.ronda, to.partidos, to.perfecto && to.ronda >= T.rondas, to.remontada, to.lesionado);
  const rankAntes = j.ranking;

  tr.jugados.push({ id:ev.id, nom:ev.nom, t:ev.t, ronda:r.ronda, campeon:r.campeon, pts:r.pts, plata:r.plata, cayoEnPrevia:!!r.cayoEnPrevia });

  if(j.historialTorneos.length > 400) j.historialTorneos.shift();
  const logros = chequearLogros(j, { perfecto: r.campeon && r.perfecto, remontada: r.remontada });
  to.fin = { r, rankAntes, logros };
  anotarRankingTrimestre(j);
  /* vuelve tu pareja de siempre (y se nota un poco que se quedó en casa) */
  if(to.cambioPareja){ j.pareja = to.parejaHabitual; if(j.pareja) j.pareja.quimica = clamp(j.pareja.quimica - 3, 0, 100); to.cambioPareja = false; }

  if(!S.silencio){ guardar(); render(); }
}

function cerrarTrimestre(){

  }

    const g = claves.filter(x => x.gane).length, porTres = vivos.reduce((a,x)=>a+((x.vivo && x.vivo.porTres)||0), 0), elegidos = claves.filter(x => ['tiempo','leer','camino'].includes(x.clave.forma)).length;
    notas.push({tipo:'gold', txt:`🔥 <b>${claves.length} momento${claves.length>1?'s':''} clave</b>, ${g} ganado${g===1?'':'s'}` +
      (vivos.length ? ` · 🎾 ${vivos.length} en la pista${porTres?` (💥 ${porTres} por 3)`:''}` : '') + (elegidos ? ` · ⚡ ${elegidos} en minijuegos` : '') + '.'});
  }

  else if(mejor.campeon){ titulo = `${gx('¡CAMPEÓN','¡CAMPEONA')} EN ${mejor.ev.ciudad.toUpperCase()}!`; texto = textoTitulo(mejor); }
  else if(mejor.victorias === TIERS[mejor.ev.t].rondas-1){ titulo = `FINALISTAS EN ${mejor.ev.ciudad.toUpperCase()}`; texto = 'Llegasteis a la final y se os escapó. Los puntos y el dinero quedan.'; }
  else if(ganados === 0){ titulo = 'TRIMESTRE PARA OLVIDAR'; texto = `${resultados.length} torneo${resultados.length>1?'s':''}, ninguna victoria. Aviones, hoteles y a casa. Así empieza casi todo el mundo.`; }
  else if(st.vic === 0){ titulo = 'TODO EL VIAJE PARA LA PREVIA'; texto = 'Partidos ganados en la previa y ni un cuadro final. Levantarte a las siete para jugar a las nueve.'; }
  else { titulo = `LO MEJOR: ${mejor.ronda.toUpperCase()} EN ${mejor.ev.ciudad.toUpperCase()}`; texto = 'Trimestre desparejo, pero os lleváis ritmo de partido y algo de ranking.'; }
  const T = S.cal[j.trimestre].tr;
  S.gira = { gira:{ nom:T.nom, pista:mejor.ev.pista }, resultados, pts:st.pts, plata:st.plata, vic:st.vic, titulo, texto,
             pg:ganados, pp:perdidos, deltaRank: (st.rankAntes && j.ranking) ? st.rankAntes - j.ranking : 0,

  let alguno = false;
  for(const [nom, tiers] of GRUPOS_CAL){
    const items = estados.filter(x => tiers.includes(x.ev.t) && (filtro === 'todos' || puedeEntrar(x.est) || x.est.tipo === 'jugado'));
    if(!items.length) continue;
    alguno = true;
    h += `<div class="grupo-cal" style="--cat:${colorCat(tiers[0])}">${ico(iconoCat(tiers[0]))}${nom}</div>` + items.map(x => filaTorneo(j, x.ev, x.est, nivel)).join('');
  }
  if(!alguno) h += `<p class="muted" style="margin:12px 2px 0">${lleno ? `Ya jugaste los ${TORNEOS_POR_TRIMESTRE} torneos de este trimestre.` : j.lesion ? 'Estás de baja: este trimestre toca recuperarse.' : 'No hay torneos a tu alcance este trimestre.'}</p>`;
  return h + leyendaPistas() + `</div></div>`;
}

/* ── Un torneo por dentro ── */
function filasPremio(T){
  const factores = [1, .585, .32, .175, .098, .058, .034], nombres = ['', '🥈 Final', 'Semifinal', 'Cuartos'];
  let h = '';
  for(let k = 0; k < Math.min(T.rondas, 4); k++)
    h += `<div class="fila-premio ${k===0?'oro':''}"><span>${k===0 ? gx('🏆 Campeón','🏆 Campeona') : nombres[k]}</span><b>+${T.pts[Math.min(k, T.pts.length-1)] || 0} pts</b><b>${money(Math.round(T.prem*factores[k]))}</b></div>`;
  return h;
}
function confetiHTML(){
  const col = ['#DCF54A','#22D3A5','#F5C542','#7FD3F7','#F075C0'];
  let h = '';
  for(let i = 0; i < 26; i++) h += `<i style="left:${(i*37)%100}%;background:${col[i%5]};animation-delay:${(i%9)*.09}s"></i>`;
  return h;
}
function etapasHTML(to){
  const T = TIERS[to.ev.t], pasos = [], abrev = {R64:'R64', R32:'R32', OCTAVOS:'8VOS', CUARTOS:'4TOS', SEMIFINAL:'SEMI', FINAL:'FINAL', GRUPOS:'GRUPOS'};
  const hechos = to.previa ? (to.enPrevia ? to.kPrevia : RONDAS_PREVIA + to.ronda) : to.ronda;
  const perdio = to.fin && !to.fin.r.campeon;
  if(to.previa) for(let k = 0; k < RONDAS_PREVIA; k++) pasos.push('PREV ' + (k+1));
  for(let k = 0; k < T.rondas; k++) pasos.push(abrev[NOM_RONDA[T.rondas][k]] || NOM_RONDA[T.rondas][k]);
  return `<div class="etapas">${pasos.map((n, i) => `<div class="etapa ${i < hechos ? 'ok' : i === hechos ? (perdio ? 'ko' : to.fin ? '' : 'ahora') : ''}"><i></i><span>${n}</span></div>`).join('')}</div>`;
}

/* Tus chances, ronda a ronda: los mismos % que después deciden cada partido */
function chancesHTML(ev, so, to){
  const T = TIERS[ev.t], ch = chanceTitulo(ev, so, to), esMJ = modoMinijuego(ev) === 'cuadro';

  const filas = ch.pasos.map((p, i) => {
    const nom = p.previa ? 'PREV ' + (p.k + 1) : (abrev[NOM_RONDA[T.rondas][p.k]] || NOM_RONDA[T.rondas][p.k]);
    const hecha = i < ch.hechos, ahora = !!to && i === ch.hechos, pc = Math.round(100*ch.pr[i]);
    const col = pc>=60?'var(--bien)':pc>=40?'var(--gold)':'var(--danger)';
    const riv = p.cuadroMJ ? null : (p.previa ? so.previa : so.cuadro)[p.k];
    const quien = p.cuadroMJ ? '🏛️ cuadro: elegís camino' : `${apellido(riv.nombre)} / ${apellido(riv.nombre2)} <span class="muted">#${riv.rank}</span>${p.final ? ' · 🎾 pista' : ''}`;

  </div>`;
}

  if(!to.fin){

    if(mini === 'cuadro'){

    } else {
      const prob = probPartido(j, opp, ev), col = prob>=60?'var(--bien)':prob>=40?'var(--gold)':'var(--danger)';
      h += `<div class="card">

        <div class="mrow"><span class="dot"></span><span class="nm">${fichaPais(opp.flag)} ${esc(opp.nombre)} / ${esc(opp.nombre2)}</span><span class="rk">#${opp.rank}</span></div>
        <p class="muted" style="margin:6px 0 0">Juegan a <b style="color:var(--text)">${esc(opp.arq.nom)}</b>${opp.arq.remate > 1.2 ? ' · cuidado con sus remates' : opp.arq.globo > 1.15 ? ' · te van a globear mucho' : ''}.${h2hDe(j, opp.id) ? ` <b style="color:var(--text)">⚔️ Historial: ${h2hDe(j, opp.id).g}-${h2hDe(j, opp.id).p}</b>` : opp.id ? ' Primera vez contra ellos.' : ''}</p>
        <div class="prob"><span class="barra"><i style="width:${prob}%"></i></span><span class="cifra" style="color:${col}">${prob}% de ganar</span></div>
        <div class="log gold" style="margin:11px 0 0">${to.enPrevia ? '🌅 La previa se simula, pero puede tocarte <b>elegir para clasificar</b>.' : esFinal ? '🎾 <b>La final se juega siempre en la pista</b>, aunque simules hasta ella.' : '🎲 Se simula el partido, pero <b>en cualquier ronda puede tocarte un momento clave</b>: en la pista, en una ráfaga, leyendo al rival o eligiendo camino. <b>Ese % es exacto, también en el momento clave.</b>'}</div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-top:11px"><span>TU ENERGÍA</span><span class="tabular">${Math.round(j.energia)}%</span></div>
        <div class="meter" style="margin-top:4px"><i style="width:${j.energia}%;background:${j.energia>60?'var(--accent)':j.energia>32?'var(--alerta)':'var(--danger)'}"></i></div>
      </div>
      <button class="btn" onclick="jugarBotonRonda()">${to.todoEnPista ? '🎾 JUGAR EN LA PISTA · ' : '▶️ JUGAR '}${rondaNom}</button><div style="height:8px"></div>

      <div class="li" style="border:0;padding:9px 2px 6px"><div class="g"><b>Todos mis partidos en la pista</b><span>${formatoTexto(formatoCarrera().sets, formatoCarrera().juegos, true)} · el formato se cambia en Controles</span></div><button class="tg ${to.todoEnPista ? 'on' : ''}" aria-pressed="${!!to.todoEnPista}" onclick="S.torneo.todoEnPista=!S.torneo.todoEnPista;guardar();render()"><i></i></button></div>`;

    h += `<button class="btn ghost sm" onclick="simularHastaElFinal()">⏭️ SIMULAR HASTA LA FINAL</button>
      <p class="muted center" style="margin:6px 0 0">${mj === 'cuadro' ? 'El cuadro del Major y la final no se saltan: esos los juegas tú.' : 'La final no se salta: esa la juegas tú.'}</p>
      ${to.sorteo && to.sorteo.probs ? '<div style="height:11px"></div>' + llavesHTML(ev, to.sorteo, to) + chancesHTML(ev, to.sorteo, to) : ''}
      <div class="card" style="margin-top:11px">
        <div class="eyebrow">DIFICULTAD EN LA PISTA</div><div style="height:7px"></div>${segPref('dificultad', OPCIONES_DIF, true)}
        <p class="muted" style="margin:7px 0 10px">${difActual().d}</p>
        <button class="btn ghost sm" onclick="S.volverComo='torneo';S.pantalla='como';render()">🎮 CONTROLES</button>
      </div>
      <div class="card"><div class="eyebrow">PREMIOS Y PUNTOS</div><div style="height:4px"></div>${filasPremio(T)}</div>`;
    if(to.partidos.length) h += `<div class="card"><div class="eyebrow">VUESTRO CAMINO</div><div style="height:8px"></div>${to.partidos.slice().reverse().map(p => cardPartido(j, p)).join('')}</div>`;
    return h + `</div>`;
  }

  const f = to.fin, r = f.r, perdidos = to.partidos.filter(p => !p.gane).length, ganados = to.partidos.length - perdidos;
  const dRank = (f.rankAntes && j.ranking) ? f.rankAntes - j.ranking : 0;
  const titular = r.campeon ? gx('🏆 ¡CAMPEONES!','🏆 ¡CAMPEONAS!') : r.cayoEnPrevia ? '🌅 FUERA EN LA PREVIA'
    : to.lesionado ? '🩹 LESIÓN' : r.victorias === T.rondas-1 ? '🥈 FINALISTAS' : '😖 FUERA EN ' + r.ronda.toUpperCase();
  const texto = r.campeon ? textoTitulo(r)
    : r.cayoEnPrevia ? 'Dos partidos a las nueve de la mañana y a casa. Algo de dinero y medio punto de ranking.'
    : to.lesionado ? `Ganasteis, pero te lesionaste: <b>${esc(j.lesion || '')}</b>. Toca parar.`
    : r.victorias === T.rondas-1 ? 'Llegasteis a la final y se os escapó. Los puntos y el dinero quedan.'
    : r.victorias === 0 ? 'Primera ronda y a casa. El cuadro no perdona.'
    : `Caísteis en ${r.ronda.toLowerCase()}. Puntos y algo de dinero para seguir.`;
  h += `<div class="card ${r.campeon ? 'confeti' : ''}" style="${r.campeon ? 'background:linear-gradient(160deg,rgba(245,197,66,.2),transparent 65%);border-color:rgba(245,197,66,.45)' : ''}">
    ${r.campeon ? confetiHTML() : ''}
    <div class="eyebrow">${esc(ev.nom.toUpperCase())}</div>
    ${r.campeon ? '<div class="trofeo-grande">🏆</div>' : ''}

      <div><div class="eyebrow">PREMIO</div><div class="title-lg" style="color:var(--gold)" data-num="${r.plata}" data-fmt="money" data-desde0="1" data-clave="fin-plata-${ev.id}-${j.anio}-${j.trimestre}">${money(r.plata)}</div></div>
      <div><div class="eyebrow">RANKING</div><div class="title-lg">${j.ranking ? '#'+j.ranking : '—'} ${dRank ? `<span style="font-size:12px;color:${dRank>0?'var(--accent)':'var(--danger)'}">${dRank>0?'▲':'▼'}${Math.abs(dRank)}</span>` : ''}</div></div>
      <div><div class="eyebrow">PARTIDOS</div><div class="title-lg">${ganados}-${perdidos}</div></div>

  if(r.campeon) h += `<div class="card"><div class="eyebrow">🏆 A LA VITRINA</div><div class="vitrina">${trofeoHTML({nom:ev.nom, tier:ev.t, a:j.anio})}</div>
    <p class="muted" style="margin:8px 0 0">Ya llevas <b style="color:var(--text)">${j.titulos.length}</b> título${j.titulos.length===1?'':'s'} y <b style="color:var(--gold)">${money(j.premiosTotal||0)}</b> en premios.</p></div>`;
  if(f.logros.length) h += `<div class="card"><div class="eyebrow">LOGROS DESBLOQUEADOS</div><div style="height:6px"></div>
    ${f.logros.map(l=>`<div class="ach"><span class="ic">${l.ic}</span><div><b>${nomLogro(l)}</b><span>${descLogro(l)}</span></div></div>`).join('')}</div>`;
  if(to.sorteo && to.sorteo.probs) h += llavesHTML(ev, to.sorteo, to);
  if(to.partidos.length) h += `<div class="card"><div class="eyebrow">VUESTRO CAMINO</div><div style="height:8px"></div>${to.partidos.slice().reverse().map(p => cardPartido(j, p)).join('')}</div>`;
  return h + `<button class="btn" onclick="salirTorneo()">VOLVER AL CALENDARIO</button></div>`;
}

/* ── El momento clave: se juega en la pista o se simula ── */
function vMomento(){
  const to = S.torneo, m = to && to.momento;
  if(!m){ S.pantalla = to ? 'torneo' : 'temporada'; return to ? vTorneo() : vTemporada(); }
  const opp = to.rival, e = m.eleccion;
  const titulo = m.forma === 'tiempo' ? 'PUNTO CLAVE' : m.forma === 'leer' ? 'LEER AL RIVAL' : m.forma === 'camino' ? 'ELIGE CAMINO' : m.tipo === 'punto' ? 'PUNTO CLAVE' : 'JUEGO CLAVE';
  const icoTit = m.forma === 'tiempo' ? 'rayo' : m.forma === 'leer' ? 'ojo' : m.forma === 'camino' ? 'camino' : 'pelota';
  let h = `<div class="fade">
  <div class="card momento-cab">
    <div class="momento-top">${emblemaSede(to.ev)}<div style="min-width:0"><div class="eyebrow">${esc(nombreRondaActual(to))}${m.previa ? ' · PARA CLASIFICAR' : ''}</div><div class="momento-ev">${esc(to.ev.nom)}</div></div></div>
    <div class="momento-tit">${ico(icoTit)}<span>${titulo}</span></div>
    <p class="sub" style="margin:0">${m.sit}</p>
    ${m.forma === 'pista' ? `<div class="hr"></div>
    <div class="g2">
      <div><div class="eyebrow">${m.tipo === 'punto' ? 'MARCADOR' : 'EMPEZÁIS'}</div><div class="title-lg">${textoPuntos(m.inicio)}</div></div>
      <div><div class="eyebrow">SACA</div><div class="title-lg">${m.saca === 0 ? 'Vosotros' : 'Ellos'}</div></div>
    </div>
    ${m.tipo === 'juego' && !m.inicioFijo && m.inicio[0] !== m.inicio[1] ? `<p class="muted" style="margin:8px 0 0">${m.inicio[0] > m.inicio[1] ? 'Empezáis por delante: sois mejores que ellos.' : 'Empezáis por detrás: son mejores que vosotros.'}</p>` : ''}` : ''}
    <div class="hr"></div>
    <div class="mrow"><span class="nm">${fichaPais(opp.flag)} ${esc(opp.nombre)} / ${esc(opp.nombre2)}</span><span class="rk">#${opp.rank}</span></div>
    <p class="muted" style="margin:2px 0 0">Juegan a <b style="color:var(--text)">${esc(opp.arq.nom)}</b>.</p>
  </div>`;

  if(m.forma === 'pista'){
    const pr = probMomento(m), col = pr>=60?'var(--bien)':pr>=40?'var(--gold)':'var(--danger)';
    return h + `${probTV(pr, 'si lo simuláis')}<div style="height:10px"></div>
    <button class="btn" style="background:var(--gold);color:#2a1d00" onclick="jugarMomento()">${ico('pelota')} JUGARLO EN LA PISTA</button><div style="height:8px"></div>
    <button class="btn ghost" onclick="simularMomento()">${ico('avanzar')} SIMULARLO</button>
    <p class="muted center" style="margin:10px 0 0">${m.tipo === 'punto' ? 'Un solo punto: quien lo gane, gana el partido.' : 'Gana quien llegue antes a 4 puntos. A 40-40, punto de oro.'}<br>Es el mismo % del torneo: simulado es exacto; jugándolo en la pista, depende de cómo juegues.<br>
      Dificultad <b style="color:var(--text)">${difActual().nom}</b> · <a href="#" style="color:var(--accent);font-weight:800" onclick="S.volverComo='momento';S.pantalla='como';render();return false">controles y dificultad</a></p>
    </div>`;
  }

  if(e){
    const siGana = m.previa ? (to.kPrevia >= RONDAS_PREVIA-1 ? '<b>¡Dentro del cuadro!</b> Clasificasteis.' : '<b>Seguís vivos en la previa.</b> Queda un partido para entrar.')
                 : m.esFinal ? '<b>¡El título es vuestro!</b>' : '<b>Partido vuestro.</b> A la siguiente ronda.';
    const siPierde = m.previa ? 'Os quedáis sin clasificar. A casa.' : m.esFinal ? 'Se llevan el título. Finalistas.' : 'Se llevan el partido. Fuera del torneo.';
    if(m.forma === 'camino') h += casillasHTML(m, true);
    if(m.forma === 'leer') h += leerHTML(m.leer);
    const cabecera = m.forma === 'leer' ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="eyebrow">${ico('ojo')} LEER AL RIVAL</div>${chipsLectura(m.leer)}</div>` : m.forma === 'tiempo'
      ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="eyebrow">${ico('rayo')} RÁFAGA</div>${chipsRafaga(m.rafaga)}</div>`
      : `<div class="eyebrow">CAMINO ${e.i + 1}</div>`;
    return h + `<div class="card ${e.gana ? 'event-hero' : 'event-hero mal'}">
      ${cabecera}
      <div class="title-xl" style="margin:6px 0 8px">${e.gana ? (m.previa ? '¡CLASIFICÁIS!' : '¡LO GANASTEIS!') : 'SE OS ESCAPÓ'}</div>
      <p class="sub" style="margin:0">${e.texto}</p>
      <div class="hr"></div>
      <p class="sub" style="margin:0">${e.gana ? siGana : siPierde}</p>
    </div>
    <button class="btn" onclick="continuarMomento()">CONTINUAR</button></div>`;
  }

  { const empezado = momentoEmpezado(m), pr = empezado ? Math.round(100*probActualMomento(m)) : probMomento(m), col = pr>=60?'var(--bien)':pr>=40?'var(--gold)':'var(--danger)';
    h += `${probTV(pr, empezado ? 'ahora' : '')}
      <p class="muted" style="margin:0 2px 11px">${empezado ? (m.forma === 'camino' ? 'Ese camino no era, pero seguís vivos: este es el % que os queda, elijáis el camino que elijáis.' : 'Con lo que lleváis, este es el % que os queda' + (m.forma === 'leer' ? ' tapando la zona marcada' : '') + '. Si lo simuláis ahora, se decide con él.') : m.forma === 'leer' ? 'Es el mismo % del torneo: tapando la zona marcada, ganáis exactamente eso.' : m.forma === 'camino' ? 'Es el mismo % del torneo: elijáis la casilla que elijáis, pasáis exactamente con eso.' : 'Es el mismo % del torneo. Simulado es exacto; la zona verde está hecha para ese %, y con buen timing ganáis más.'}</p>`; }
  h += m.forma === 'tiempo' ? rafagaHTML(m.rafaga) : m.forma === 'leer' ? leerHTML(m.leer) : casillasHTML(m, false);
  return h + `<button class="btn ghost sm" onclick="simularMomento()">${ico('avanzar')} SIMULARLO</button></div>`;
}
/* Las casillas del camino: las mismas reglas que el cuadro de los Majors, para un solo partido */
function casillasHTML(m, revelar){
  const c = m.camino, fall = c.falladas;
  let h = `<div class="card"><div class="eyebrow">EL FINAL DEL TERCER SET</div><div style="height:9px"></div><div class="cuadro">`;
  for(let i = 0; i < c.casillas; i++){
    const mina = c.minas.indexOf(i) >= 0, yaFallada = fall.indexOf(i) >= 0;
    let cls = 'casilla', txt = '?';
    if(revelar){
      if(i === c.elegida){ cls += mina ? ' mala' : ' buena'; txt = mina ? '✖' : '✔'; }
      else { cls += ' revelada'; txt = mina ? '✖' : ''; }
    } else if(yaFallada){ cls += ' mala revelada'; txt = '✖'; }
    else { cls += ' activa'; if(c.pista === i){ cls += ' avisada'; txt = '❗'; } }
    h += `<button class="${cls}" ${!revelar && !yaFallada ? `onclick="elegirCaminoMomento(${i})"` : 'disabled'}>${txt}</button>`;
  }
  h += `</div>`;
  if(!revelar){
    const quedan = c.casillas - fall.length, avisoVivo = c.pista !== null && fall.indexOf(c.pista) < 0;
    const pc = Math.round(100*(c.obj != null ? probActualMomento(m) : .5)), col = pc>=70?'var(--bien)':pc>=45?'var(--gold)':'var(--danger)';
    h += `<div style="height:11px"></div>${probTV(pc, 'de pasar')}
      <p class="muted" style="margin:7px 0 0">${quedan} caminos por probar. <b style="color:var(--text)">Elijáis el que elijáis${avisoVivo ? ' (menos el marcado, que os saca seguro)' : ''}, pasáis con el ${pc}% exacto</b>${c.vidas > 0 ? `, contando ${c.vidas === 1 ? 'la oportunidad de más que os queda' : 'las ' + c.vidas + ' oportunidades de más que os quedan'}` : ''}.</p>
      ${c.salvada ? `<div class="log gold" style="margin:8px 0 0">${ico('escudo')} <b>¡Bola de partido salvada!</b> Ese camino no era: elegid otro.</div>` : ''}
      ${avisoVivo ? `<div class="log" style="margin:8px 0 0">${ico('mente')} Tu <b>Mental (${Math.round(S.j.stats.mental)})</b> te avisa: por <b>ahí no</b>. Ese camino os saca del partido.</div>` : ''}`;
  }
  return h + `</div>`;
}

/* ── Cómo se juega, ajustes y partido rápido ── */

/* ═══════════════════════════════════════════════════════════════

   El punto de oro sin opciones que elegir: se juega a golpes. Tres golpes
   seguidos y en cada uno un cursor que va y viene; hay que pararlo en la zona

   vuestro. La zona crece con la estadística de cada golpe y con la

const SERIES_RAFAGA = [
  [['🎾','RESTO','pared'], ['🏐','VOLEA','volea'], ['💥','REMATE','remate']],
  [['☂️','GLOBO','globo'], ['🍽️','BANDEJA','bandeja'], ['🐍','VÍBORA','remate']],
  [['🧱','SALIDA DE PARED','pared'], ['🎾','DRIVE','pared'], ['🏐','VOLEA','volea']],
  [['🪶','CHIQUITA','volea'], ['🏐','VOLEA','volea'], ['💥','REMATE','remate']],
];
const RAFAGA_BIEN = ['La bola salió de la pala justo cuando tenía que salir.', 'Tres golpes, tres decisiones rápidas. Se quedaron mirando.', 'Pegasteis a tiempo cuando más quemaba la bola.'];

function crearRafaga(j, edge, obj){
  const D = difActual(), s = j.stats, e = clamp(edge, -15, 15), sT = obj != null ? aciertoParaDosDeTres(obj) : null;
  const golpes = pick(SERIES_RAFAGA).map(([ic, nom, stat]) => {
    const extra = 0.05*clamp((s[stat] - 55)/40, -1, 1);
    /* en un torneo, la zona verde mide lo que hace falta para acertar 2 de 3 con el % del partido */
    const w = sT != null ? clamp(0.33*erfinv(Math.min(sT, .985)) + extra*.5, 0.06, 0.46) : clamp(0.17 + extra + D.rafaga + e*0.004, 0.1, 0.42);
    return { ic, nom, stat, w, centro: rnd(w/2 + 0.06, 1 - w/2 - 0.06), res:null, pos:null };
  });
  return { golpes, dur: sT != null ? clamp(1150 + 400*(obj - .5), 950, 1350) : clamp(1100 + e*14 + D.rafagaMs, 650, 1800), i:0, t0:0, bloqueoHasta:0, ultimo:null, fin:null, finAt:0 };

/* ═══════════════════════════════════════════════════════════════
   LEER AL RIVAL
   Punto de oro y la bola la tienen ellos: ¿a dónde la van a mandar? Tapas
   izquierda, centro o derecha. Tres bolas y gana quien lea dos. Su estilo de
   juego dice a dónde suelen ir; con Mental alto ves los porcentajes y a veces
   pillas cómo se perfilan. Si sois mejores, alguna bola mal leída la sacáis.
   ═══════════════════════════════════════════════════════════════ */
const ZONAS_LEER = [['⬅️','IZQUIERDA','a la izquierda'], ['⬆️','CENTRO','al centro'], ['➡️','DERECHA','a la derecha']];
const LECTURA_ESTILO = {
  muro:     { w:[25,50,25], txt:'Globo y paciencia: casi todo al centro, esperando vuestro error.' },
  red:      { w:[42,16,42], txt:'Todo a la red: buscan las rejas, a los lados.' },
  potencia: { w:[52,18,30], txt:'Potencia y remate: van a por el revés, a la izquierda.' },
  zurda:    { w:[26,24,50], txt:'Zurd@ al drive: les sale solo hacia la derecha.' },
  joven:    { w:[40,20,40], txt:'Jóvenes sin miedo: se la juegan a las líneas.' },
  veterana: { w:[30,40,30], txt:'Oficio y colocación: al centro, entre los dos, y cambian mucho.' },
};
const LEER_BIEN = ['Les leísteis el punto entero: cada bola la teníais esperando.', 'Sabíais a dónde iba antes de que la pegaran. Se quedaron sin ideas.', 'Leísteis el patrón y cerrasteis con una volea al hueco.'];
const LEER_MAL = ['Os cambiaron el guion justo cuando lo teníais leído.', 'Os ganaron con la bola que no esperabais.', 'Adivinaron que ibais a adivinar.'];
function crearLectura(j, opp, edge, obj){
  const est = LECTURA_ESTILO[opp && opp.arq && opp.arq.id] || LECTURA_ESTILO.veterana, D = difActual();
  const lectura = clamp((j.stats.mental - 35)/50 + D.eleccion*2, 0, 1), e = clamp(edge, -15, 15);
  const bolas = [];
  let prev = -1;
  for(let b = 0; b < 3; b++){
    /* cada bola cambia un poco el plan, y rara vez repiten el lado de la anterior */
    let w = est.w.map((x, i) => x * rnd(.75, 1.25) * (i === prev ? .7 : 1));
    const suma = w.reduce((a, x) => a + x, 0);
    w = w.map(x => Math.round(100*x/suma));
    w[1] = 100 - w[0] - w[2];
    const u = Math.random()*100, dir = u < w[0] ? 0 : u < w[0] + w[1] ? 1 : 2;
    const chivato = Math.random() < .25 + .35*lectura ? (Math.random() < .8 ? dir : pick([0,1,2].filter(i => i !== dir))) : null;
    /* lo que se enseña es la probabilidad exacta de cada zona, contando lo que delata el perfil (acierta 8 de cada 10) */
    const post = chivato === null ? w.map(x => x/100) : (() => { const q = w.map((x, i) => x*(i === chivato ? .8 : .1)), t = q.reduce((a, x) => a + x, 0); return q.map(x => x/t); })();
    const mostrado = post.map(x => Math.round(100*x)); mostrado[1] = 100 - mostrado[0] - mostrado[2];
    const bola = { w, dir, chivato, post, mostrado };
    if(obj != null){
      /* tapando la zona marcada (la más probable), cada bola sale bien lo justo para ganar 2 de 3 con la probabilidad exacta del partido */
      const pc = Math.max.apply(null, post), sT = aciertoParaDosDeTres(obj);
      if(sT >= pc){ bola.escapa = 0; bola.salva = (sT - pc)/(1 - pc); } else { bola.salva = 0; bola.escapa = 1 - sT/pc; }
    }
    bolas.push(bola);
    prev = dir;
  }
  return { bolas, k:0, aciertos:0, fallos:0, hist:[], obj: obj != null ? obj : null, exacta: lectura >= .45, estilo: est.txt,
           salva: clamp(.14 + e*.02 + D.eleccion, 0, .5), escapa: clamp(.08 - e*.015, 0, .3), fin:null };
}
function leerZona(L, i){
  if(!L || L.fin || !(i >= 0 && i <= 2)) return null;
  const b = L.bolas[L.k], leida = i === b.dir, ok = leida ? Math.random() >= (b.escapa != null ? b.escapa : L.escapa) : Math.random() < (b.salva != null ? b.salva : L.salva);
  L.hist.push({ elegida:i, dir:b.dir, leida, ok });
  if(ok) L.aciertos++; else L.fallos++;
  L.k++;
  Sonido.golpe(ok ? .8 : .2);
  if(hayDOM && PREF.vibracion && navigator.vibrate){ try{ navigator.vibrate(ok ? 15 : [30, 40, 30]); }catch(err){} }
  if(L.aciertos >= 2 || L.fallos >= 2) L.fin = { gana: L.aciertos >= 2, texto: L.aciertos >= 2 ? pick(LEER_BIEN) : pick(LEER_MAL) };
  return L.fin;
}
function leerZonaMomento(i){
  const m = S.torneo && S.torneo.momento; if(!m || m.forma !== 'leer' || m.eleccion) return;
  const fin = leerZona(m.leer, i);
  if(fin) m.eleccion = { i, gana: fin.gana, texto: fin.texto };
  guardar(); render();
}
function textoBolaLeida(x){
  const z = ZONAS_LEER[x.dir][2];
  if(x.leida) return x.ok ? `<b>✓ La leísteis:</b> iba ${z} y la cerrasteis con una volea.` : `La leísteis, pero os llegó con demasiado veneno ${z}.`;
  return x.ok ? `Os pillaron a contrapié (iba ${z})… y la sacasteis igual.` : `✗ Se fue ${z}. No llegasteis.`;
}
function chipsLectura(L){
  return `<div class="chips-rafaga">${[0,1,2].map(i => {
    const x = L.hist[i];
    return `<span class="chip ${x ? (x.ok ? 'bien' : 'fuera') : (i === L.k && !L.fin ? 'ahora' : '')}"><span class="num">${i + 1}</span>${x ? `<span class="marca">${x.ok ? '✓' : '✗'}</span>` : ''}</span>`;
  }).join('')}</div>`;
}
function leerHTML(L){
  const b = L.bolas[Math.min(L.k, 2)], ult = L.hist[L.hist.length - 1];
  let h = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="eyebrow">${ico('ojo')} LEER AL RIVAL · BOLA ${Math.min(L.k + 1, 3)} DE 3</div>${chipsLectura(L)}</div>
    <p class="muted" style="margin:7px 0 0">${L.estilo} <b style="color:var(--text)">Leéis 2 de 3 y el punto es vuestro.</b>${L.obj != null ? ` Tapando siempre la zona más probable ganáis el <b style="color:var(--text)">${Math.round(L.obj*100)}%</b> de las veces.` : ''}</p>`;
  if(ult) h += `<div class="log ${ult.ok ? '' : 'bad'}" style="margin:9px 0 0">${textoBolaLeida(ult)}</div>`;
  if(!L.fin){
    const vals = b.mostrado || b.w, maxW = Math.max.apply(null, vals);
    h += `${pistaLeerHTML(vals, maxW)}
      ${b.chivato !== null ? `<div class="log gold" style="margin:9px 0 0">${ico('ojo')} <b>Se perfilan para ir ${ZONAS_LEER[b.chivato][2]}.</b> Ya está contado en los porcentajes.</div>` : ''}
      <p class="muted center" style="margin:8px 0 0">Toca la zona que vais a tapar.</p>`;
  }
  return h + `</div>`;
}

/* ═══════════════════════════════════════════════════════════════
   MÁS CARRERA Y MÁS PISTA
   · El circuito con nombre: las 40 mejores parejas se repiten y guardan historial contigo.
   · Pareja para cada torneo, material (palas y zapatillas) y partidos enteros en la pista.
   · Salida de pista, apuntar el golpe, entrenamiento, tu jugador a tu gusto y ambiente.
   ═══════════════════════════════════════════════════════════════ */

/* ── El circuito con nombre ── */
function ptsDeRank(k){
  let lo = 1, hi = 13000;
  for(let i = 0; i < 40; i++){ const m = (lo + hi)/2; if((rankDePuntos(m) || 2000) > k) lo = m; else hi = m; }
  return Math.round(hi);
}
function nuevaParejaCircuito(rank, pool){
  const r = parejaRealCircuito(rank, pool);
  if(r) return r;
  const hay = new Set();
  for(const p of pool || []){ hay.add(p.nombre); hay.add(p.nombre2); }
  let d = duplaRival(rank);
  for(let i = 0; i < 12 && (hay.has(d.nombre) || hay.has(d.nombre2) || d.nombre === d.nombre2); i++) d = duplaRival(rank);
  return { id:'c' + ri(100000, 999999), nombre:d.nombre, nombre2:d.nombre2, flag:d.flag, flag2:d.flag2, arq:d.arq, forma:rnd(-2, 2), titulos:0 };
}
function asegurarCircuito(j){
  if(!j) return [];
  if(!j.circuito || !j.circuito.length){
    j.circuito = [];
    for(let k = 1; k <= 40; k++){ const p = nuevaParejaCircuito(k, j.circuito); if(!p.real) p.titulos = Math.max(0, Math.round((41 - k)/5 + rnd(-1, 2))); j.circuito.push(p); }
  }
  else if(migrarCircuitoReal(j)) guardar();      /* carrera vieja: entran los de verdad */
  if(j.circuito[0] && j.circuito[0].pts == null){ sembrarCircuito(j.circuito, j.anio*TRIMESTRES_POR_ANIO + j.trimestre); if(j.circuitoW == null) j.circuitoW = j.anio*TRIMESTRES_POR_ANIO + j.trimestre - 1; }
  return j.circuito;
}
/* cada casilla del circuito ocupa un puesto del ranking, contando que vosotros también tenéis el vuestro */
function casillaDeRank(j, rank){ return j.ranking && rank > j.ranking ? rank - 1 : rank; }
function rivalDelCircuito(rank){
  const j = S ? S.j : null;
  if(!j || j.retirado || rank > 40) return duplaRival(rank);
  const pool = asegurarCircuito(j), p = pool[clamp(casillaDeRank(j, rank), 1, pool.length) - 1];
  return { id:p.id, nombre:p.nombre, nombre2:p.nombre2, flag:p.flag, flag2:p.flag2, arq:p.arq, rank,
           rating: p.nivel != null ? p.nivel + (p.forma || 0) : ratingDeRank(rank) + p.forma };
}
function rivalesSinRepetir(t, rondas){
  const usados = new Set();
  return [...Array(rondas)].map((_, k) => {
    for(let i = 0; i < 12; i++){ const r = generarRival(t, k, rondas); if(!r.id || !usados.has(r.id)){ if(r.id) usados.add(r.id); return r; } }
    return duplaRival(generarRival(t, k, rondas).rank);
  });
}
/* cada trimestre el circuito se mueve: parejas en racha suben, otras bajan y alguna se separa */
/* el circuito juega su trimestre al cerrarse cada uno: ver cerrarCircuitoTrimestre */
function evolucionarCircuito(j){ cerrarCircuitoTrimestre(j); }
function anotarH2H(j, opp, gano){
  if(!j || !opp || !opp.id) return;
  const h = j.h2h = j.h2h || {}, e = h[opp.id] = h[opp.id] || { g:0, p:0, n: opp.nombre + ' / ' + opp.nombre2, flag: opp.flag };
  if(gano) e.g++; else e.p++;
  const p = (j.circuito || []).find(x => x.id === opp.id);
  if(p) p.forma = clamp(p.forma + (gano ? -.35 : .35), -3, 3);
}
function h2hDe(j, id){ return j && j.h2h && id ? j.h2h[id] || null : null; }
function rivalidades(j){
  return Object.keys(j.h2h || {}).map(id => Object.assign({ id }, j.h2h[id])).filter(e => e.g + e.p >= 2).sort((a, b) => (b.g + b.p) - (a.g + a.p)).slice(0, 3);
}
function vRanking(){
  const j = S.j; if(!j){ S.pantalla = 'inicio'; return vInicio(); }

  const tu = rk => `<div class="rk-fila tu"><span class="rk-n">#${rk}</span><span class="rk-nm">${fichaPais(j.cod)} <b>${esc(j.nombre)} / ${esc(j.pareja ? j.pareja.nombre : '—')}</b><small>${rk > 20 ? `A ${Math.max(0, ptsDeRank(20) - pts)} pts del top 20` : 'Vosotros'}</small></span><span class="rk-pt">${pts} pts</span></div>`;

      <small>${p.titulos} título${p.titulos === 1 ? '' : 's'} · juegan a ${esc(p.arq.nom)}${e ? ` · contra vosotros <b>${e.g}-${e.p}</b>` : ''}</small></span><span class="rk-pt">${ptsDeRank(r)} pts</span></div>`;

    <p class="sub" style="margin:0">Juegan su propio calendario y suben o bajan según lo que ganan. Os las iréis cruzando en los cuadros grandes y cada partido queda en el historial. ${j.ranking ? `Vosotros: <b>#${j.ranking}</b> con <b>${pts} pts</b>.` : 'Todavía no tenéis ranking.'}</p></div>
  <div class="card">${filas}${!j.ranking ? '<p class="muted" style="margin:8px 0 0">Suma puntos en los FIP para entrar en el ranking.</p>' : ''}${pieReal}</div>
  ${alrededorHTML(j)}
  <div class="card"><div class="eyebrow">⚔️ VUESTRAS RIVALIDADES</div><div style="height:4px"></div>
    ${riv.length ? riv.map(r => `<div class="li"><div class="g"><b>${fichaPais(r.flag)} ${esc(r.n)}</b><span>${r.g + r.p} partidos entre vosotros</span></div><span class="pill ${r.g >= r.p ? 'acc' : 'mal'}">${r.g}-${r.p}</span></div>`).join('')
      : '<p class="muted" style="margin:4px 0 0">Cuando os crucéis varias veces con la misma pareja, aquí aparecerá vuestro historial.</p>'}
  </div>

/* ── Pareja para cada torneo ── */
function suplentesTrimestre(j){

function materialDe(j){

function equipoMaterial(j){

}
function bonoEquipo(j){ if(!j) return 0; const e = equipoMaterial(j); return e.pala.sim + e.zapas.sim; }
function aplicarMaterial(j, h){
  if(!j) return h;
  const e = equipoMaterial(j), c = e.pala.control || 0, pot = e.pala.potencia || 0;

function comprarMaterial(id){

function materialHTML(j){

/* ── El partido entero en la pista ── */
function probTieBreak(p){
  const q = 1 - p, iguales = p*p/(p*p + q*q), memo = {};
  const f = (a, b) => {
    if(a >= 7 && a - b >= 2) return 1; if(b >= 7 && b - a >= 2) return 0; if(a >= 6 && a === b) return iguales;
    const k = a + ',' + b; if(memo[k] == null) memo[k] = p*f(a + 1, b) + q*f(a, b + 1); return memo[k];
  };
  return f(0, 0);
}
function probSetFormato(p, N){
  const g = probJuego(p, 0, 0), tb = probTieBreak(p), memo = {};
  const f = (a, b) => {
    if(a >= N && a - b >= 2) return 1; if(b >= N && b - a >= 2) return 0; if(a === N && b === N) return tb;
    const k = a + ',' + b; if(memo[k] == null) memo[k] = g*f(a + 1, b) + (1 - g)*f(a, b + 1); return memo[k];
  };
  return f(0, 0);
}
function probPartidoFormato(p, N, sets){ const s = probSetFormato(p, N); return sets === 3 ? s*s*(3 - 2*s) : s; }
/* el punto que, jugado hasta el final con ese formato, da justo el % del partido (para "simular lo que queda") */
function pPuntoPartido(obj, N, sets){
  let lo = .02, hi = .98;
  for(let k = 0; k < 28; k++){ const m = (lo + hi)/2; if(probPartidoFormato(m, N, sets) < obj) lo = m; else hi = m; }
  return (lo + hi)/2;
}
function formatoCarrera(){ return { juegos: [3,4,6].includes(PREF.juegos) ? PREF.juegos : 3, sets: PREF.sets === 3 ? 3 : 1 }; }
function jugarPartidoEnPista(){
  const j = S.j, to = S.torneo; if(!to || to.fin || to.momento || minijuegoDeRonda(to)) return;
  const T = TIERS[to.ev.t], obj = probPartido(j, to.rival, to.ev)/100, rondaNom = nombreRondaActual(to), f = formatoCarrera();
  const cfg = cfgPartidoCarrera(j, to.rival, to.ev, rondaNom);
  cfg.rival = paramsRivalPista(edgeDesdeProb(obj) + difActual().rival, to.rival.arq);
  cfg.juegos = f.juegos; cfg.sets = f.sets; cfg.pPunto = pPuntoPartido(obj, f.juegos, f.sets);
  cfg.titulo = rondaNom; cfg.avisoSub = `${formatoTexto(f.sets, f.juegos, true)}<br>${Math.round(obj*100)}% de ganar si lo simulas`;
  cfg.subtitulo = `${to.rival.nombre.split(' ')[0]} / ${to.rival.nombre2.split(' ')[0]} · ${formatoTexto(f.sets, f.juegos, true)}`;
  cfg.alTerminar = rp => {
    const res = simularConResultado(j, to.rival, to.ev, to.enPrevia ? 0 : to.ronda, T.rondas, rp.gano);
    res.ronda = rondaNom; if(to.enPrevia) res.previa = true;
    res.sets = (rp.sets && rp.sets.length ? rp.sets : [rp.juegos]).map(s => s[0] + '-' + s[1]);
    res.partidoEnPista = true; res.oros = [];
    if(!rp.simulado && rp.stats){
      const st = rp.stats;
      res.vivo = { golpes:st.golpes, rallyMax:st.rallyMax, porTres:st.porTres, remates:st.remates, globos:st.globos, dejadas:st.dejadas, perfectos:st.perfectos };
      const pi = j.pista = j.pista || { jugados:0, ganados:0, porTres:0, rallyMax:0, perfectos:0 };
      pi.jugados++; if(rp.gano) pi.ganados++; pi.porTres += st.porTres; pi.rallyMax = Math.max(pi.rallyMax, st.rallyMax); pi.perfectos += st.perfectos;
    }
    S.pantalla = 'torneo';
    aplicarPartido(res);
  };
  S.pantalla = 'torneo';
  iniciarPartidoPista(cfg);
}

function apuntarHumano(j, eje){

/* ── Salida de pista: la bola que se va por el lateral se puede ir a buscar fuera, por la puerta ── */
function intentarSalida(b, recibe){
  if(!P || P.drill) return false;
  const lado = b.x < W/2 ? -1 : 1, puertaX = lado < 0 ? 0 : W, puertaY = recibe === 0 ? RED_Y + 1.3 : RED_Y - 1.3;
  const fx = puertaX + lado*1.7, fy = clamp(b.y, recibe === 0 ? RED_Y + .8 : 1.2, recibe === 0 ? L - 1.2 : RED_Y - .8);
  let mejor = null;
  for(const j of P.jug){
    if(j.lado !== recibe || j.inactivo) continue;
    const t = (Math.hypot(j.x - puertaX, j.y - puertaY) + Math.hypot(puertaX - fx, puertaY - fy))/Math.max(3, j.vel);
    if(!mejor || t < mejor.t) mejor = { j, t };
  }
  if(!mejor || mejor.t > 2.4) return false;
  const j = mejor.j, humano = j.humano && !P.humanoIA;
  P.salida = { id:j.id, fin: P.t + (humano ? 1.25 : .85), x:fx, y:fy, lado, recibe, pidio:false, margen: 2.4 - mejor.t, humano };
  P.estado = 'salida'; j.fuera = true; Input.accion = null;
  mostrarAviso('¡SALIDA DE PISTA!', humano ? '¡Corre fuera y pulsa GOLPE para devolverla!' : j.lado === 0 ? 'Tu pareja sale a buscarla' : 'Salen a buscarla', '#7FD3F7', humano ? 1.25 : .85);
  Sonido.grada(); P.fiesta = 1.2;
  return true;
}
function actualizarSalida(dt){
  const sa = P.salida, b = P.bola;
  for(const j of P.jug){
    if(j.inactivo) continue;
    if(j.id === sa.id) moverHacia(j, sa.x, sa.y, j.vel*1.15);
    else { const o = posicionBase(j); moverHacia(j, o.x, o.y, j.vel*.7); }
    aplicarMovimiento(j, dt);
    if(j.anim > 0) j.anim -= dt;
  }
  /* la bola cae fuera, por donde corre el que sale */
  const k = Math.min(1, dt*2.6);
  b.x += (sa.x + sa.lado*.3 - b.x)*k; b.y += (sa.y - b.y)*k; b.z = Math.max(.9, b.z - dt*2.2);
  if(sa.humano && Input.accion){ sa.pidio = true; Input.accion = null; }
  if(P.t >= sa.fin) resolverSalida();
}
function resolverSalida(){
  const sa = P.salida, j = P.jug[sa.id], b = P.bola;
  const p = sa.humano ? (sa.pidio ? clamp(.5 + sa.margen*.18 + (j.bonusCal || 0), .35, .85) : 0) : clamp(.22 + sa.margen*.22 + ((j.hab || .6) - .55), .1, .7);
  P.salida = null; P.estado = 'juego';
  if(Math.random() >= p){ b.viva = true; return terminar(1 - sa.recibe, '¡Por 3!', { porTres:true }); }
  j.x = sa.x; j.y = sa.y;
  Object.assign(b, { x: sa.x - sa.lado*.35, y: sa.y, z: 1, fueraPista: true, viva: true });
  golpear(j, 'globo', clamp(.55 + (j.hab || .6)*.3, .45, .9), sa.lado < 0 ? rnd(1.8, 4.2) : rnd(5.8, 8.2));
  b.fueraPista = true;
  if(j.lado === 0) P.stats.salidas = (P.stats.salidas || 0) + 1;
  Efectos.texto(j.x, j.y, '¡DEVUELTA DESDE FUERA!', '#7FD3F7'); Sonido.grada(); P.fiesta = 1.6;
}

  const p = PAISES.find(x => (x.ciudades || []).some(c => c.n === ev.ciudad));

  if(COD_CIUDAD[pais + '|' + c]) return COD_CIUDAD[pais + '|' + c];
  if(COD_CIUDAD[c]) return COD_CIUDAD[c];

/* ── La grada: un tendido con escalones, pasillos, barandilla y gente distinta en

function crearPersona(x, y, tam, a){
