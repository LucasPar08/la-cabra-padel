  S.msgs = [{txt:`🏓 <b>Temporada 1.</b> Tienes 17 años, una pala de hace tres temporadas y una bolsa. El ranking mundial no sabe que existes. A los FIP Promises.`},
            {txt:`🤝 Juegas con <b>${esc(nomPareja(j.pareja))}</b>, del ${POSICIONES[j.pareja.pos].nom}, de tu mismo club. Nivel ${j.pareja.nivel.toFixed(1)} y 58 de química. Empezasteis juntos a los doce años.`}];
  if(j.precocidad >= .86) S.msgs.push({tipo:'gold', txt:`🚀 <b>En el club no se lo creen.</b> Con 17 años ya ganas peloteando a gente de 25. Alguien dijo la palabra que no se dice: <i>fenómeno</i>. Tienes ${j.wildcards} invitaciones para meterte donde el ranking todavía no te deja.`});
  else if(j.precocidad >= .60) S.msgs.push({tipo:'gold', txt:`⚡ <b>Maduras antes que el resto.</b> El cuerpo ya te responde y los torneos han empezado a ofrecerte invitaciones. Tienes ${j.wildcards} wild cards.`});
  else if(j.precocidad >= .34) S.msgs.push({txt:`💪 Para tu edad estás fuerte: no vas a perder dos años en el gimnasio como los demás.`});
  S.pantalla = 'temporada';
  guardar(); render();
}

function continuarPartida(){
  const d = cargar();
  if(!d || !d.j){ S.pantalla='inicio'; render(); return; }
  const j = d.j;
  j.mejoras = j.mejoras || []; j.lujos = j.lujos || []; j.parejasHist = j.parejasHist || [];
  // partidas guardadas antes de que existieran estas cuentas
  j.salidasPista = j.salidasPista || 0; j.puntosRed = j.puntosRed || 0; j.puntosTot = j.puntosTot || 0;
  if(j.pareja && !j.pareja.estilo) j.pareja.estilo = pick(Object.keys(ESTILOS));
  j.genero = j.genero || 'M';
  if(j.animo === undefined) j.animo = null;
  if(j.novia === undefined) j.novia = null;
  j.equipo.preparador = !!j.equipo.preparador;
  S.j = j; S.cal = d.cal || generarTemporada(j);
  S.pantalla = j.retirado ? 'retiro' : 'temporada';
  if(j.retirado) S.legado = calcularLegado(j);
  S.msgs = [];
  render();
}

/* — la gira del trimestre — */
/* Las finales de estos torneos no se simulan: las juegas tú.
   Major → el cuadro desde cuartos. P1 y Finals → punto de oro en la final. */
function modoMinijuego(ev){
  if(ev.t === 'MJ') return 'cuadro';
  if(ev.t === 'P1' || ev.t === 'FIN') return 'duelo';
  return null;
}

function jugarTorneo(j, ev, opts){
  opts = opts || {};
  const T = TIERS[ev.t];
  let ronda = opts.desdeRonda || 0;
  const partidos = opts.partidos || [];
  let perfecto = opts.perfecto !== false, remontada = false, lesionado = false;

  /* La previa: dos partidos seguidos el mismo día. No dan puntos, cansan el
     doble y si pierdes uno te vuelves a casa sin haber pisado el cuadro. */
  if(opts.previa){
    for(let k = 0; k < RONDAS_PREVIA; k++){
      const opp = rivalDePrevia(ev);
      const res = simularPartido(j, opp, ev, 0, T.rondas);
      res.previa = true;
      res.ronda = (k===0 ? '1ª DE PREVIA' : '2ª DE PREVIA');
      j.pj++;
      j.orosJugados = (j.orosJugados||0) + res.oros.length;
      j.orosGanados = (j.orosGanados||0) + res.oros.filter(Boolean).length;
      j.salidasPista = (j.salidasPista||0) + (res.salidas||0);
      partidos.push(res);
      // dos partidos el mismo día: el segundo se juega con lo que quede
      j.energia = clamp(res.energia - 7, 0, 100);
      if(!res.gane){
        j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0;
        j.forma = clamp(j.forma - 1.2, -12, 12);
        j.moral = clamp(j.moral - 2, 0, 100);
        /* Caer en la previa no es irse con las manos vacías: el circuito paga
           algo por haber estado, aunque sea la mitad de una primera ronda.
           Sin eso, quien vive de previas no sube nunca y el juego se parte en
           dos: los que entran directo y los que no salen del pozo. */
        const T2 = TIERS[ev.t];
        const f = cerrarFichaTorneo(ev, 0, partidos, false, false, false);
        f.cayoEnPrevia = true;
        f.pts = Math.max(1, Math.round(T2.pts[T2.pts.length-2] * 0.5));
        f.plata = Math.round(T2.prem*0.012);
        f.ronda = 'Previa';
        return f;
      }
      j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
    }
  }

  while(ronda < T.rondas){
    if(opts.pausarEnRonda != null && ronda === opts.pausarEnRonda){
      return {ev, pausaFinal:true, victorias:ronda, partidos, perfecto, remontada, lesionado};
    }
    const opp = generarRival(ev.t, ronda, T.rondas);
    const res = simularPartido(j, opp, ev, ronda, T.rondas);
    j.energia = res.energia;
    j.pj++;
    j.orosJugados = (j.orosJugados||0) + res.oros.length;
    j.orosGanados = (j.orosGanados||0) + res.oros.filter(Boolean).length;
    j.salidasPista = (j.salidasPista||0) + (res.salidas||0);
    j.puntosRed = (j.puntosRed||0) + Math.round((res.red||0)*(res.puntos||0));
    j.puntosTot = (j.puntosTot||0) + (res.puntos||0);
    partidos.push(res);
    if(res.gane){
      j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
      j.forma = clamp(j.forma + (opp.rank < (j.ranking||3000) ? 1.6 : 0.7), -12, 12);
      j.moral = clamp(j.moral + 2, 0, 100);
      const perdioSet = res.sets.some(s=>{ const p = s.split('-').map(Number); return p[0] < p[1]; });
      if(perdioSet) perfecto = false;
      if(res.sets.length === 3){ const p0 = res.sets[0].split('-').map(Number); if(p0[0] < p0[1]) remontada = true; }
      ronda++;
    } else {
      j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0;
      j.forma = clamp(j.forma - 1.8, -12, 12);
      j.moral = clamp(j.moral - 3, 0, 100);
      perfecto = false;
      break;
    }
    if(res.lesionEnPartido && !j.lesion){
      j.lesion = pick(['Rotura de fibras en el gemelo','Esguince de tobillo','Sobrecarga lumbar','Epicondilitis','Fascitis plantar','Tendinitis del hombro']);
      j.lesionSem = ri(1,2);
      lesionado = true;
      break;
    }
  }
  return cerrarFichaTorneo(ev, ronda, partidos, perfecto, remontada, lesionado);
}

function cerrarFichaTorneo(ev, victorias, partidos, perfecto, remontada, lesionado){
  const T = TIERS[ev.t];
  const campeon = victorias >= T.rondas;
  const idxPts = Math.max(0, T.rondas - victorias);
  const pts = campeon ? T.pts[0] : (T.pts[Math.min(idxPts, T.pts.length-1)] || 0);
  const factores = [1, .585, .32, .175, .098, .058, .034];
  const plata = Math.round(T.prem * (factores[Math.min(idxPts, factores.length-1)] || .02));
  return {ev, victorias, campeon, pts, plata, partidos, perfecto, remontada, lesionado,
          ronda: nombreRonda(victorias, T.rondas, campeon)};
}
function nombreRonda(victorias, totalRondas, campeon){
  if(campeon) return gx('Campeón','Campeona');
  if(victorias === totalRondas-1) return 'Final';
  if(victorias === totalRondas-2) return 'Semifinal';
  if(victorias === totalRondas-3) return 'Cuartos';
  if(victorias === 0) return '1ª ronda';
  return victorias+1 + 'ª ronda';
}
function pesoResultado(r){ return r.pts * 1000 + r.victorias; }

function hacerGira(idx){
  const j = S.j;
  const gira = S.cal[j.trimestre].giras[idx];
  if(!accesible(j, gira)) return;
  S.enGira = {
    gira, rankAntes: j.ranking, quimicaAntes: j.pareja ? j.pareja.quimica : 0,
    jugables: gira.torneos.filter(ev=>puedeJugar(j, ev)),
    i: 0, resultados: [], pts:0, plata:0, vic:0, der:0, perfecto:false, remontada:false
  };
  continuarGira();
}

function continuarGira(){
  const j = S.j, st = S.enGira;
  while(st.i < st.jugables.length){
    if(j.lesion) break;
    const ev = st.jugables[st.i];
    if(j.edad<=19 && ['P2','P1','MJ','FIN'].indexOf(ev.t) >= 0) logro(j,'premier_teen');
    const modo = modoMinijuego(ev), TT = TIERS[ev.t];
    const r = jugarTorneo(j, ev, {
      previa: entradaTorneo(j, ev) === 'previa',
      /* El punto de oro se juega SOLO en la final. Encadenar dos puntos
         sueltos (semifinal y final) hacía que un P1 fuese casi inganable:
         la semifinal se simula como cualquier otro partido. */
      pausarEnRonda: modo === 'cuadro' ? TT.rondas-3 : modo === 'duelo' ? TT.rondas-1 : null
    });
    if(r.pausaFinal){
      if(modo === 'cuadro'){ S.cuadro = crearCuadro(j, ev, r); S.pantalla = 'cuadro'; }
      else { S.duelo = crearDuelo(j, ev, r); S.pantalla = 'duelo'; }
      guardar(); render();
      return;                       // la gira sigue cuando lo resuelvas
    }
    anotarTorneo(r);
    st.i++;
  }
  cerrarGira();
}

function anotarTorneo(r){
  const j = S.j, st = S.enGira, ev = r.ev;
  st.resultados.push(r);
  st.pts += r.pts; st.plata += r.plata; st.vic += r.victorias;
  st.der += (r.campeon ? 0 : 1);
  if(r.campeon && r.perfecto) st.perfecto = true;
  if(r.remontada) st.remontada = true;
  j.energia = clamp(j.energia + 6, 0, 100);   // se descansa entre torneo y torneo
  if(r.campeon){
    j.titulos.push({nom:ev.nom, tier:ev.t, a:j.anio, edad:j.edad, pista:ev.pista, pais:ev.pais,
                    pareja: j.pareja ? j.pareja.nombre : null});
    j.moral = clamp(j.moral+12,0,100);
    j.fama += ev.t==='MJ'?25:ev.t==='FIN'?20:ev.t==='P1'?14:ev.t==='P2'?8:3;
    j.hist.push({a:j.anio, t:`🏆 ${gx('Campeón','Campeona')}: ${esc(ev.nom)}`});
  } else if(r.victorias === TIERS[ev.t].rondas-1){
    j.finales++;
    j.hist.push({a:j.anio, t:`🥈 Finalista: ${esc(ev.nom)}`});
  }
}

function cerrarGira(){
  const j = S.j, st = S.enGira, gira = st.gira;
  const resultados = st.resultados;

  const w = j.anio*TRIMESTRES_POR_ANIO + j.trimestre;
  resultados.forEach(r=>{ if(r.pts>0) j.puntosHist.push({w, pts:r.pts}); });
  j.dinero += st.plata;
  j.premiosTotal = (j.premiosTotal||0) + st.plata;
  j.premiosAnio = (j.premiosAnio||0) + st.plata;
  recalcRank(j);

  /* La química se mueve con lo que ha pasado en la pista: los títulos unen y
     las primeras rondas seguidas separan. */
  let dq = 0;
  if(j.pareja){
    dq = Math.round(st.vic*1.6 - st.der*2.4 + (resultados.some(r=>r.campeon) ? 9 : 0));
    dq = clamp(dq, -16, 16);
    moverQuimica(j, dq);
    j.pareja.trimestres = (j.pareja.trimestres||0) + 1;
  }

  const notas = [];
  /* Lo que de verdad cuenta un torneo de pádel: si tuvisteis la red o si os
     pasasteis la semana defendiendo. */
  const ptsGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.puntos||0),0),0);
  const redGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.red||0)*(x.puntos||0),0),0);
  const orosGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.oros||[]).length,0),0);
  const orosGanados = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.oros||[]).filter(Boolean).length,0),0);
  const salidasGira = resultados.reduce((a,r)=>a+r.partidos.reduce((b,x)=>b+(x.salidas||0),0),0);
  if(ptsGira){
    const pcRed = Math.round(100*redGira/ptsGira);
    notas.push({tipo: pcRed>=52?'':'bad', txt:
      `🕸️ <b>La red fue vuestra el ${pcRed}%</b> de los ${ptsGira.toLocaleString('es')} puntos de la gira. ` +
      (pcRed>=58 ? 'Jugasteis casi siempre desde arriba: así es como se gana en pádel.'
       : pcRed>=48 ? 'Se repartió. Los partidos se decidieron en detalles.'
                   : 'Os pasasteis la gira defendiendo. Con el globo se recupera la red; sin él, se corre.') +
      ` · <b>${orosGanados}/${orosGira}</b> puntos de oro` +
      (salidasGira ? ` · 🚪 <b>${salidasGira}</b> ${salidasGira===1?'punto ganado saliendo de la pista':'puntos ganados saliendo de la pista'}` : '')});
  }
  if(j.lesion) notas.push({tipo:'bad', txt:`🩹 Se os cortó la gira: <b>${esc(j.lesion)}</b>. Te pierdes lo que viene.`});
  const saltados = gira.torneos.length - st.jugables.length;
  if(saltados>0) notas.push({txt:`🔒 Os quedasteis fuera de ${saltados} cuadro${saltados>1?'s':''} de la gira por ranking.`});
  if(j.pareja && j.pareja.quimica < 25) notas.push({tipo:'bad', txt:`💢 <b>Esto se rompe.</b> ${esc(j.pareja.nombre)} apenas te habla en los cambios de lado. O lo arregláis, o cambias de pareja antes de que lo haga ${gx('él','ella')}.`});

  const logros = chequearLogros(j, {perfecto: st.perfecto, remontada: st.remontada});

  const mejor = resultados.slice().sort((a,b)=>pesoResultado(b)-pesoResultado(a))[0];
  const titulos = resultados.filter(r=>r.campeon);
  /* Los partidos de la previa también son partidos: ganar dos a las nueve de la
     mañana para entrar al cuadro cuenta, aunque no dé un punto de ranking. */
  const ganados  = resultados.reduce((a,r)=>a + r.partidos.filter(x=>x.gane).length, 0);
  const perdidos = resultados.reduce((a,r)=>a + r.partidos.filter(x=>!x.gane).length, 0);
  let titulo, texto;
  if(!resultados.length){
    titulo = 'GIRA EN BLANCO';
    texto = 'No pudisteis entrar a ningún cuadro. Semanas de entrenamiento y nada más.';
  } else if(titulos.length > 1){
    titulo = `${titulos.length} TÍTULOS EN LA GIRA`;
    texto = `Arrasasteis: ${titulos.map(r=>esc(r.ev.ciudad)).join(', ')}. Una gira de esas se recuerda.`;
  } else if(mejor.campeon){
    titulo = `${gx('¡CAMPEÓN','¡CAMPEONA')} EN ${mejor.ev.ciudad.toUpperCase()}!`;
    texto = mejor.ev.t==='MJ' ? `Ganasteis un <b>Major</b>. ${paisDe(j).nom} entero os vio levantar ese trofeo.` :
            mejor.ev.t==='FIN' ? `Ganasteis las <b>Premier Padel Finals</b>. Sois la mejor pareja del año.` :
            mejor.ev.t==='P1' ? `Un <b>P1</b>. Ya jugáis de tú a tú con las mejores parejas del mundo.` :
            mejor.ev.t==='P2' ? `Título <b>Premier Padel</b>. Vuestro nombre queda en el cuadro grande.` :
            mejor.ev.t==='FIP5' ? `Título <b>Platinum</b>. Es el escalón que abre la puerta del Premier.` :
            `Trofeo en el FIP. Poco dinero, pero puntos que suman.`;
    if(mejor.perfecto) texto += ` Y sin ceder un set.`;
  } else if(mejor.victorias === TIERS[mejor.ev.t].rondas-1){
    titulo = `FINALISTAS EN ${mejor.ev.ciudad.toUpperCase()}`;
    texto = `Llegasteis a la final y se os escapó. Los puntos y el dinero quedan.`;
  } else if(ganados === 0){
    titulo = 'GIRA PARA OLVIDAR';
    texto = `${resultados.length} torneos, ninguna victoria. Aviones, hoteles y a casa. Así empieza casi todo el mundo.`;
  } else if(st.vic === 0){
    titulo = 'TODO EL VIAJE PARA LA PREVIA';
    texto = `${ganados} ${ganados===1?'partido ganado':'partidos ganados'}, todos en cuadros de clasificación, y ni un cuadro final. Levantarte a las siete para jugar a las nueve y volverte a casa el martes.`;
  } else {
    titulo = `LO MEJOR: ${mejor.ronda.toUpperCase()} EN ${mejor.ev.ciudad.toUpperCase()}`;
    texto = `Gira despareja, pero os lleváis ritmo de partido y algo de ranking.`;
  }

  const deltaRank = (st.rankAntes && j.ranking) ? st.rankAntes - j.ranking : 0;
  S.gira = { gira, resultados, pts:st.pts, plata:st.plata, vic:st.vic, titulo, texto,
             pg: ganados, pp: perdidos,
             deltaRank, logros, notas, campeon: titulos.length>0, dQuimica: dq };
  S.enGira = null;
  S.pantalla = 'gira';
  guardar(); render();
}

/* ─────────── EL CUADRO (solo Majors) ───────────
   Al llegar a cuartos de un Major el torneo se detiene. Cada casilla es un
   partido: detrás de alguna está la pareja que os saca. Cuanto mejor seáis
   respecto del cuadro, más caminos seguros. */
function crearCuadro(j, ev, parcial){
  const T = TIERS[ev.t];
  const miR = ratingDupla(j, ev.pista, ev);
  const rondas = [];
  for(let k = T.rondas-3; k < T.rondas; k++){
    const opp = generarRival(ev.t, k, T.rondas);
    /* Llegar a cuartos de un Major ya ha costado cuatro partidos: a partir de
       aquí el cuadro tiene que premiar, no rematarte. La base va por encima
       del 50% a propósito. */
    const objetivo = clamp(0.62 + (miR - opp.rating)*0.05, 0.40, 0.88);
    let casillas = 4, nMinas = 2, mejorDif = Infinity;
    for(let c = 4; c <= 6; c++){
      for(let m = 1; m <= 3; m++){
        if(c - m < 1) continue;
        const dif = Math.abs((c - m)/c - objetivo);
        if(dif < mejorDif){ mejorDif = dif; casillas = c; nMinas = m; }
      }
    }
    const minas = [];
    while(minas.length < nMinas){ const m = ri(0, casillas-1); if(minas.indexOf(m)<0) minas.push(m); }
    /* LEER EL PARTIDO: con Mental alto detectas de antemano uno de los peligros.
       Solo aparece si queda otro oculto: leer el punto da ventaja, nunca certeza. */
    const probPista = clamp((j.stats.mental - 45) / 60, 0, 0.85);
    const pista = (nMinas >= 2 && Math.random() < probPista) ? minas[ri(0, minas.length-1)] : null;
    rondas.push({
      nom: k === T.rondas-1 ? 'FINAL' : k === T.rondas-2 ? 'SEMIFINAL' : 'CUARTOS',
      opp, casillas, minas, pista, elegida: null
    });
  }
  /* LA BOLA DE PARTIDO SALVADA.
     Un error no puede eliminarte de un Major. Tienes un salvavidas —dos si
     llevas psicólog@— para sobrevivir a la primera bola de partido en contra.
     Es lo que pasa en los partidos de verdad, y convierte el cuadro en una
     remontada en lugar de una ejecución. */
  const vidas = 1 + (j.equipo.psico ? 1 : 0);
  return { ev, parcial, rondas, actual:0, terminado:false, gano:false,
           vidas, vidasIniciales: vidas, salvada:false };
}

function elegirCasilla(i){
  const c = S.cuadro, r = c.rondas[c.actual];
  if(c.terminado || r.elegida !== null) return;
  r.falladas = r.falladas || [];
  if(r.falladas.indexOf(i) >= 0) return;          // ese camino ya lo probaste
  c.salvada = false;
  if(r.minas.indexOf(i) >= 0 && c.vidas > 0){
    // bola de partido en contra… y la salvas. Sigues vivo en la misma ronda.
    c.vidas--;
    r.falladas.push(i);
    S.j.moral = clamp(S.j.moral-3, 0, 100);
    c.salvada = true;
    guardar(); render();
    return;
  }
  r.elegida = i;
  if(r.minas.indexOf(i) >= 0){
    c.terminado = true; c.gano = false;
    S.j.moral = clamp(S.j.moral-8, 0, 100);
    S.j.forma = clamp(S.j.forma-2, -12, 12);
  } else {
    c.actual++;
    if(c.actual >= c.rondas.length){
      c.terminado = true; c.gano = true;
      S.j.moral = clamp(S.j.moral+12, 0, 100);
      S.j.forma = clamp(S.j.forma+3, -12, 12);
    }
  }
  guardar(); render();
}

function cerrarCuadro(){
  const j = S.j, c = S.cuadro, T = TIERS[c.ev.t];
  const p = c.parcial;
  const victorias = (T.rondas-3) + (c.gano ? 3 : c.actual);
  // los partidos del minijuego cuentan como partidos jugados
  const jugados = c.gano ? 3 : c.actual + 1;
  j.pj += jugados;
  j.pg += (c.gano ? 3 : c.actual);
  j.pgAnio = (j.pgAnio||0) + (c.gano ? 3 : c.actual);
  if(!c.gano){ j.pp++; j.ppAnio = (j.ppAnio||0)+1; j.racha = 0; }
  else j.racha = (j.racha||0) + 3;
  j.energia = clamp(j.energia - jugados*6, 0, 100);
  const r = cerrarFichaTorneo(c.ev, victorias, p.partidos, p.perfecto && c.gano, p.remontada, false);
  anotarTorneo(r);
  S.cuadro = null;
  S.enGira.i++;
  continuarGira();
}

/* ─────────── EL PUNTO DE ORO ─────────── */
function resolverDuelo(i){
  const j = S.j, d = S.duelo, o = d.esc.ops[i];
  const pr = probsGolpe(j, d, o);
  const u = Math.random();
  let gana, texto;
  if(u < pr.gan){ gana = true;  texto = o.txtGan; }
  else if(u < pr.gan + pr.err){ gana = false; texto = o.txtErr; }
  else {
    const sigue = Math.random() < clamp(d.pBase + (o.delta||0), 0.05, 0.95);
    gana = sigue;
    texto = d.esc.sigue + ' ' + (sigue ? d.esc.gana : d.esc.pierde);
  }
  j.orosJugados = (j.orosJugados||0) + 1;
  if(gana) j.orosGanados = (j.orosGanados||0) + 1;
  // salir de la pista y ganar el punto de oro es de las cosas que se recuerdan
  if(gana && o.salida){
    j.salidasPista = (j.salidasPista||0) + 1;
    j.hist.push({a:j.anio, t:'🚪 Punto de oro ganado saliendo de la pista'});
  }
  d.resultado = { gana, texto, golpe:o };
  if(gana){ j.moral = clamp(j.moral+9,0,100); j.forma = clamp(j.forma+2,-12,12); moverQuimica(j, 4); }
  else    { j.moral = clamp(j.moral-7,0,100); j.forma = clamp(j.forma-2,-12,12); moverQuimica(j, -3); }
  guardar(); render();
}

function cerrarDuelo(){
  const j = S.j, d = S.duelo, res = d.resultado;

  /* El Mundial no es un torneo del calendario: es una campaña aparte */
  if(d.contexto === 'mundial'){
    if(res.gana){
      j.mundial = (j.mundial||0) + 1;
      j.mundialRonda = (j.mundialRonda||0) + 1;
      j.fama += 6;
      if(j.mundialRonda >= 4){
        j.mundialCopas = (j.mundialCopas||0) + 1;
        j.mundialRonda = 0;
        j.hist.push({a:j.anio, t:`🏅 Campe${ga()==='a'?'ona':'ón'} del Mundo con ${paisDe(j).nom}`});
        S.msgs = [{tipo:'gold', txt:`🏅 <b>¡${paisDe(j).nom} campe${ga()==='a'?'ona':'ón'} del Mundo!</b> Ganaste el punto que lo decidió todo. Eso no lo quita ningún ranking.`}];
        chequearLogros(j, {mundialCopa:true});
      } else {
        S.msgs = [{txt:`🇺🇳 <b>${paisDe(j).nom} pasa de ronda.</b> Siguiente parada: ${RONDAS_MUNDIAL[j.mundialRonda].nom.toLowerCase()}. ${RONDAS_MUNDIAL[j.mundialRonda].d}`}];
      }
    } else {
      j.mundialRonda = 0;
      S.msgs = [{tipo:'bad', txt:`🇺🇳 ${paisDe(j).nom} se despide del Mundial. El punto de oro se lo llevaron ellos.`}];
    }
    chequearLogros(j, {});
    S.duelo = null;
    S.pantalla = 'temporada';
    guardar(); render();
    return;
  }

  const T = TIERS[d.ev.t], p = d.parcial;
  if(res.gana && !d.esFinal){
    // ganó la semifinal → ahora la final, también a punto de oro
    S.duelo = crearDuelo(j, d.ev, p, T.rondas-1);
    j.pj++; j.pg++; j.pgAnio = (j.pgAnio||0)+1; j.racha = (j.racha||0)+1;
    j.energia = clamp(j.energia-7, 0, 100);
    guardar(); render();
    return;
  }
  const ganadas = d.esFinal ? (res.gana ? 2 : 1) : 0;
  const victorias = (T.rondas-2) + ganadas;
  j.pj++;
  if(res.gana){ j.pg++; j.pgAnio=(j.pgAnio||0)+1; j.racha=(j.racha||0)+1; }
  else { j.pp++; j.ppAnio=(j.ppAnio||0)+1; j.racha = 0; }
  j.energia = clamp(j.energia-7, 0, 100);
  const r = cerrarFichaTorneo(d.ev, victorias, p.partidos, p.perfecto && res.gana, p.remontada, false);
  anotarTorneo(r);
  S.duelo = null;
  S.enGira.i++;
  continuarGira();
}

function crearDueloMundial(j){
  const p = paisDe(j);
  const ciu = pick(p.ciudades).n;
  const ev = {t:'MUN', nom:'Mundial de Selecciones', ciudad:ciu, pista:p.pista, pais:null};
  return crearDuelo(j, ev, null, 2, 'mundial');
}

/* — trimestres sin competir — */
function trimestreEntreno(){
  const j = S.j;
  const posibles = STAT_KEYS.filter(k=>j.stats[k] < j.pot[k]);
  let txt;
  if(posibles.length){
    const k = pick(posibles);
    j.stats[k] = clamp(j.stats[k]+3, 10, j.pot[k]);
    txt = `🏋️ Un trimestre entero en el club de ${esc(j.ciudad)}: <b>+3 ${STAT_NOM[k]}</b>.`;
  } else {
    j.stats.mental = clamp(j.stats.mental+1,10,99);
    txt = `🏋️ Ya estás en tu techo natural. Entrenaste igual: <b>+1 Mental</b>.`;
  }
  j.energia = clamp(j.energia + 30, 0, 100);
  j.forma = clamp(j.forma - 2, -12, 12);
  S.msgs = [{txt}];
  pasarTrimestre();
}
function trimestreQuimica(){
  const j = S.j;
  if(!j.pareja){ trimestreEntreno(); return; }
  moverQuimica(j, 18);
  j.energia = clamp(j.energia + 18, 0, 100);
  j.forma = clamp(j.forma - 3, -12, 12);
  j.moral = clamp(j.moral + 6, 0, 100);
  S.msgs = [{txt:`🤝 Tres meses entrenando solo con <b>${esc(j.pareja.nombre)}</b>: señales, cruces, quién va a cada bola. <b>+18 de química</b> (ahora ${Math.round(j.pareja.quimica)}). Cero partidos oficiales.`}];
  pasarTrimestre();
}
function trimestreDescanso(){
  const j = S.j;
  j.energia = 100;
  j.moral = clamp(j.moral + 12, 0, 100);
  j.forma = clamp(j.forma - 4, -12, 12);
  S.msgs = [{txt:`🛋️ Tres meses sin competir. Vuelves enter${ga()} y con la cabeza limpia.`}];
  pasarTrimestre();
}

function pasarTrimestre(){
  const j = S.j;
  const rec = 34 + j.stats.fisico/8 + (j.equipo.fisio?12:0) + (j.equipo.preparador?10:0)
            + (tieneMejora(j,'altura')?10:0) + energiaExtraLujos(j);
  j.energia = clamp(j.energia + rec, 0, 100);
  const bien = bienestar(j);
  if(bien) j.moral = clamp(j.moral + bien, 0, 100);
  if(j.animo && j.animo.n > 0){
    j.animo.n--;
    if(j.animo.n === 0){
      const eraBueno = j.animo.val > 0;
      S.msgs = (S.msgs||[]).concat([{ txt: eraBueno
        ? '😐 Se acabó la racha. Vuelves a jugar a tu nivel de siempre.'
        : '🙂 Se te pasó. Vuelves a estar enter' + ga() + ' en la pista.' }]);
      j.animo = null;
    }
  }
  j.forma = clamp(j.forma * 0.88, -12, 12);
  if(j.lesionSem > 0){ j.lesionSem--; if(j.lesionSem<=0){ j.lesion=null; S.msgs=[{txt:'✅ Te han dado el alta. De vuelta a la pista.'}]; } }
  j.trimestre++;
  const wAhora = j.anio*TRIMESTRES_POR_ANIO + j.trimestre;
  j.puntosHist = j.puntosHist.filter(x => wAhora - x.w < PESO_ANTIGUEDAD.length);
  recalcRank(j);
  if(j.ranking && j.ranking<=10) j.trimestresTop10 = (j.trimestresTop10||0)+1;
  S.candidatos = null;                 // el mercado de parejas se refresca

  if(j.trimestre >= TRIMESTRES_POR_ANIO){ finTemporada(); return; }

  if(!j.lesion && Math.random() < 0.5){
    const e = eventoAleatorio(j);
    if(e){ S.evento = e; S.eventoRes = null; S.pantalla='evento'; guardar(); render(); return; }
  }
  S.pantalla = 'temporada';
  guardar(); render();
}

/* — eventos — */
function elegirEvento(i){
  const j = S.j, e = S.evento, op = e.ops[i];
  j.eventosVistos = j.eventosVistos || [];
  if(!e.repetible) j.eventosVistos.push(e.id);
  S.tirada = tirarDado(j, op);
  if(S.tirada) S.tirada.rodando = true;
  S.eventoRes = op.f(j, op) + aplicarFallo(j, op, S.tirada) + aplicarCritico(j, S.tirada);
  if(e.mundial && i === 0) S.dueloPendiente = 'mundial';
  j.moral = clamp(j.moral,0,100); j.energia = clamp(j.energia,0,100); j.forma = clamp(j.forma,-12,12);
  j.dinero = Math.max(0, j.dinero);
  recalcRank(j);
  guardar(); render();
}
function cerrarEvento(){
  S.evento = null; S.eventoRes = null; S.tirada = null;
  if(S.dueloPendiente === 'mundial'){
    S.dueloPendiente = null;
    S.duelo = crearDueloMundial(S.j);
    S.pantalla = 'duelo';
    guardar(); render();
    return;
  }
  S.pantalla = 'temporada';
  guardar(); render();
}

/* — fin de temporada — */
function finTemporada(){
  const j = S.j;
  const notas = [], cuentas = [];
  const rankFin = j.ranking;
  j.rankFin.push(rankFin);
  const parejaDelAnio = j.pareja ? j.pareja.nombre : null;

  cuentas.push(['Premios en torneos (tu mitad)', j.premiosAnio||0]);

  // patrocinios: en pádel se cobra menos, y la fama pesa proporcionalmente más
  const spBase = [0, 6000, 30000, 90000][j.sponsor] || 0;
  const spRank = !rankFin ? 0 : rankFin<=5 ? 420000 : rankFin<=10 ? 240000 : rankFin<=30 ? 90000 :
                 rankFin<=60 ? 32000 : rankFin<=100 ? 12000 : rankFin<=200 ? 4000 : 800;
  const sponsor = Math.round(spBase + spRank + j.fama*700);
  if(sponsor>0){ j.dinero += sponsor; cuentas.push(['Patrocinios y marcas', sponsor]); }

  const viajes = Math.round(11000 + (rankFin && rankFin<200 ? 15000 : 4000));
  j.dinero -= viajes;
  cuentas.push(['Vuelos, hoteles y overgrips', -viajes]);
  const equipo = costoStaffAnual(j);
  if(equipo){ j.dinero -= equipo; cuentas.push(['Renovación del equipo (se cobra en enero)', -equipo]); }

  if(j.dinero < 0){
    notas.push({tipo:'bad', txt:`💸 <b>Estás en números rojos.</b> Has tenido que pedir dinero en casa. Si no subes de nivel, esto no se sostiene.`});
    j.moral = clamp(j.moral-10,0,100);
    j.dinero = 0;
    if(j.equipo.entrenador>0 && Math.random()<.5){ j.equipo.entrenador--; notas.push({tipo:'bad',txt:'👋 Has tenido que soltar a tu entrenador. No daba.'}); }
  }

  /* — tu pareja decide si sigue contigo — */
  if(j.pareja){
    j.pareja.anios = (j.pareja.anios||0) + 1;
    j.pareja.edad++;
    // crece o decrece con la edad, y con tu nivel tira de ella hacia arriba
    const tiron = clamp((escalar(rawJugador(j)) - j.pareja.nivel)*0.24, -1.0, 3.2);
    j.pareja.nivel = clamp(j.pareja.nivel + (j.pareja.edad<=27 ? rnd(0.6,2.2) : j.pareja.edad<=32 ? rnd(-0.3,0.9) : rnd(-2.6,-0.6)) + tiron, 34, 96);
    if(j.pareja.edad >= 38 && Math.random() < 0.5){
      notas.push({tipo:'bad', txt:`👋 <b>${esc(j.pareja.nombre)} se retira.</b> ${j.pareja.anios} temporadas juntos y una cena larga para despedirlo. Necesitas pareja nueva.`});
      j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'se retiró'});
      j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(0,4), pick(NAC_RIV), posContraria(j.posicion), ri(20,28));
      j.pareja.quimica = 48;
    } else if(j.pareja.quimica < 22 && Math.random() < 0.62){
      notas.push({tipo:'bad', txt:`💔 <b>${esc(j.pareja.nombre)} rompe la pareja.</b> Llevabais medio año sin hablaros fuera de la pista. Te enteraste por Instagram.`});
      j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'se rompió la pareja'});
      j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(1,5), pick(NAC_RIV), posContraria(j.posicion), ri(20,32));
      j.pareja.quimica = 46;
    } else if(j.pareja.nivel > escalar(rawJugador(j)) + 6 && (!rankFin || rankFin > 120) && Math.random() < 0.45){
      notas.push({tipo:'bad', txt:`🚪 <b>${esc(j.pareja.nombre)} te deja por alguien mejor clasificad@.</b> Te lo dijo a la cara, al menos. Está ${(j.pareja.nivel - escalar(rawJugador(j))).toFixed(1)} puntos por encima de ti y tiene prisa.`});
      j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'te dejó por alguien mejor'});
      j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(0,3), pick(NAC_RIV), posContraria(j.posicion), ri(19,30));
      j.pareja.quimica = 50;
    } else {
      notas.push({txt:`🤝 <b>${esc(j.pareja.nombre)}</b> sigue contigo un año más. ${j.pareja.anios} temporada${j.pareja.anios>1?'s':''} juntos, nivel ${j.pareja.nivel.toFixed(1)} y ${Math.round(j.pareja.quimica)} de química.`});
    }
  }

  // rival
  avanzarRival(j);
  if(!j.rival.mejor || (j.rival.rank && j.rival.rank < j.rival.mejor)) j.rival.mejor = j.rival.rank;
  const batir = rankFin && j.rival.rank && rankFin < j.rival.rank;
  notas.push({txt:`${fichaPais(j.rival.flag)} <b>${esc(j.rival.nombre)}</b> cerró el año ${j.rival.rank?'#'+j.rival.rank:'sin ranking'} con ${j.rival.titulos} títulos. ${batir?'Tú estás por delante.':'Todavía te lleva ventaja.'}`});

  // envejecer
  j.edad++;
  const edadDeclive = 31 - Math.round((j.precocidad||0)*2);
  if(j.edad >= edadDeclive){
    const anios = j.edad - edadDeclive;
    const perdidas = [];
    for(const k of ['fisico','remate','volea','pared','bandeja']){
      const d = anios>=4 ? ri(3,5) : anios>=2 ? ri(2,4) : ri(1,3);
      j.stats[k] = clamp(j.stats[k]-d, 10, 99); perdidas.push('−'+d+' '+STAT_NOM[k]);
    }
    j.stats.mental = clamp(j.stats.mental+1, 10, 99);
    j.stats.globo = clamp(j.stats.globo+1, 10, 99);
    notas.push({tipo:'bad', txt:`⏳ <b>${j.edad} años.</b> El cuerpo cobra: ${perdidas.join(' · ')}. La cabeza, en cambio: <b>+1 Mental, +1 Globo</b>. En pádel se puede seguir ganando así.`});
  }

  const parejaTop = !!(rankFin && rankFin<=5 && parejaDelAnio && j.pareja && j.pareja.nombre === parejaDelAnio && j.pareja.anios>=1);
  const logros = chequearLogros(j, {batirRival: batir, parejaTop});

  const tAnio = j.titulos.filter(t=>t.a===j.anio);
  let titular, texto, bueno = false;
  if(tAnio.some(t=>t.tier==='MJ')) { titular='AÑO DE MAJOR'; texto=`Ganasteis un Major. El pádel de ${paisDe(j).nom} tiene un antes y un después.`; bueno = true; }
  else if(rankFin && rankFin<=10) { titular='TOP 10 DEL MUNDO'; texto='Terminaste el año entre las diez mejores parejas del planeta.'; bueno = true; }
  else if(rankFin && rankFin<=50) { titular='AÑO EN EL PREMIER'; texto='Top 50: entras directo a los cuadros grandes y vives del pádel.'; bueno = true; }
  else if(rankFin && rankFin<=150) { titular='AÑO DE PLATINUM'; texto='Ya no dependes de los Promises. El siguiente escalón está cerca.'; }
  else if(tAnio.length) { titular='AÑO DE APRENDIZAJE'; texto='Algún título, muchos aeropuertos y la sensación de que vas a algún sitio.'; }
  else { titular='AÑO DURO'; texto='Sin títulos, poco dinero y muchas primeras rondas. Así se forjan los que llegan… o se van.'; }

  // retiro
  let retiro = false;
  const viejo = j.edad >= 37 || (j.edad>=33 && (!rankFin || rankFin>400));
  if(viejo){
    retiro = true; j.retirado = true;
    if(L_esLeyenda(j)) logro(j, 'estatua');
    S.legado = calcularLegado(j);
  }

  S.finAnio = { anio:j.anio, rankFin, titular, texto, bueno, cuentas, notas, logros, retiro,
                titulosAnio: tAnio.length, pgAnio: j.pgAnio||0, ppAnio: j.ppAnio||0 };
  S.pantalla = 'finTemporada';
  guardar(); render();
}
function L_esLeyenda(j){
  const L = calcularLegado(j);
  return L.pts >= 480;
}

function irPretemporada(){
  const j = S.j;
  if(j.retirado){ S.pantalla = 'retiro'; render(); return; }
  j.anio++; j.trimestre = 0;
  j.mejoras = [];                     // las mejoras caducan cada enero
  j.premiosAnio = 0; j.pgAnio = 0; j.ppAnio = 0;
  j.enAcademia = false;
  S.cal = generarTemporada(j);
  S.candidatos = null;

  /* Desarrollo natural: te acercas a tu techo, deprisa de joven y despacio
     después. En pádel se madura tarde — el pico llega entre los 26 y los 30 —
     así que la curva es más larga que la de un tenista. */
  let tasa = j.edad<=20 ? .11 : j.edad<=23 ? .12 : j.edad<=27 ? .10 : j.edad<=31 ? .06 : 0;
  const prec = j.precocidad || 0;
  if(j.edad <= 21) tasa *= 1 + prec*3.4;      // el precoz adelanta su curva…
  else if(j.edad >= 25) tasa *= 1 - prec*0.5; // …y después se le aplana
  const boost = 1 + j.equipo.entrenador*0.10 + (j.equipo.fisio?0.04:0);
  const natural = [];
  for(const k of STAT_KEYS){
    const gap = j.pot[k] - j.stats[k];
    if(gap <= 0 || tasa === 0) continue;
    const g = Math.max(gap >= 3 ? 1 : 0, Math.round(gap*tasa*boost));
    if(g > 0){ j.stats[k] = clamp(j.stats[k]+g, 10, j.pot[k]); natural.push('+'+g+' '+STAT_NOM[k]); }
  }
  let libres = j.edad<=20 ? 10 : j.edad<=24 ? 8 : j.edad<=29 ? 6 : 4;
  libres += j.equipo.entrenador;
  S.pre = { libres, asig:{}, natural };
  S.pantalla = 'pretemporada';
  guardar(); render();
}

/* Pasado tu techo natural puedes seguir subiendo, pero cada punto cuesta el
   doble. Así nunca te quedas con puntos que no se pueden gastar. */
function costoPunto(j, p, k){
  const exceso = (j.stats[k] + (p.asig[k]||0)) - j.pot[k];
  if(exceso < 0) return 1;
  return 5 + exceso*3;
}
function puedeSubir(j, p, k){
  const v = j.stats[k] + (p.asig[k]||0);
  return v < 99 && p.libres >= costoPunto(j, p, k);
}
function asignar(k, d){
  const p = S.pre, j = S.j;
  p.asig[k] = p.asig[k] || 0;
  if(d>0){
    if(!puedeSubir(j, p, k)) return;
    p.libres -= costoPunto(j, p, k);
    p.asig[k]++;
  } else {
    if(p.asig[k] <= 0) return;
    p.asig[k]--;
    p.libres += costoPunto(j, p, k);   // devuelve exactamente lo que costó
  }
  render();
}
/* Reparte lo que queda priorizando lo que más pesa en tu estilo y lo que más
   lejos está de tu techo. */
function repartirAuto(){
  const j = S.j, p = S.pre, pesos = ESTILOS[j.estilo].pesos;
  let g = 0;
  while(p.libres > 0 && g++ < 300){
    let mejor = null, mejorVal = -1;
    for(const k of STAT_KEYS){
      if(!puedeSubir(j, p, k)) continue;
      const actual = j.stats[k] + (p.asig[k]||0);
      const val = pesos[k] * (1 + Math.max(0, j.pot[k]-actual)/25) / costoPunto(j, p, k);
      if(val > mejorVal){ mejorVal = val; mejor = k; }
    }
    if(!mejor) break;
    p.libres -= costoPunto(j, p, mejor);
    p.asig[mejor] = (p.asig[mejor]||0) + 1;
  }
  render();
}
function empezarTemporada(){
  const jj = S.j, pp = S.pre;
  if(pp){ for(const k in pp.asig) jj.stats[k] = clamp(jj.stats[k] + pp.asig[k], 10, 99); S.pre = null; }
  recalcRank(jj);
  S.msgs = [{txt:`🏓 <b>Temporada ${S.j.anio}.</b> ${S.j.edad} años, ${S.j.ranking?'#'+S.j.ranking+' del mundo':'sin ranking'} y una pareja con ${Math.round(S.j.pareja?S.j.pareja.quimica:0)} de química. A empezar otra vez.`}];
  S.pantalla = 'temporada';
  guardar(); render();
}

/* — compras — */
function comprarEntrenador(){
  const j = S.j, sig = NIVELES_ENTRENADOR[j.equipo.entrenador+1];
  if(!sig || j.dinero < sig.costo) return;
  j.dinero -= sig.costo; j.equipo.entrenador++;
  j.moral = clamp(j.moral+5,0,100);
  guardar(); render();
}
function comprarStaff(id){
  const j = S.j, s = STAFF.find(x=>x.id===id);
  if(!s || j.equipo[id] || j.dinero < s.costo) return;
  j.dinero -= s.costo; j.equipo[id] = true;
  guardar(); render();
}
function comprarMejora(id){
  const j = S.j, m = MEJORAS.find(x=>x.id===id);
  if(!m || tieneMejora(j,id) || j.dinero < m.costo) return;
  j.dinero -= m.costo; j.mejoras.push(id);
  if(id === 'altura') j.energia = clamp(j.energia+10,0,100);
  guardar(); render();
}
function comprarLujo(id){
  const j = S.j, l = LUJOS.find(x=>x.id===id);
  if(!l || tieneLujo(j,id) || j.dinero < l.costo) return;
  j.dinero -= l.costo; j.lujos.push(id);
  j.moral = clamp(j.moral + (l.moral||0), 0, 100);
  if(l.fama) j.fama += l.fama;
  j.hist.push({a:j.anio, t:`🛍️ ${nomLujo(l,j)}`});
  chequearLogros(j, {});
  guardar(); render();
}
function ficharPareja(i){
  const j = S.j, c = S.candidatos[i];
  if(!c || puedeFichar(j, c)) return;
  j.dinero -= c.prima;
  if(j.pareja) j.parejasHist.push({nombre:j.pareja.nombre, anios:j.pareja.anios, motivo:'la dejaste tú'});
  j.pareja = c;
  j.pareja.quimica = c.quimicaInicial;
  j.pareja.anios = 0; j.pareja.trimestres = 0;
  delete j.pareja.etq; delete j.pareja.quimicaInicial; delete j.pareja.prima; delete j.pareja.exigeRank;
  S.candidatos = null;
  j.hist.push({a:j.anio, t:`🤝 Nueva pareja: ${c.nombre}`});
  guardar(); render();
}
