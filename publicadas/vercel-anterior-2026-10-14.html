:root{
  /* ── Identidad ── El pádel se juega sobre césped artificial verde entre
     paredes de cristal. El fondo sale de ahí, no de un gris neutro. */
  --page-bg:#08191C;
  --card-bg:#0E2A2E;
  --card-bg-2:#143439;
  --border:rgba(110,215,195,.16);
  --border-soft:rgba(110,215,195,.09);

  /* ── Texto ── Tres niveles, ninguno a máximo contraste: un blanco puro
     sobre casi negro produce halo y cansa a los diez minutos. */
  --text:#DEEDE9;
  --text-2:#AECAC5;
  --muted:#87A8A3;

  /* ── Acento ── Solo para lo interactivo. */
  --accent:#22D3A5;
  --accent-dim:#0E9B78;
  --sobre-accent:#03211A;

  /* ── Tipos de pista ── Tres familias de tono bien separadas entre sí y del
     acento, para que una pista nunca se confunda con un botón. Siempre van
     con icono y palabra: el color no es el único canal. */
  --indoor:#9B87FF;      /* bajo techo · violeta */
  --exterior:#F0A03C;    /* al aire libre · naranja sol */
  --altura:#4FC3F7;      /* en altura · azul cielo fino */

  /* ── Categorías ── Escalera de prestigio: de gris a oro. */
  --cat-fip:#93A7BC;
  --cat-star:#3AD98F;
  --cat-plat:#29B6F6;
  --cat-p1:#F075C0;
  --cat-major:#F5C542;

  /* ── Semánticos ── Independientes del acento. */
  --bien:#43CE84;
  --alerta:#F5C542;
  --danger:#FF6B6B;
  --gold:#F5C542;

  --pelota:#DCF54A;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg);
  color:var(--text);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
#app{max-width:520px;margin:0 auto;padding:0 14px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.02em}

/* ── header ── */
.topbar{position:sticky;top:0;z-index:30;background:var(--t1);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);margin:0 -14px 12px;padding:9px 14px}
.brand{display:flex;align-items:center;gap:8px;justify-content:center}
.brand b{font-size:15px;font-weight:900;letter-spacing:.14em}
/* La pala, no la pelota: es lo que distingue este deporte de un vistazo */
.brand .pala{width:12px;height:16px;border-radius:6px 6px 5px 5px;background:var(--pelota);flex:none;
  box-shadow:inset -2px -1px 0 var(--t2)}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.2em;font-weight:700}

/* ── hud ── */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.hud div{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:5px 4px;text-align:center;min-width:0}
.hud span{display:block;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud b{display:block;font-size:14px;font-weight:800;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── cards ── */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:11px}
.card.pad0{padding:0;overflow:hidden}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--text-2);font-weight:800;text-transform:uppercase}
.title-xl{font-size:29px;line-height:1.05;font-weight:900;letter-spacing:-.035em}
.title-lg{font-size:20px;font-weight:900;letter-spacing:-.02em}
.sub{color:var(--text-2);font-size:14.5px;line-height:1.5}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.hr{height:1px;background:var(--border-soft);margin:12px 0}

/* ── botones ── */
.btn{display:block;width:100%;background:var(--accent);color:var(--sobre-accent);border:0;border-radius:11px;
  padding:13px;font-weight:900;letter-spacing:.05em;font-size:14px;text-align:center;transition:.12s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:disabled{opacity:.3}
.btn.sm{padding:9px;font-size:12.5px;border-radius:9px;min-height:44px}
.btn.danger{background:rgba(239,68,68,.13);color:var(--t3);border:1px solid rgba(239,68,68,.32)}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ── selects / inputs ── */
label.f{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:12px 0 5px;text-transform:uppercase}
input[type=text],select{width:100%;min-height:44px;background:var(--card-bg-2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:11px;font-family:inherit;font-size:15px;outline:none;appearance:none}
input[type=text]:focus,select:focus{border-color:var(--t4)}

/* ── opciones (chips grandes) ── */
.opt{display:flex;gap:11px;align-items:flex-start;min-height:44px;background:var(--card-bg-2);border:1px solid var(--border);
  border-radius:12px;padding:11px 12px;margin-bottom:7px;width:100%;text-align:left;transition:.12s}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--t5);background:var(--t6)}
.opt .ic{font-size:20px;line-height:1.2;flex:none;width:24px;text-align:center}
.opt>span:not(.ic):not(.tier){min-width:0}
.opt .t{display:block;font-weight:800;font-size:14px}
.opt .d{display:block;color:var(--text-2);font-size:12.5px;line-height:1.45;margin-top:2px}
.opt.lock{opacity:.42}

/* ── grids ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

/* ── pills ── */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  padding:3.5px 9px;border-radius:99px;border:1px solid var(--border);color:var(--text-2);text-transform:uppercase}
.pill.indoor,.marca.indoor{color:var(--t7);border-color:rgba(155,135,255,.5);background:rgba(155,135,255,.15)}
.pill.exterior,.marca.exterior{color:var(--t8);border-color:rgba(240,160,60,.5);background:rgba(240,160,60,.15)}
.pill.altura,.marca.altura{color:var(--t9);border-color:rgba(79,195,247,.5);background:rgba(79,195,247,.15)}

/* Marca de pista: cuadrito con el emoji, sin texto */
.marca{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;flex:none;
  border-radius:8px;border:1px solid;font-size:14px;line-height:1}

.leyenda{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.leyenda-t{font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:800;margin-right:1px}
.pill.acc{color:var(--accent);border-color:var(--t10);background:var(--t11)}
.pill.gold{color:var(--gold);border-color:var(--t12);background:var(--t13)}
.pill.mal{color:var(--danger);border-color:var(--t14);background:var(--t15)}

/* ── tier badge ── */
.cod{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:20px;padding:0 5px;
  border-radius:5px;background:var(--t16);border:1px solid var(--border);
  font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--text-2);flex:none}
.tier{font-size:11px;font-weight:900;letter-spacing:.07em;padding:3px 7px;border-radius:6px;flex:none}
.t-F{background:rgba(147,167,188,.16);color:var(--cat-fip)}
.t-S{background:rgba(58,217,143,.16);color:var(--cat-star)}
.t-P{background:rgba(41,182,246,.16);color:var(--cat-plat)}
.t-1{background:rgba(240,117,192,.18);color:var(--cat-p1)}
.t-M{background:var(--t17);color:var(--cat-major)}

/* ── barras stats ── */
.stat{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.stat .n{font-size:11.5px;letter-spacing:.05em;color:var(--text-2);font-weight:800;width:78px;flex:none;text-transform:uppercase}
.stat .bar{flex:1;height:7px;border-radius:99px;background:var(--t6);overflow:hidden;position:relative}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat .bar u{position:absolute;top:-2px;width:2px;height:11px;background:var(--t18)}
.stat .v{width:26px;text-align:right;font-size:12px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.stat .up{color:var(--accent);font-size:11px;font-weight:800;width:26px;flex:none}

/* ── meter ── */
.meter{height:8px;border-radius:99px;background:var(--t6);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:.3s}

/* ── partido ── */
.match{background:var(--card-bg-2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.match .rd{font-size:11px;letter-spacing:.11em;color:var(--muted);font-weight:800;margin-bottom:7px}
.mrow{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.mrow .nm{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.win .nm{font-weight:900}
.mrow.lose .nm{color:var(--muted)}
.mrow .rk{font-size:11.5px;color:var(--muted);font-weight:700;flex:none}
.mrow .sc{display:flex;gap:5px;flex:none}
.mrow .sc s{text-decoration:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;width:13px;text-align:center;color:var(--muted)}
.mrow .sc s.g{font-weight:800;color:var(--text)}
.mrow .dot{width:6px;height:6px;border-radius:50%;flex:none}
.mrow.win .dot{background:var(--accent)}
.mrow.lose .dot{background:transparent}

/* ── log ── */
.log{background:var(--t19);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:13.5px;color:var(--text-2);margin-bottom:7px;line-height:1.55}
.log.bad{border-left-color:var(--danger)}
.log.gold{border-left-color:var(--gold)}

/* ── listas ── */
.li{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .g span{font-size:12px;color:var(--muted)}

/* ── tabs ── */
.tabs{display:flex;gap:5px;margin-bottom:11px}
.tabs button{flex:1;min-height:44px;background:var(--card-bg);border:1px solid var(--border);border-radius:9px;padding:8px 4px;
  font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted)}
.tabs button.on{background:var(--t20);border-color:var(--t21);color:var(--accent)}

/* ── evento ── */
.event-hero{background:linear-gradient(160deg,var(--t20),transparent 65%);border:1px solid var(--t22)}
.event-hero.mal{background:linear-gradient(160deg,rgba(239,68,68,.12),transparent 65%);border-color:rgba(239,68,68,.24)}

/* ── el dado ── */
.dado-card{padding:11px 12px;margin-bottom:10px;border-width:1px}
.dado-card.rodando{border-color:var(--border);background:var(--card-bg-2)}
.dado-card.rodando .dado{color:var(--text-2);animation:tumbo .55s linear infinite}
/* El rombo voltea y el número gira al revés a la vez, para que se lea derecho */
.dado-card.rodando .dado>span{animation:contratumbo .55s linear infinite}
@keyframes tumbo{0%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.09)}100%{transform:rotate(405deg) scale(1)}}
@keyframes contratumbo{0%{transform:rotate(-45deg)}50%{transform:rotate(-225deg)}100%{transform:rotate(-405deg)}}
.dado-card.ok{border-color:rgba(52,199,123,.45);background:rgba(52,199,123,.09)}
.dado-card.ko{border-color:rgba(239,68,68,.42);background:rgba(239,68,68,.09)}
.dado-card.crit-bien{border-color:var(--t23);background:var(--t24)}
.dado-card.crit-mal{border-color:rgba(239,68,68,.75);background:rgba(239,68,68,.16)}
.dado-fila{display:flex;align-items:center;gap:11px}
.dado{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;
  border-radius:10px;transform:rotate(45deg);border:2px solid currentColor;
  font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.dado>*{transform:rotate(-45deg)}
.dado-card.ok .dado{color:var(--bien)} .dado-card.ko .dado{color:var(--danger)}
.dado-card.crit-bien .dado{color:var(--gold)} .dado-card.crit-mal .dado{color:var(--danger)}
.dado-txt{font-size:13.5px;font-weight:800;letter-spacing:.02em;margin-top:2px}

.tirada-info{display:flex;align-items:flex-start;gap:9px;margin-top:7px}
.objetivo{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:30px;flex:none;
  border-radius:8px;border:1.5px solid;font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}

/* ── logros ── */
.ach{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border-soft)}
.ach .ic{font-size:17px;width:24px;text-align:center;flex:none}
.ach.off{opacity:.3}
.ach b{font-size:13px;font-weight:800;display:block}
.ach span{font-size:12px;color:var(--muted)}

/* ── el cuadro del Major ── */
.cuadro{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:7px}
.casilla{aspect-ratio:1;border-radius:11px;border:1px solid var(--border);background:var(--card-bg-2);
  color:var(--muted);font-size:19px;font-weight:800;transition:.14s;display:flex;align-items:center;justify-content:center}
.casilla.activa{border-color:rgba(34,211,165,.42);background:rgba(34,211,165,.08);color:var(--accent)}
.casilla.activa:active{transform:scale(.94)}
.casilla.buena{background:rgba(34,231,75,.16);border-color:rgba(34,231,75,.5);color:#86EFAC}
.casilla.mala{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.5);color:#FCA5A5}
.casilla.revelada{opacity:.45}
.casilla.avisada{border-color:rgba(245,197,66,.55);background:rgba(245,197,66,.12);color:var(--gold)}

/* ── probabilidad de una decisión ── */
.prob{display:flex;align-items:center;gap:8px;margin-top:7px}
.prob .barra{flex:1;height:7px;border-radius:99px;overflow:hidden;display:flex;background:var(--t25)}
.prob .barra i{display:block;height:100%;background:var(--bien)}
.prob .cifra{font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── ficha de partido: el marcador no cuenta un partido de pádel ── */
.fp{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border-soft)}
.fp div{min-width:0}
.fp span{display:block;font-size:10px;letter-spacing:.09em;color:var(--muted);font-weight:800;text-transform:uppercase}
.fp b{display:block;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
.barrared{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:5px;background:var(--t26)}
.barrared i{display:block;height:100%;background:var(--accent)}
.barrared u{display:block;height:100%;background:var(--t27)}

/* ── la pareja ── */
.pareja{display:flex;align-items:center;gap:10px;background:var(--card-bg-2);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px}
.pareja .av{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--t20);border:1px solid var(--border);font-size:18px}
.quimica{height:6px;border-radius:99px;background:var(--t28);overflow:hidden;margin-top:5px}
.quimica i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:.3s}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.fade{animation:f .22s ease-out}
#app.sin-entrada .fade{animation:none}
@media (prefers-reduced-motion: reduce){ .fade{animation:none} .casilla{transition:none} .opt{transition:none} }
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.center{text-align:center}
.mb0{margin-bottom:0}
.tabular{font-variant-numeric:tabular-nums}

/* ── calendario, torneos y premios ── */
.vitrina{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.trofeo{border-radius:10px;padding:8px 3px 6px;text-align:center;min-width:0;border:1px solid var(--border)}
.trofeo span{display:block;font-size:22px;line-height:1.15}
.trofeo b{display:block;font-size:9.5px;letter-spacing:.05em;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trofeo small{display:block;font-size:9.5px;color:var(--muted);font-weight:700}
.fila-premio{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.fila-premio:last-child{border-bottom:0}
.fila-premio b{font-variant-numeric:tabular-nums;text-align:right;font-weight:800}
.fila-premio.oro{color:var(--gold)}
.grupo-cal{font-size:10.5px;letter-spacing:.13em;color:var(--muted);font-weight:800;margin:14px 2px 6px}
.grupo-cal:first-child{margin-top:4px}
.opt .flecha{flex:none;align-self:center;color:var(--muted);font-size:22px;line-height:1}
.opt.hecho{border-color:var(--t29)}
.etapas{display:flex;gap:4px;margin-top:11px}
.etapa{flex:1;min-width:0;text-align:center}
.etapa i{display:block;height:7px;border-radius:99px;background:var(--t30)}
.etapa.ok i{background:var(--accent)} .etapa.ahora i{background:var(--gold)} .etapa.ko i{background:var(--danger)}
.etapa span{display:block;font-size:9.5px;font-weight:800;letter-spacing:.03em;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etapa.ahora span{color:var(--gold)}
.tg{width:50px;height:30px;border-radius:99px;background:var(--t31);position:relative;border:0;flex:none;padding:0}
.tg i{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--t32);transition:left .15s}
.tg.on{background:var(--accent)} .tg.on i{left:24px}
.seg{display:flex;gap:4px;flex:none}
.seg button{min-width:42px;min-height:40px;border-radius:9px;border:1px solid var(--border);background:var(--card-bg-2);color:var(--muted);font-weight:900}
.seg button.on{background:var(--t33);border-color:var(--t4);color:var(--accent)}
kbd{font:inherit;font-size:11.5px;font-weight:800;background:var(--card-bg-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--text)}
.golpe-guia{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.golpe-guia:last-child{border-bottom:0}
.golpe-guia .bola{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px}
.golpe-guia b{display:block;font-size:13.5px}
.golpe-guia span{font-size:12.5px;color:var(--text-2);line-height:1.45}
.confeti{position:relative;overflow:hidden}
.confeti i{position:absolute;top:-14px;width:7px;height:11px;border-radius:2px;opacity:.95;animation:caer 2.6s ease-in forwards;pointer-events:none}
@keyframes caer{to{transform:translateY(380px) rotate(560deg);opacity:0}}
@media (prefers-reduced-motion: reduce){ .confeti i{display:none} }

/* ═══ LA PISTA EN VIVO ═══ */
body.en-pista{overflow:hidden}
#juego{position:fixed;inset:0;z-index:100;background:#051012;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#juego[hidden]{display:none!important}
#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block}
#hudP{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;
  background:rgba(5,18,20,.86);border:1px solid var(--border);border-radius:13px;padding:6px 13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#hudP .eq{display:flex;align-items:center;gap:7px;font-weight:900}
#hudP .nm{font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
#hudP .jg{font-size:21px}
#hudP .pt{font-size:13.5px;color:var(--text);background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;min-width:26px;text-align:center}
#hudP .yo .jg{color:var(--pelota)} #hudP .el .jg{color:#FF8A7A}
#hudP .saca{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
#hudP .saca.on{background:var(--pelota);border-color:var(--pelota)}
#rotuloP{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 50px);left:50%;transform:translateX(-50%);z-index:5;display:none;white-space:nowrap;
  font-size:11px;font-weight:900;letter-spacing:.16em;color:#2a1d00;background:var(--gold);border-radius:99px;padding:4px 12px}
#avisoP{position:absolute;left:50%;top:40%;width:92%;transform:translate(-50%,-50%) scale(.9);z-index:6;text-align:center;pointer-events:none;
  font-size:32px;line-height:1.1;font-weight:900;letter-spacing:-.02em;text-shadow:0 3px 16px rgba(0,0,0,.7);opacity:0;transition:opacity .18s,transform .18s}
#avisoP.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#avisoP small{display:block;width:fit-content;max-width:100%;margin:7px auto 0;padding:4px 11px;border-radius:9px;background:rgba(6,18,16,.74);
  line-height:1.5;font-size:12.5px;letter-spacing:.1em;color:var(--text-2);font-weight:800}
#ayudaP{position:absolute;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 236px);transform:translateX(-50%);z-index:5;width:max-content;max-width:88%;
  background:rgba(5,18,20,.9);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--text);text-align:center;pointer-events:none}
#ayudaP[hidden]{display:none}
#controlesP{position:absolute;inset:0;z-index:4;pointer-events:none}
#joyP{position:absolute;left:18px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 14px);width:128px;height:128px;border-radius:50%;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);pointer-events:auto;touch-action:none}
#joyKnobP{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(220,245,74,.3);border:2px solid rgba(220,245,74,.75)}
#juego .accion{position:absolute;border-radius:50%;border:0;padding:0;font-weight:900;letter-spacing:.03em;pointer-events:auto;touch-action:none;color:#03211A;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1;box-shadow:0 5px 16px rgba(0,0,0,.45);transition:transform .08s,box-shadow .15s}
#juego .accion i{font-style:normal;font-size:19px}
#juego .accion.pulsado{transform:scale(.9);filter:brightness(1.15)}
#juego .accion.sugerido{box-shadow:0 0 0 3px #fff,0 0 20px 6px rgba(255,255,255,.5)}
#bGolpe{right:18px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 12px);width:98px;height:98px;background:var(--pelota);font-size:13.5px}
#juego #bGolpe i{font-size:24px}
#bRemate{right:22px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 122px);width:74px;height:74px;background:var(--t34);font-size:10.5px}
#bGlobo{right:126px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 6px);width:72px;height:72px;background:var(--t35);font-size:10.5px}
#bDejada{right:110px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 94px);width:64px;height:64px;background:var(--t36);font-size:9.5px}
#juego #bDejada i{font-size:16px}
#bPausaP{position:absolute;right:10px;top:max(9px,env(safe-area-inset-top));z-index:6;width:40px;height:40px;border-radius:11px;
  border:1px solid var(--border);background:rgba(5,18,20,.86);color:var(--text);font-weight:900;font-size:14px}
#teclasP{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;font-size:12px;color:var(--muted);white-space:nowrap;display:none}
#pausaP{position:absolute;inset:0;z-index:8;background:rgba(3,12,14,.82);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#pausaP[hidden]{display:none}
#pausaP .caja{width:100%;max-width:420px}
#editorP{position:absolute;left:0;right:0;top:max(10px,env(safe-area-inset-top));z-index:7;padding:0 12px;display:flex;justify-content:center}
#editorP[hidden]{display:none}
#editorP .caja{width:100%;max-width:420px}
#juego.editando .accion,#juego.editando #joyP{outline:2px dashed rgba(255,255,255,.75);outline-offset:4px;cursor:grab}
.seg.ancho{width:100%} .seg.ancho button{flex:1}
.tecla.esperando{border-color:var(--gold);color:var(--gold)}
@media (hover:hover) and (pointer:fine){ #controlesP{display:none} #teclasP{display:block} #ayudaP{bottom:46px} }

/* ── la ráfaga ── */
.barra-rafaga{position:relative;height:58px;border-radius:14px;background:var(--t37);border:1px solid var(--border);overflow:hidden;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}
.barra-rafaga .zona{position:absolute;top:0;bottom:0;background:var(--t38);border-left:2px solid var(--bien);border-right:2px solid var(--bien)}
.barra-rafaga .zona i{position:absolute;top:0;bottom:0;left:35%;width:30%;background:var(--t23)}
.barra-rafaga .cursor{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--pelota);box-shadow:0 0 14px var(--t39)}
.btn.pegar{margin-top:12px;padding:18px;font-size:17px;background:var(--pelota);color:var(--t40);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.chips-rafaga{display:flex;gap:4px;flex:none}
.chips-rafaga .chip{min-width:40px;height:28px;padding:0 6px;border-radius:99px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800}
.chips-rafaga .chip.ahora{border-color:var(--gold)} .chips-rafaga .chip.bien{border-color:var(--t41)}
.chips-rafaga .chip.perfecto{border-color:var(--gold);background:var(--t42)} .chips-rafaga .chip.fuera{border-color:var(--t43)}

/* ── leer al rival ── */
.zonas-leer{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}
.zleer{min-height:104px;border-radius:13px;border:2px solid rgba(255,255,255,.14);background:linear-gradient(180deg,#1F6E57,#17594A);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;font-weight:900;touch-action:manipulation;transition:transform .08s}
.zleer:active{transform:scale(.96)}
.zleer .ic{font-size:24px;line-height:1}
.zleer b{font-size:11.5px;letter-spacing:.06em}
.zleer small{font-size:12px;font-weight:900;color:#DCF54A}
.zleer.top{border-color:rgba(220,245,74,.55)}

/* tus chances, ronda a ronda */
.chances .chance{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 9px;padding:8px 0;border-top:1px solid var(--border)}
.chances .chance:first-child{border-top:0}
.chance .ch-nom{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);min-width:54px}
.chance .ch-riv{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chance .ch-pc{font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.chance .ch-barra{grid-column:1 / 4;height:4px;border-radius:99px;overflow:hidden;background:var(--t44)}
.chance .ch-barra i{display:block;height:100%;background:var(--bien)}
.chance.ahora .ch-nom{color:var(--gold)}
.chance.hecha{opacity:.55}

/* ranking */
.rk-fila{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.card > .rk-fila:first-child{border-top:0}
.rk-fila .rk-n{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.rk-fila .rk-nm{min-width:0;font-size:13px}
.rk-fila .rk-nm small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.rk-fila .rk-pt{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.rk-fila.tu{background:var(--t45);border-radius:10px;padding:8px 6px;border-top-color:transparent}
.rk-fila.tu .rk-n{color:var(--pelota)}
.rk-riv{display:inline-block;font-size:9px;font-weight:900;letter-spacing:.06em;color:var(--t46);border:1px solid rgba(255,138,122,.5);border-radius:6px;padding:0 5px;margin-left:3px;vertical-align:1px}
/* tu jugador */
.muestras{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.muestra{width:28px;height:28px;border-radius:50%;border:2px solid var(--t47);padding:0;cursor:pointer}
.muestra.on{border-color:var(--t32);box-shadow:0 0 0 2px var(--accent)}
.figura-prev{background:rgba(42,100,184,.35);border-radius:14px;padding:6px 8px;flex:none}
/* entrenamiento y celebraciones */
.estrellas{font-size:30px;letter-spacing:4px}
.trofeo-grande{font-size:76px;text-align:center;line-height:1;margin:6px 0 4px;animation:levantar 1.1s cubic-bezier(.2,1.4,.4,1) both,brillo 2.4s ease-in-out 1.1s infinite}
@keyframes levantar{0%{transform:translateY(40px) scale(.4) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes brillo{0%,100%{filter:drop-shadow(0 0 0 rgba(245,197,66,0))}50%{filter:drop-shadow(0 0 18px rgba(245,197,66,.85))}}
@media (prefers-reduced-motion:reduce){.trofeo-grande{animation:none}}

/* ═══════════ COMO EN LA TELE ═══════════ */
:root{ --font-dep:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
/* iconos dentro de títulos, botones y el marcador de arriba (la letra, la de siempre) */
.eyebrow{display:flex;align-items:center;gap:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px}
.hud span{display:flex !important;align-items:center;justify-content:center;gap:3px}
.card{box-shadow:inset 0 1px 0 var(--t48),0 10px 24px var(--t49)}
/* iconos */
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.ico.relleno{fill:currentColor;stroke:none}

.llaves{display:flex;gap:20px;overflow-x:auto;padding:8px 2px 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}

.ll-riv{font:700 11px var(--font-dep);letter-spacing:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.ll-est{margin-top:4px;font:800 14px var(--font-dep)}
.ll-ok{color:var(--bien)} .ll-ko{color:var(--danger)}
.ll-copa{color:var(--gold);font-size:26px;line-height:1}
/* animaciones entre pantallas */
@keyframes entrar{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade > *{animation:entrar .45s cubic-bezier(.2,.9,.3,1) both}
.fade > :nth-child(2){animation-delay:.05s} .fade > :nth-child(3){animation-delay:.1s} .fade > :nth-child(4){animation-delay:.15s}
.fade > :nth-child(5){animation-delay:.2s} .fade > :nth-child(6){animation-delay:.24s} .fade > :nth-child(n+7){animation-delay:.28s}
#app.sin-entrada .fade > *{animation:none}
@keyframes llenar{from{transform:scaleX(0)}}
.meter i,.prob .barra i,.chance .ch-barra i,.barrared i{transform-origin:left center;animation:llenar .9s cubic-bezier(.2,.8,.2,1) .15s both}

.opt,.btn{transition:transform .12s ease,box-shadow .2s ease,filter .2s ease}
.opt:active,.btn:active{transform:scale(.98)}
@media (prefers-reduced-motion: reduce){
  .fade > *,.meter i,.prob .barra i,.chance .ch-barra i,.barrared i,.hero-logo span,.btn.btn-jugar,.carta,.carta-brillo{animation:none !important}
}

  background:repeating-linear-gradient(90deg,var(--t26) 0 1px,transparent 1px 10%),linear-gradient(180deg,var(--t85),var(--t86))}

/* ═══ EL ÍDOLO ═══ */
.idolo-card{border-color:var(--t12);background:linear-gradient(150deg,var(--t100),transparent 55%),var(--card-bg)}

/* ── Portada: accesos rápidos en vez de una lista larga ── */
.acciones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.acceso{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-align:left;
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;min-height:78px;
  color:var(--text);font:inherit;cursor:pointer;transition:border-color .15s, transform .08s}
.acceso:hover{border-color:rgba(214,255,97,.35)}
.acceso:active{transform:scale(.985)}
.acceso .ico{width:19px;height:19px;color:var(--accent);margin-bottom:4px}
.acceso b{font-size:12.5px;font-weight:800;letter-spacing:.06em}
.acceso span{color:var(--muted);font-size:11.5px;line-height:1.3}
/* si el último queda solo, que ocupe toda la fila y se ponga en línea */
.acciones .acceso:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;gap:9px;min-height:0;padding:11px 12px}
.acciones .acceso:last-child:nth-child(odd) .ico{margin:0}

/* ── Desplegables: la letra pequeña, guardada ── */
details.desp{margin-top:10px;border-top:1px solid var(--border);padding-top:9px}

  font-size:11.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
details.desp summary::-webkit-details-marker{display:none}
details.desp summary::after{content:'';width:6px;height:6px;margin-left:auto;flex:none;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s}
details.desp[open] summary::after{transform:rotate(225deg) translate(-2px,-2px)}
details.desp summary:hover{color:var(--text)}
.desp-c{padding-top:5px}

/* ── Volver, arriba a la izquierda ── */
.volver-top{position:absolute;left:12px;top:4px;z-index:2;display:flex;align-items:center;gap:5px;
  background:var(--t37);border:1px solid var(--border);border-radius:11px;color:var(--text);
  padding:6px 10px 6px 8px;font:inherit;font-size:10.5px;font-weight:800;letter-spacing:.09em;cursor:pointer}

.volver-top:hover{border-color:rgba(214,255,97,.35)}
.volver-top:active{transform:scale(.97)}

@media (max-width:400px){ .volver-top span{display:none} .volver-top{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%;left:10px;top:3px} }

/* ── Tema, arriba a la derecha (el espejo de volver) ── */
.tema-top{position:absolute;right:12px;top:4px;z-index:2;display:flex;align-items:center;gap:5px;
  background:var(--t37);border:1px solid var(--border);border-radius:11px;color:var(--text);
  padding:6px 10px 6px 8px;font:inherit;font-size:10.5px;font-weight:800;letter-spacing:.09em;cursor:pointer}
.tema-top .ico{width:14px;height:14px}
.tema-top:active{transform:scale(.97)}
@media (max-width:400px){ .tema-top span{display:none} .tema-top{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%;right:10px;top:3px} }

</style>

'use strict';

const SAVE_KEY = 'cabra_padel_v1';

const ri  = (a,b) => Math.floor(rnd(a,b+1));

/* ═══════════════════════════════════════════════════════════════
   DATOS
   ═══════════════════════════════════════════════════════════════ */

/* Los 21 países hispanohablantes. Cada uno con sus ciudades reales, su altura
   y lo que esa altura o ese clima le deja a alguien que se crió jugando ahí.

const PAISES = [
  {id:'AR', cod:'ARG', nom:'Argentina', pista:'exterior', reg:'sa',

    {n:'Córdoba',        alt:'390 m',   bono:{remate:2, fisico:1},  d:'Pista rápida, calor seco y gente que remata todo lo que sube.'},
    {n:'Rosario',        alt:'25 m',    bono:{volea:2, bandeja:1},  d:'Ciudad de fútbol donde el pádel hay que ganárselo a codazos.'},
    {n:'Mendoza',        alt:'750 m',   bono:{fisico:2, remate:1},  d:'Al pie de la cordillera: piernas, pulmón y aire seco.'},
    {n:'Bariloche',      alt:'890 m',   bono:{bandeja:2, mental:1}, d:'Seis meses bajo techo. Sales con una bandeja de relojero.'},
   ]},
  {id:'BO', cod:'BOL', nom:'Bolivia', pista:'altura', reg:'sa',
   d:'El país más alto del circuito. Acá el globo no existe: la bola se va a la reja sola.',
   ciudades:[
    {n:'La Paz',       alt:'3.600 m', bono:{remate:3, fisico:1},  d:'A 3.600 metros nada bota. Aprendiste a definir arriba porque no había otra.'},
    {n:'Santa Cruz',   alt:'416 m',   bono:{volea:2, fisico:1},   d:'Calor de llanura y pistas rápidas al aire libre.'},
    {n:'Cochabamba',   alt:'2.558 m', bono:{remate:2, bandeja:1}, d:'Valle alto y primavera todo el año: pádel de sol a sol.'},
    {n:'Sucre',        alt:'2.810 m', bono:{mental:2, remate:1},  d:'Ciudad tranquila para una cabeza tranquila.'},
   ]},
  {id:'CL', cod:'CHI', nom:'Chile', pista:'exterior', reg:'sa',

   ciudades:[
    {n:'Santiago',     alt:'570 m',   bono:{pared:2, mental:1},   d:'Smog, cordillera al fondo y clubes llenos a las siete de la mañana.'},

function paisPorId(id){ return PAISES.find(p=>p.id===id) || PAISES[0]; }
function paisDe(j){ return paisPorId(j && j.pais); }
function ciudadesDe(id){ return paisPorId(id).ciudades; }
function ciudadPorNombre(id, n){ const c = ciudadesDe(id); return c.find(x=>x.n===n) || c[0]; }

/* La pista es un rasgo de suma cero, no un regalo: tu mejor pista vale 0 y las
   otras restan. Si no, bastaría con elegir siempre tu pista para acumular
   bonificación gratis toda la carrera. */
for(const e of Object.values(ESTILOS)){
  const tope = Math.max.apply(null, Object.values(e.pista));
  e.pistaRel = {};
  for(const k in e.pista) e.pistaRel[k] = (e.pista[k] - tope) * 0.8;
}

/* La temporada son 4 trimestres. En cada uno eliges UNA gira y se juega entera.
   Cuatro decisiones al año, con peso real: subir de gira antes de tiempo es
   perder en primera ronda; quedarte abajo es ganar torneos que no te suben. */
const TRIMESTRES_POR_ANIO = 4;
/* La perilla que recalibra el juego entero: súbela y la cima se aleja. Está
   calibrada CON la previa puesta, que es lo que de verdad frena a media tabla. */
const ESCALA_RK = 1.34;

/* Si tu país ya tiene una ciudad alta de verdad, se usa esa */
function lugarAltura(j){
  const cs = ciudadesDe((j && j.pais) || CFG.pais);
  const alta = cs.slice().sort((a,b)=>parseAlt(b.alt)-parseAlt(a.alt))[0];
  if(parseAlt(alta.alt) >= 1800) return alta;
  return ALTIPLANO[(j && j.pais) || CFG.pais] || alta;
}
function parseAlt(s){ return parseInt(String(s).replace(/\./g,''),10) || 0; }

/* Puntos → puesto en el ranking FIP. Más plano arriba que en el tenis: en
   pádel hay menos jugadores y la diferencia entre el 1 y el 20 es brutal. */
/* La cima tiene que ser ALCANZABLE. Con la tabla anterior, una temporada
   perfecta —los cuatro Majors, las Finals y media docena de P1— se quedaba en
   el número 4 del mundo, que es absurdo. Estos topes están medidos contra lo
   que de verdad reparte el calendario. */
const TABLA_RK = [[9500,1],[8000,2],[6900,3],[6000,4],[5300,5],[4200,8],[3600,10],[2800,15],
  [2250,20],[1620,30],[1230,40],[970,50],[810,60],[650,75],[560,90],[500,100],[400,125],
  [305,150],[215,200],[172,250],[140,300],[105,400],[80,500],[62,600],[46,750],[34,900],
  [25,1100],[17,1300],[10,1500],[5,1700],[2,1900],[1,2000]];

function rankDePuntos(pts){
  if(pts<1) return null;
  pts = pts / (ESCALA_RK * (esIdolo() ? IDOLO_DUREZA.escala : 1));
  if(pts>=TABLA_RK[0][0]) return 1;          // por encima del tope de la tabla, número 1
  for(let i=0;i<TABLA_RK.length-1;i++){
    const p1=TABLA_RK[i][0], r1=TABLA_RK[i][1], p2=TABLA_RK[i+1][0], r2=TABLA_RK[i+1][1];
    if(pts<=p1 && pts>=p2){
      const t=(Math.log(pts)-Math.log(p2))/(Math.log(p1)-Math.log(p2));
      return Math.max(1, Math.round(r2 + t*(r1-r2)));
    }
  }
  return 2000;
}
/* Puesto → nivel. #1≈95 · #10≈86 · #100≈74 · #1000≈62 */
function ratingDeRank(r){
  if(!r||r>2000) r=2000;
  return 99 - 12.6*Math.log10(r+1);
}
/* Y la inversa: qué puesto del mundo le corresponde a un nivel dado. */
function rankDeNivel(nivel){
  return Math.max(1, Math.round(Math.pow(10, (99-nivel)/12.6) - 1));
}

let S = null;

/* Lo que eliges en la pantalla de creación. Se declara aquí arriba porque el
   género que marques manda sobre los textos de medio juego. */
let CFG = { nombre:'', genero:'M', pais:'ES', ciudad:'Madrid', mano:'D', posicion:'reves',
            estilo:'rematador', pistaFav:'indoor', error:null };

/* Precocidad: cuatro escalones con cola larga. En pádel se madura más tarde
   que en tenis —hay número uno con 35 años— pero el fenómeno existe igual. */
function rollPrecocidad(){
  const u = Math.random();
  if(u > 0.994) return rnd(.85, 1.0);            // 0.6%  — fenómeno generacional
  if(u > 0.964) return rnd(.62, .85);            // 3%    — prodigio
  if(u > 0.854) return rnd(.34, .62);            // 11%   — madura antes de tiempo
  return Math.pow(Math.random(), 1.5) * .34;     // 85.4% — desarrollo normal
}

/* Los tres puntos que antes regalaba la ciudad ahora los da el estilo que
   eliges. Van al segundo, al cuarto y al sexto golpe en importancia para ese
   estilo: son tres puntos de verdad, pero no colocados en lo que más suma, que
   sería empezar más fuerte que antes. Todo el mundo empieza igual. */
function bonoEstilo(est){
  const orden = STAT_KEYS.slice().sort((a, b) => est.pesos[b] - est.pesos[a]);
  const b = {};
  for(const i of [1, 3, 5]) b[orden[i]] = 1;
  return b;
}
function nuevoJugador(cfg){
  const est = ESTILOS[cfg.estilo];
  const ciu = ciudadPorNombre(cfg.pais, cfg.ciudad);
  const posBono = POSICIONES[cfg.posicion].bono;
  // talento: campana entre 0 y 1 → techo bruto (QUÉ TAN BUENO vas a ser)
  const talento = (Math.random()+Math.random())/2;
  // precocidad: independiente del talento → QUÉ TAN PRONTO llegas ahí
  const precocidad = rollPrecocidad();
  const stats = {};
  const ventaja = Math.round(precocidad*10);
  const bonoEst = bonoEstilo(est);
  for(const k of STAT_KEYS) stats[k] = est.base[k] + (bonoEst[k]||0) + (posBono[k]||0) + ri(-2,2) + ventaja + 8;
  const rawBase = STAT_KEYS.reduce((a,k)=>a+stats[k]*est.pesos[k],0);
  const potRaw = 56 + Math.pow(talento, 1.5)*40;
  const factor = potRaw / rawBase;
  const pot = {};
  for(const k of STAT_KEYS) pot[k] = clamp(Math.round(stats[k]*factor + ri(-4,6)), stats[k]+2, 99);
  const j = {
    talento, precocidad,
    nombre: cfg.nombre, genero: cfg.genero || 'M',
    ciudad: cfg.ciudad, pais: cfg.pais, cod: paisPorId(cfg.pais).cod,
    mano: cfg.mano, posicion: cfg.posicion, estilo: cfg.estilo, pistaFav: cfg.pistaFav,
    edad: 17, anio: 1, trimestre: 0,
    stats, pot,
    energia: 100, forma: 0, moral: 62, lesion: null, lesionSem: 0,
    dinero: 2500, 
    puntosHist: [],
    ranking: null, mejorRank: null, rankFin: [],
    titulos: [], finales: 0,
    pj:0, pg:0, pp:0, trimestresTop10:0,
    equipo:{ entrenador:0, fisio:false, psico:false, preparador:false },
    mejoras: [], lujos: [],
    novia: null,
    animo: null,
    sponsor: 0, fama: 0,
    mundial: 0, mundialRonda: 0,
    logros: [],
    rival: nuevoRival(paisPorId(cfg.pais).cod),
    hist: [], retirado: false,
    parejasHist: [],
    wildcards: precocidad>=.60 ? 3 : precocidad>=.34 ? 2 : 1,
  };
  // Tu primera pareja: alguien de tu club, del lado contrario y de tu nivel
  const encaja = Object.keys(ESTILOS).filter(e => ROL_ESTILO[e] !== ROL_ESTILO[cfg.estilo]);
  j.pareja = nuevaPareja(escalar(rawJugador(j)) - rnd(1,4), paisPorId(cfg.pais).cod,
                         posContraria(cfg.posicion), 18,
                         Math.random() < 0.65 ? pick(encaja) : pick(Object.keys(ESTILOS)));
  j.pareja.quimica = 58;
  j.pareja.deClub = true;
  return j;
}
function nuevoRival(cod){
  return { nombre: pick(nombresDePila()) + ' ' + pick(NOM_B),
           flag: cod || 'ESP', pts: 0, titulos: 0, majors: 0, edad: 17, nivel: 44 };
}

/* ═══════════════════════════════════════════════════════════════
   LA PAREJA
   El pádel se juega de dos en dos. Tu compañer@ no es decorado: pesa casi la
   mitad del nivel con el que sales a la pista, se cansa de ti si pierdes y te
   deja por alguien mejor si te estancas. Cambiar de pareja es la decisión más
   grande de una carrera de pádel, y la que más duele.
   ═══════════════════════════════════════════════════════════════ */
const APODOS = ['la Muralla','el Cañón','Manos de Seda','el Reloj','la Víbora','Tornado','el Profe','Chispa',
  'el Muro','Rayo','el Cirujano','Zurdo','Pulpo','el Búho','Mosquito','la Roca','Tanque','Bombardero'];

/* ── COMPLEMENTARIEDAD ──
   La ley no escrita del pádel: una pareja necesita a alguien que cierre el
   punto y a alguien que lo sostenga. Dos rematadores se pisan y no construyen
   nada; dos paredistas defienden toda la tarde sin ganar un punto. Por eso una
   pareja peor sobre el papel puede rendir mucho más que otra mejor: no se
   ficha un nivel, se ficha un encaje. */
const ROL_ESTILO = { rematador:'cierra', voleador:'cierra', paredista:'sostiene', tactico:'sostiene' };
const ROL_NOM    = { cierra:'CIERRA EL PUNTO', sostiene:'SOSTIENE EL PUNTO' };

function complementoPareja(j, pareja){
  const par = pareja || j.pareja;
  if(!par || !par.estilo) return 0;
  const mio = ROL_ESTILO[j.estilo], suyo = ROL_ESTILO[par.estilo];
  if(mio === suyo) return mio === 'cierra' ? -2.2 : -1.8;
  // rematador + paredista es el encaje clásico: el que mata y el que aguanta
  const clasico = (j.estilo==='rematador' && par.estilo==='paredista') ||
                  (j.estilo==='paredista' && par.estilo==='rematador');
  return clasico ? 2.6 : 2.0;
}
function textoComplemento(v){
  if(v >= 2.4) return {t:'ENCAJE PERFECTO',    c:'var(--gold)',   d:'Uno mata y otro aguanta. Es el molde de las buenas parejas.'};
  if(v >= 1.5) return {t:'OS COMPLEMENTÁIS',   c:'var(--bien)',   d:'Uno cierra los puntos y el otro los sostiene.'};
  if(v <= -2)  return {t:'OS PISÁIS',          c:'var(--danger)', d:'Los dos queréis rematar. Nadie construye el punto.'};
  if(v < 0)    return {t:'FALTA QUIEN REMATE', c:'var(--danger)', d:'Defendéis los dos muy bien. Y no ganáis un punto.'};
  return {t:'SIN MÁS', c:'var(--muted)', d:''};
}

function nuevaPareja(nivel, cod, pos, edad, estilo){
  nivel = clamp(nivel, 38, 95);
  if(!estilo) estilo = pick(Object.keys(ESTILOS));
  const real = typeof jugadorRealLibre === 'function' ? jugadorRealLibre(cod, pos, nivel, edad) : null;
  return {
    estilo,
    nombre: real ? real.nombre : pick(nombresDePila()) + ' ' + pick(NOM_B),
    apodo: real ? null : (Math.random()<0.35 ? pick(APODOS) : null),
    real: !!real,
    flag: real ? real.flag : (cod || pick(NAC_RIV)),
    pos: pos || pick(['drive','reves']),
    nivel: Math.round(nivel*10)/10,
    edad: real ? real.edad : (edad || ri(19, 31)),
    quimica: 50,
    anios: 0,
    trimestres: 0,
    deClub: false,
  };
}
function nomPareja(p){ return p ? (p.apodo ? p.nombre + ' «' + p.apodo + '»' : p.nombre) : '—'; }
function posPareja(j){ return j.pareja ? POSICIONES[j.pareja.pos].nom : '—'; }
/* Los dos en el mismo lado no funciona ni un partido */
function parejaDesencajada(j){ return !!j.pareja && j.pareja.pos === j.posicion; }

/* Cuánto vale de verdad tu pareja para el nivel de la dupla */
function aporteDePareja(j){
  if(!j.pareja) return null;
  let n = j.pareja.nivel + edadFactor(j.pareja.edad, 0.25)*0.7;
  if(j.equipo.entrenador >= 2) n += 0.6;     // un buen entrenador también la mejora a ella
  return n;
}
/* La química va de 0 a 100 y vale entre −3 y +3 de nivel */
function bonoQuimica(j){
  if(!j.pareja) return -2;
  const q = j.pareja.quimica;
  let b = (q - 50) / 20;
  if(j.pareja.anios >= 3) b += 0.5;          // los años juntos se notan
  if(j.pareja.anios >= 6) b += 0.4;
  return b;
}
function etiquetaQuimica(q){
  if(q >= 85) return {t:'SE ENTIENDEN SIN MIRARSE', c:'var(--bien)'};
  if(q >= 68) return {t:'BUENA QUÍMICA', c:'var(--accent)'};
  if(q >= 45) return {t:'SE VAN CONOCIENDO', c:'var(--text-2)'};
  if(q >= 28) return {t:'HAY RUIDO', c:'var(--alerta)'};
  return {t:'ESTO SE ROMPE', c:'var(--danger)'};
}
/* Después de cada gira la química se mueve con los resultados */
function moverQuimica(j, d){
  if(!j.pareja) return;
  // con quien encaja se hace química el doble de rápido; con quien no, se pierde
  const c = complementoPareja(j);
  if(d > 0 && c > 0) d *= 1.35;
  if(d < 0 && c < 0) d *= 1.35;
  j.pareja.quimica = clamp(j.pareja.quimica + d, 0, 100);
}

/* ═══════════════════════════════════════════════════════════════
   CÁLCULOS
   ═══════════════════════════════════════════════════════════════ */
/* Como el ranking real: cuentan solo tus mejores resultados recientes. Los
   puntos no se caen de golpe: valen completo cuatro trimestres y luego se
   desinflan. Parar un trimestre cuesta puestos, pero no te hunde de un salto. */
const RESULTADOS_QUE_CUENTAN = 10;
const PESO_ANTIGUEDAD = [1, 1, 1, 1, 0.6, 0.3];
function puntosEn(j, w){
  const vig = [];
  for(const x of j.puntosHist){
    const peso = PESO_ANTIGUEDAD[w - x.w];
    if(peso) vig.push(x.pts * peso);
  }
  vig.sort((a,b)=>b-a);
  return Math.round(vig.slice(0, RESULTADOS_QUE_CUENTAN).reduce((a,b)=>a+b,0));
}
function puntosActuales(j){ return puntosEn(j, j.anio*TRIMESTRES_POR_ANIO + j.trimestre); }
function puntosEnRiesgo(j){
  const w = j.anio*TRIMESTRES_POR_ANIO + j.trimestre;
  return Math.max(0, puntosEn(j, w) - puntosEn(j, w+1));
}
function recalcRank(j){
  j.ranking = rankDePuntos(puntosActuales(j));
  if(j.ranking && (!j.mejorRank || j.ranking < j.mejorRank)) j.mejorRank = j.ranking;
}
function rawJugador(j){
  const est = ESTILOS[j.estilo];
  let r = 0;
  for(const k of STAT_KEYS) r += j.stats[k] * est.pesos[k];
  return r;
}
/* raw 45 (debutante) ≈ #1400 · raw 70 ≈ #16 · raw 86 ≈ #1 */
function escalar(raw){ return 11 + 0.874*raw; }

/* Tu nivel individual, sin contar a tu pareja */
function ratingJugador(j, pista){
  const est = ESTILOS[j.estilo];
  let r = escalar(rawJugador(j));
  r += (est.pistaRel[pista]||0);
  if(j.pistaFav === pista) r += 0.6;
  if(j.mano==='Z' && j.posicion==='drive') r += 0.6;    // zurdo al drive: la volea del medio es tuya
  if(j.mano==='Z' && j.posicion==='reves') r += 0.3;
  r += j.forma * 0.14;
  r += (j.moral - 55) * 0.02;
  r += j.equipo.entrenador * 0.3;
  if(j.equipo.psico) r += 0.4;
  if(tieneMejora(j,'video')) r += 1.2;
  r += bonoEquipo(j);
  if(tieneMejora(j,'palas')) r += 0.8;
  if(j.lesion) r -= 6;
  if(j.animo && j.animo.n > 0) r += j.animo.val;
  return r;
}

/* El nivel con el que sale la DUPLA a la pista. Es lo que decide los partidos:
   tú pesas más que tu pareja, pero no tanto como para llevarla en brazos. */
function ratingDupla(j, pista, ev){
  const mio = ratingJugador(j, pista) + edadFactor(j.edad, j.precocidad) + bonusLocal(j, ev);
  const suyo = aporteDePareja(j);
  let r = suyo == null ? mio - 6 : mio*0.58 + suyo*0.42;
  r += bonoQuimica(j);
  r += complementoPareja(j);            // que uno cierre y otro sostenga vale puntos
  if(parejaDesencajada(j)) r -= 4.5;    // los dos en el mismo lado: no hay manera
  return r;
}

/* Jugar en casa vale: público, pista conocida, cero jet lag */
function bonusLocal(j, ev){ return ev && ev.pais && ev.pais === j.pais ? 2.2 : 0; }
function edadFactor(edad, prec){
  prec = prec || 0;
  if(edad<21) return (-3.1 + (edad-17)*0.8) * (1 - prec);   /* de 17 a 20 se sufre de verdad */
  /* En pádel se aguanta más arriba que en tenis: la pista es chica y la
     experiencia de pared vale tanto como las piernas. */
  const inicioDeclive = 31 - Math.round(prec*2);
  if(edad<=inicioDeclive) return 0;
  const d = edad - inicioDeclive;
  return d<=3 ? -d*0.7 : -2.1 - (d-3)*1.6;
}

/* ═══════════════════════════════════════════════════════════════
   CALENDARIO POR TRIMESTRES
   La temporada son 4 giras, no 30 torneos sueltos. En cada trimestre eliges
   UNA gira y se juega entera de una vez. Así una mala racha se lee como
   "3 torneos, 2-3, cuartos en Vigo" y no como cinco pantallas de derrota.
   ═══════════════════════════════════════════════════════════════ */
function generarTemporada(j){
  return TRIMESTRES.map((tr,i)=>({ idx:i, tr, giras: tr.giras.map(g=>concretarGira(g, j)) }));
}
/* La pista de tu gira de casa: la que elegiste. Las carreras viejas, guardadas
   antes de esto, siguen con la que les puso su país. */
function pistaDeCasa(j){ return (j && j.pistaFav) || paisDe(j).pista; }
function concretarGira(g, j){
  const miPais = paisDe(j);
  const casa = miPais.ciudades.map(c=>c.n);
  const enCasa = g.reg === 'co';
  const pool = enCasa ? casa : ({ sa:SEDES_SA, eu:SEDES_EU, ca:SEDES_CA, as:SEDES_AS, us:SEDES_US }[g.reg] || SEDES_EU);
  const usadas = new Set();
  const torneos = g.torneos.map(t=>{
    if(typeof t === 'object') return Object.assign({}, t);   // torneo con nombre propio
    let c = pick(pool), n = 0;
    while(usadas.has(c) && n++ < 12) c = pick(pool);
    usadas.add(c);
    return { t, nom: nomTier(t) + ' de ' + c, ciudad:c,
             pista: enCasa ? pistaDeCasa(j) : g.pista,
             /* sólo la gira de tu tierra cuenta como casa: así el de un país con
                muchos torneos no juega más veces en casa que los demás */
             pais: enCasa ? miPais.id : null };
  });
  const nom = enCasa ? g.nom.replace('Colombia', miPais.nom) : g.nom;
  const d = enCasa ? (casa.slice(0,3).join(', ') + '. ' + (g.dCasa || 'Duermes en tu casa y compites contra los tuyos.')) : g.d;
  return Object.assign({}, g, {nom, d, pista: enCasa ? pistaDeCasa(j) : g.pista, torneos});
}

/* Un torneo suelto es accesible por ranking; a l@s juveniles les invitan */
function accesibleTorneo(j, ev){
  if(ev.t==='FIN') return !!j.ranking && j.ranking<=8;
  if(ev.t==='FIP1') return true;
  let r = j.ranking || 2000;
  if(j.edad <= 19) r = Math.round(r * 0.5);
  return r <= TIERS[ev.t].acc;
}
function accesible(j, gira){
  if(giraDemasiadoBaja(j, gira)) return false;
  return gira.torneos.some(ev=>puedeJugar(j,ev));
}
/* Si ya estás muy por encima del nivel de la gira, no te aceptan: la FIP no te
   deja entrar a un Promises cuando ya tienes ranking de Platinum. Evita la
   trampa de ganarlo todo abajo sin sumar un punto que valga. */
function giraDemasiadoBaja(j, gira){
  if(!j.ranking) return false;
  const mayor = gira.torneos.map(ev=>ev.t).sort((a,b)=>orden(b)-orden(a))[0];
  /* Los cortes van holgados a propósito. Si te echan de las giras que puedes
     ganar en cuanto asomas la cabeza, te quedas viviendo de previas y no ganas
     un título en toda la carrera: eso no es dificultad, es un callejón. */
  if(mayor === 'FIP1' || mayor === 'FIP2') return j.ranking <= 150;
  if(mayor === 'FIP3' || mayor === 'FIP4') return j.ranking <= 80;
  if(mayor === 'FIP5') return j.ranking <= 35;
  return false;
}
function motivoBloqueo(j, gira){
  if(giraDemasiadoBaja(j, gira)) return 'Ya estás por encima de esta gira';
  const nec = Math.max.apply(null, gira.torneos.map(ev=>TIERS[ev.t].acc===9999?0:TIERS[ev.t].acc));
  return 'Necesitas top ' + (nec || 500);
}
function orden(t){ return ['FIP1','FIP2','FIP3','FIP4','FIP5','P2','P1','MJ','FIN'].indexOf(t); }

/* ═══════════════════════════════════════════════════════════════
   SIMULACIÓN DE PARTIDO · PUNTO A PUNTO

   El pádel no se simula como el tenis. Aquí no hay saques ganadores ni
   winners desde el fondo: el punto lo gana casi siempre quien tiene la red, y
   la red se la quita el que globea mejor. De ahí salen las tres verdades del
   deporte, y el motor las respeta todas:

     · Quien está arriba gana dos de cada tres puntos.
     · La red se recupera con el GLOBO y se conserva con la BANDEJA.
     · El saque casi no vale: se rompe muchísimo más que en tenis.

   Y al llegar a iguales no hay ventajas: se juega un PUNTO DE ORO, uno solo,
   y ahí manda la cabeza.
   ═══════════════════════════════════════════════════════════════ */

/* Las parejas rivales no son todas iguales: cada una juega a algo */
const ARQUETIPOS = [
  {id:'muro',     nom:'globo y paciencia',   globo:1.28, bandeja:1.12, remate:0.80, pared:1.25},
  {id:'red',      nom:'todo a la red',       globo:0.80, bandeja:1.24, remate:1.12, pared:0.85},
  {id:'potencia', nom:'potencia y remate',   globo:0.85, bandeja:0.92, remate:1.38, pared:0.90},
  {id:'zurda',    nom:'zurd@ al drive',      globo:1.06, bandeja:1.06, remate:1.08, pared:1.04},
  {id:'joven',    nom:'jóvenes sin miedo',   globo:0.94, bandeja:0.88, remate:1.28, pared:1.00},
  {id:'veterana', nom:'oficio y colocación', globo:1.22, bandeja:1.20, remate:0.84, pared:1.14},
];

function generarRival(tier, ronda, totalRondas){
  // Cuadros realistas: cada ronda te acerca a las mejores duplas del mundo
  const rangos = {
    FIP1:[[900,2000],[700,1700],[520,1300],[400,1000],[300,760]],
    FIP2:[[600,1500],[470,1200],[360,900],[280,680],[200,500]],
    FIP3:[[250,700],[200,550],[155,420],[115,300],[75,200]],
    FIP4:[[200,560],[160,430],[125,330],[90,235],[58,160]],
    FIP5:[[150,430],[120,330],[92,250],[66,175],[42,118]],
    P2:  [[60,200],[46,150],[33,100],[20,62],[9,36]],
    P1:  [[38,130],[29,92],[20,62],[11,38],[5,20],[1,10]],
    MJ:  [[40,175],[30,110],[22,72],[14,48],[8,29],[3,15],[1,8]],
    FIN: [[1,8],[1,7],[1,5]],
  };
  const tabla = rangos[tier] || rangos.FIP1;
  const rg = tabla[Math.min(ronda, tabla.length-1)];
  return rivalDelCircuito(ri(rg[0], rg[1]));
}

/* Una dupla rival cualquiera, a partir del puesto que ocupa */
function duplaRival(rank){
  const a = pick(nombresDePila())+' '+pick(NOM_B);
  let b = pick(nombresDePila())+' '+pick(NOM_B);
  if(b === a) b = pick(nombresDePila())+' '+pick(NOM_B);
  return {
    nombre: a, nombre2: b,
    flag: pick(NAC_RIV), flag2: pick(NAC_RIV),
    rank,
    arq: pick(ARQUETIPOS),
    rating: ratingDeRank(rank) + rnd(-3.0, 3.0)   // la dupla rival también tiene su día
  };
}

/* ── LA PREVIA ──
   Casi nadie entra directo al cuadro. Por debajo del corte se juega la previa:
   dos partidos el mismo día, el primero a las nueve de la mañana, y si los
   ganas los dos entras al cuadro con las piernas ya gastadas. Es la vida real
   del circuito y la razón por la que subir cuesta tanto. */
const RONDAS_PREVIA = 2;
function rivalDePrevia(ev){
  const acc = TIERS[ev.t].acc === 9999 ? 1200 : TIERS[ev.t].acc;
  return duplaRival(ri(Math.round(acc*0.9), Math.round(acc*4)));
}
/* 'directo', 'previa' o null si ni con previa entras */
function entradaTorneo(j, ev){
  if(accesibleTorneo(j, ev)) return 'directo';
  if(ev.t === 'FIN') return null;                    // a las Finals se entra por ranking
  let r = j.ranking || 2000;
  if(j.edad <= 19) r = Math.round(r * 0.5);
  return r <= TIERS[ev.t].acc * 4 ? 'previa' : null;
}
function puedeJugar(j, ev){ return entradaTorneo(j, ev) !== null; }

/* Cómo se pelea la red: tu globo contra la bandeja del que está arriba */
function pRecuperarRed(globo, bandejaRival){
  return clamp(0.17 + (globo - bandejaRival)*0.0042, 0.05, 0.44);
}

/* Todo lo que hace falta para jugar un punto. Se recalcula cada set, porque la
   energía se va yendo y con ella la bandeja.

   Dos avisos de calibración, que son los que hacen que esto funcione:

   1. La pendiente por punto tiene que ser MUY suave. Un partido son ~110
      puntos: si ganar un punto suelto fuese un 60%, el marcador sería 6-0 6-0
      siempre. Los mejores del mundo ganan el 54% de los puntos, no el 70%.

   2. La ventaja de tener la red es enorme (dos de cada tres puntos), pero no
      puede convertirse en un bonus escondido para quien globea mejor: eso ya
      lo paga el nivel. Así que el castigo de estar abajo se deriva del reparto
      de red esperado, de forma que la media SIEMPRE vuelve al nivel. Lo que
      cambia entre estilos no es cuánto ganas, sino CÓMO: el rematador arrasa
      cuando sube y se hunde cuando no; el paredista vive igual en los dos
      sitios. */
function perfilDupla(j, opp, ev, energia){
  const fatiga = Math.max(0, 58 - energia) * 0.09;
  const miR = ratingDupla(j, ev.pista, ev) - fatiga + difActual().sim;
  const edge = miR - opp.rating;
  const p = clamp(1/(1+Math.pow(10, -edge/45)), 0.30, 0.70);

  /* Los golpes de la dupla son los tuyos mezclados con los de tu pareja: en
     pádel el rival ataca al más flojo de los dos, así que no puedes esconderte. */
  const mezcla = j.pareja ? clamp(0.72 + j.pareja.nivel/240, 0.85, 1.18) : 0.9;
  const s = j.stats;
  const miGlobo   = s.globo   * mezcla;
  const miBandeja = s.bandeja * mezcla;
  const filo      = (s.remate + s.volea)/2 * mezcla;   // lo que haces con la red
  const aguante   = (s.pared  + s.globo)/2 * mezcla;   // lo que haces sin ella

  const base = clamp(opp.rating*1.05 - 10, 30, 95);
  const suGlobo   = base * opp.arq.globo;
  const suBandeja = base * opp.arq.bandeja;

  const miRecupera = pRecuperarRed(miGlobo, suBandeja);
  const suRecupera = pRecuperarRed(suGlobo, miBandeja);
  // cuánta red te toca de media, según quién globea mejor
  const cuotaRed = clamp(miRecupera/(miRecupera + suRecupera), 0.18, 0.82);

  // el que remata saca mucho más de la red; el que defiende sufre menos abajo
  const ventaja = clamp(0.10 + (filo - 55)*0.0022, 0.05, 0.20);
  // …y el castigo de estar abajo sale de la cuota, para que la media sea el nivel
  const castigo = clamp(ventaja * cuotaRed/(1 - cuotaRed) - (aguante - 55)*0.0009, 0.03, 0.30);

  return {
    p, cuotaRed,
    pConRed: clamp(p + ventaja, 0.05, 0.95),
    pSinRed: clamp(p - castigo, 0.05, 0.95),
    miRecupera, suRecupera,
    mental: s.mental,
    // salir de la pista a devolver una bola por 3 o por 4 metros
    // se mide sobre los puntos ganados defendiendo, que son ~1 de cada 4
    pSalida: clamp(0.0015 + (s.pared + s.fisico - 70)/12000, 0.0006, 0.012),
  };
}

/* UN PUNTO.
   Empieza con la red de quien saca —en pádel el que saca sube— y se la van
   disputando a globazos hasta que alguien cierra. */
function jugarPunto(c, saco, esOro){
  let red = saco;
  const disputas = ri(1, 4);            // cuántas veces se pelea la red en el punto
  let salida = false;
  for(let i=0; i<disputas; i++){
    const pRec = red ? c.suRecupera : c.miRecupera;
    if(Math.random() < pRec) red = !red;
  }
  let pw = red ? c.pConRed : c.pSinRed;
  // el punto de oro no se juega igual: no hay red que valga, manda la cabeza
  if(esOro) pw = clamp(pw + (c.mental - 50)*0.002, 0.05, 0.95);
  const gane = Math.random() < pw;
  /* Salir de la pista es la jugada más de pádel que existe, pero no puede ser
     un bonus escondido: es una FORMA de ganar un punto que ya ibas a ganar
     defendiendo, no una ventaja extra. Así el espectáculo no toca el equilibrio. */
  salida = (!red && gane && Math.random() < c.pSalida);
  return { gane, conRed: red, salida };
}

/* UN JUEGO. Cuatro puntos, y si llegan a 3-3 se acabó la discusión:
   PUNTO DE ORO, uno solo, y el que resta elige lado. */
function jugarJuego(c, saco, acc){
  let a = 0, b = 0;
  for(let k = 0; k < 60; k++){
    const esOro = (a === 3 && b === 3);
    const r = jugarPunto(c, saco, esOro);
    acc.puntos++;
    if(r.conRed) acc.puntosConRed++;
    if(r.salida) acc.salidas++;
    if(esOro){ acc.oros.push(r.gane); return { gane:r.gane, oro:true }; }
    if(r.gane) a++; else b++;
    if(a === 4) return { gane:true,  oro:false };
    if(b === 4) return { gane:false, oro:false };
  }
  return { gane: Math.random() < c.p, oro:false };
}

/* UN SET. A seis juegos con dos de diferencia, tie-break en el 6-6. */
function jugarSet(c, saco, acc){
  let jm = 0, js = 0;
  for(let k = 0; k < 90; k++){
    if(jm === 6 && js === 6){
      const gane = jugarTieBreak(c, acc);
      acc.juegos++;
      return { gane, m: gane ? '7-6' : '6-7', saco };
    }
    const g = jugarJuego(c, saco, acc);
    acc.juegos++;
    if(g.gane){ jm++; if(!saco) acc.roturas++; }
    else      { js++; if(saco)  acc.roturasContra++; }
    saco = !saco;
    if(jm >= 6 && jm - js >= 2) return { gane:true,  m: jm+'-'+js, saco };
    if(js >= 6 && js - jm >= 2) return { gane:false, m: jm+'-'+js, saco };
  }
  return { gane: jm >= js, m: jm+'-'+js, saco };
}

function jugarTieBreak(c, acc){
  let a = 0, b = 0, saco = true;
  for(let k = 0; k < 60; k++){
    const r = jugarPunto(c, saco, a>=6 || b>=6);
    acc.puntos++;
    if(r.conRed) acc.puntosConRed++;
    if(r.salida) acc.salidas++;
    if(r.gane) a++; else b++;
    if((a+b) % 2 === 1) saco = !saco;      // en el tie-break se cambia cada dos
    if(a >= 7 && a - b >= 2) return true;
    if(b >= 7 && b - a >= 2) return false;
  }
  return a > b;
}

function simularPartido(j, opp, ev, ronda, totalRondas){
  let energia = ronda>0 ? clamp(j.energia + 3, 0, 100) : j.energia;
  const sets = [];
  const acc = { puntos:0, puntosConRed:0, juegos:0, oros:[], roturas:0, roturasContra:0, salidas:0 };
  let yo = 0, el = 0, lesionEnPartido = false;
  let saco = Math.random() < 0.5;          // el saque se sortea, y casi da igual

  while(yo < 2 && el < 2){                 // en pádel, siempre al mejor de tres
    const juegosAntes = acc.juegos;
    const c = perfilDupla(j, opp, ev, energia);
    const r = jugarSet(c, saco, acc);
    saco = r.saco;
    sets.push(r.m);
    if(r.gane) yo++; else el++;
    /* El desgaste va por juegos disputados, no por sets: un 7-6 machaca y un
       6-1 casi no se nota. Un partido largo de pádel deja el cuerpo hecho. */
    const juegos = acc.juegos - juegosAntes;
    let costo = juegos*0.42 + 0.6 - j.stats.fisico/90;
    if(j.equipo.fisio) costo *= .88;
    if(tieneMejora(j,'nutricion')) costo *= .88;
    energia -= Math.max(2.0, costo);
    if(energia < 32 && Math.random() < 0.033 + (55-j.stats.fisico)/1500) lesionEnPartido = true;
  }
  const red = acc.puntos ? acc.puntosConRed/acc.puntos : 0.5;
  return { gane: yo === 2, sets, oros: acc.oros, energia: clamp(energia,0,100),
           lesionEnPartido, opp, ronda: NOM_RONDA[totalRondas][ronda],
           red, roturas: acc.roturas, roturasContra: acc.roturasContra,
           salidas: acc.salidas, juegos: acc.juegos, puntos: acc.puntos };
}

/* ── PROGRESO DE TU SOMBRA ── */
function avanzarRival(j){
  const r = j.rival;
  r.edad = j.edad;
  const empuje = clamp((ratingJugador(j,'exterior') - r.nivel)*0.18, -1, 2.2);
  r.nivel = clamp(r.nivel + rnd(1.4, 4.2) + empuje + (r.edad>31 ? -3.2 : 0), 40, 92);
  const gan = Math.max(0, Math.round(Math.pow(Math.max(0,r.nivel-46), 2.05) * rnd(.6,1.5) * 0.46));
  r.pts = Math.round(r.pts*0.35 + gan);
  r.rank = rankDePuntos(r.pts);
  if(r.nivel > 62 && Math.random()<0.45) r.titulos += ri(1,2);
  if(r.nivel > 84 && Math.random()<0.22){ r.majors++; r.titulos++; }
}

function nomLogro(l){ return (esF() && l.nF) ? l.nF : l.n; }
function descLogro(l){ return (esF() && l.dF) ? l.dF : l.d; }
function logro(j, id){
  if(j.logros.includes(id)) return null;
  j.logros.push(id);
  return LOGROS.find(l=>l.id===id);
}
function chequearLogros(j, ctx){
  ctx = ctx || {};
  const out = [], add = id => { const l = logro(j, id); if(l) out.push(l); };
  const r = j.ranking, pts = puntosActuales(j);
  if(pts > 0) add('primer_punto');
  if(r){
    if(r<=1000) add('top1000');
    if(r<=500)  add('top500');
    if(r<=250)  add('top250');
    if(r<=150)  add('sale_fip');
    if(r<=100){ add('top100'); if(j.edad<=19) add('top100_teen'); }
    if(r<=50)   add('top50');
    if(r<=20)   add('top20');
    if(r<=10){  add('top10'); if(j.edad<=20) add('top10_teen'); }
    if(r===1)   add('n1');
  }
  if(j.titulos.length) add('primer_titulo');
  for(const t of j.titulos){
    if(orden(t.tier) >= orden('FIP3')) add('star');
    if(t.tier==='FIP5') add('platinum');
    if(t.tier==='P2' || t.tier==='P1' || t.tier==='MJ' || t.tier==='FIN') add('premier');
    if(t.tier==='P1') add('p1');
    if(t.tier==='FIN') add('finals');
    if(t.tier==='MJ'){
      add('major');
      if(t.edad<=20) add('major_teen');
      if(/Qatar/.test(t.nom))  add('mj_qatar');
      if(/Italy/.test(t.nom))  add('mj_italy');
      if(/Roland/.test(t.nom)) add('mj_paris');
      if(/Mexico/.test(t.nom)) add('mj_mexico');
    }
    if(t.pais === j.pais) add('casa');
  }
  const mj = new Set(j.titulos.filter(t=>t.tier==='MJ').map(t=>t.nom));
  if(mj.size >= 4) add('grand_slam');
  const total = patrimonio(j);
  if(total >= 500000)  add('medio_millon');
  if(total >= 1000000) add('millon');
  if(total >= 5000000) add('cincomillon');
  if((j.racha||0) >= 15) add('invicto');
  if(j.pg >= 100) add('p100');
  if(j.pg >= 300) add('p300');
  if(j.pg >= 500) add('p500');
  if((j.orosGanados||0) >= 600) add('oro');
  if((j.orosGanados||0) >= 1500) add('oro1000');
  if((j.salidasPista||0) >= 1) add('salida');
  if((j.salidasPista||0) >= 50) add('salida50');
  if(j.pj >= 150 && (j.puntosTot||0) > 0 && (j.puntosRed||0)/j.puntosTot >= 0.55) add('dueno_red');
  if(j.pareja && j.pareja.anios >= 4) add('pareja_fiel');
  if(j.pareja && j.pareja.quimica >= 95) add('quimica_total');
  if(j.mundial >= 4) add('mundial');
  if(ctx.perfecto)   add('perfecto');
  if(ctx.remontada)  add('remontada');
  if(ctx.batirRival) add('batir_rival');
  if(ctx.mundialCopa) add('mundial_copa');
  if(ctx.parejaTop)  add('pareja_top');
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   EL DADO
   Un d16. La estadística que pide la decisión te BAJA el número que necesitas
   sacar: con Mental 90 te atreves con un 7; con Mental 40, necesitas un 13.
   La pantalla enseña siempre la probabilidad real, así que el número que ves
   nunca puede mentirte.
   ═══════════════════════════════════════════════════════════════ */
const CARAS = 16;
const NOM_RECURSO = { fama:'Fama', moral:'Moral', energia:'Energía', dinero:'Bolsillo',
                      suerte:'Suerte', quimica:'Química' };

/* 50 es el jugador medio del circuito. Cada 8 puntos valen una cara del dado. */
function modificador(v){ return Math.round((v - 50) / 8); }

function valorDe(j, clave){
  if(!clave) return 50;
  if(clave === 'fama')    return clamp(28 + (j.fama||0)/2, 0, 99);
  if(clave === 'moral')   return j.moral;
  if(clave === 'energia') return j.energia;
  if(clave === 'dinero')  return clamp(Math.log10(Math.max(1, j.dinero)) * 16, 0, 99);
  if(clave === 'quimica') return j.pareja ? j.pareja.quimica : 30;
  if(clave === 'suerte')  return 50;                 // pura suerte: sin modificador
  return j.stats[clave] != null ? j.stats[clave] : 50;
}
function objetivoTirada(j, op){
  if(op == null || op.dif == null) return null;
  return clamp(op.dif - modificador(valorDe(j, op.stat)), 2, 16);
}
function probOpcion(j, op){
  const obj = objetivoTirada(j, op);
  return obj == null ? null : (CARAS - obj + 1) / CARAS;
}
/* La tirada se hace UNA sola vez al elegir y queda guardada en S.tirada: si
   f() la consulta dos veces, tiene que dar lo mismo. El 16 natural siempre
   entra y el 1 natural siempre falla, tengas la estadística que tengas. */
function tirarDado(j, op){
  const obj = objetivoTirada(j, op);
  if(obj == null) return null;
  const d = ri(1, CARAS);
  return { d, obj,
    exito:    d === CARAS ? true : d === 1 ? false : d >= obj,
    critBien: d === CARAS,
    critMal:  d === 1 };
}
function saleBien(){ return S.tirada ? S.tirada.exito : true; }

/* ── ÁNIMO ──
   Lo que te llevas al trimestre siguiente. Tiene signo: una buena decisión te
   deja jugando por encima de tu nivel un par de trimestres, y una mala, por
   debajo. */
function marcarAnimo(j, val, n, txt, ic){
  const a = j.animo;
  if(a && a.n > 0 && Math.abs(a.val) > Math.abs(val)) return;   // ya te pesa algo más gordo
  j.animo = { val, n, txt, ic: ic || (val > 0 ? '💚' : '💔') };
}
function textoAnimo(j){
  const a = j.animo;
  if(!a || a.n <= 0) return '';
  const signo = a.val > 0 ? '+' : '';
  return a.ic + ' <b>' + a.txt + '</b> — juegas ' + signo + a.val.toFixed(1)
       + ' en pista, ' + a.n + ' trimestre' + (a.n === 1 ? '' : 's') + ' más.';
}
/* Las opciones arriesgadas resuelven el fallo dentro de su propia f(). Las
   demás declaran solo una frase en 'mal': hicieron lo que decían pero salió
   torcido, y de eso se encarga el motor. */
function aplicarFallo(j, op, tirada){
  if(!tirada || !op.mal) return '';
  if(tirada.exito){
    j.moral = clamp(j.moral + 4, 0, 100);
    marcarAnimo(j, 1.5, 1, txtG(op.animoBien) || 'Te salió redondo', '💚');
    return '';
  }
  j.moral = clamp(j.moral - 9, 0, 100);
  j.forma = clamp(j.forma - 3, -12, 12);
  marcarAnimo(j, -3.5, 1, txtG(op.animoMal) || 'Te salió torcido', '💔');
  return '<br><br>❌ ' + txtG(op.mal);
}
function aplicarCritico(j, tirada){
  if(!tirada) return '';
  if(tirada.critBien){
    const a = j.animo;
    if(a && a.n > 0 && a.val > 0){ a.val += 1.5; a.n += 1; }
    else marcarAnimo(j, 3.5, 2, 'Te sale todo', '🍀');
    j.moral = clamp(j.moral + 8, 0, 100);
    return '<br><br>🎲 <b>16 natural.</b> Salió incluso mejor de lo que esperabas. Te vas al próximo trimestre en racha.';
  }
  if(tirada.critMal){
    const a = j.animo;
    if(a && a.n > 0 && a.val < 0){ a.val -= 1.5; a.n += 1; }
    else marcarAnimo(j, -3.5, 2, 'No levantas cabeza', '💀');
    j.moral = clamp(j.moral - 8, 0, 100);
    return '<br><br>🎲 <b>1 natural.</b> De todas las formas en que podía salir mal, salió la peor. Y te lo llevas puesto.';
  }
  return '';
}

function eventoAleatorio(j){
  j.eventosVistos = j.eventosVistos || [];
  const pool = [];
  for(const e of EVENTOS){
    if(!e.repetible && j.eventosVistos.includes(e.id)) continue;
    if(e.cond && !e.cond(j)) continue;
    for(let i=0;i<(e.peso||3);i++) pool.push(e);
  }
  return pool.length ? pick(pool) : null;
}

/* ── EL MERCADO DE PAREJAS ──
   Se refresca cada trimestre. Quien está mejor clasificad@ que tú pide prima
   y, sobre todo, pide que le sirvas de algo: si tu ranking no acompaña, no
   te coge el teléfono. */
function generarCandidatos(j){
  const miNivel = escalar(rawJugador(j));
  const encajan = Object.keys(ESTILOS).filter(e => ROL_ESTILO[e] !== ROL_ESTILO[j.estilo]);
  const chocan  = Object.keys(ESTILOS).filter(e => ROL_ESTILO[e] === ROL_ESTILO[j.estilo]);
  const out = [];
  /* Cuatro candidat@s con una tensión deliberada: el bueno que no te encaja,
     el que encaja pero es peor, y dos intermedios. Ahí está la decisión. */
  const perfiles = [
    {dn:[-4,-1], edad:[18,22], prima:0,    etq:'PROMESA',          pool:encajan},
    {dn:[0,3],   edad:[23,29], prima:0.35, etq:'DE TU NIVEL',      pool:null},
    {dn:[3,7],   edad:[25,33], prima:1.1,  etq:'POR ENCIMA DE TI', pool:chocan},
    {dn:[1,4],   edad:[21,30], prima:0.6,  etq:'ENCAJA CONTIGO',   pool:encajan},
  ];
  for(const p of perfiles){
    const nivel = miNivel + rnd(p.dn[0], p.dn[1]);
    const estilo = p.pool ? pick(p.pool) : pick(Object.keys(ESTILOS));
    const c = nuevaPareja(nivel, pick(NAC_RIV), posContraria(j.posicion), ri(p.edad[0], p.edad[1]), estilo);
    c.etq = p.etq;
    c.quimicaInicial = clamp(Math.round(rnd(34, 68) - (nivel - miNivel)*1.5), 20, 78);
    c.prima = Math.round(p.prima * (2000 + Math.pow(Math.max(0, nivel-45), 2.4)*38));
    /* Quien está por encima de ti mira tu ranking antes que tu nivel: quiere
       a alguien que ande cerca de su propio puesto, no a quien pueda pagarle. */
    c.exigeRank = (nivel > miNivel + 0.5) ? Math.max(5, Math.round(rankDeNivel(nivel) * 1.6)) : null;
    out.push(c);
  }
  const estrella = candidataEstrella(j);
  if(estrella) out.unshift(estrella);
  return out;
}
function puedeFichar(j, c){
  if(c.prima > j.dinero) return 'No te alcanza la prima';
  if(c.exigeRank && (!j.ranking || j.ranking > c.exigeRank)) return 'Quiere jugar con alguien top ' + c.exigeRank;
  return null;
}

  else if(p==='pretemporada') html += vPretemporada();
  else if(p==='finTemporada') html += vFinTemporada();

  else if(p==='cuadro')       html += vCuadro();
  else if(p==='mercado')      html += vMercado();
  else if(p==='perfil')       html += vPerfil();
  else if(p==='vitrina')      html += vVitrina();
  else if(p==='retiro')       html += vRetiro();
  else if(p==='torneo')       html += vTorneo();
  else if(p==='como')         html += vComo();
  else if(p==='finRapido')    html += vFinRapido();
  else if(p==='momento')      html += vMomento();
  else if(p==='mundial')      html += vMundial();
  else if(p==='ranking')      html += vRanking();
  else if(p==='entreno')      html += vEntreno();
  else if(p==='finEntreno')   html += vFinEntreno();
  else if(p==='carreras')     html += vCarreras();
  else if(p==='mundialSel')   html += vMundialSel();
  else if(p==='desafio')      html += vDesafio();
  else if(p==='idolo')        html += vIdolo();
  html = topbar() + html;
  const app = $('#app');
  app.classList.toggle('sin-entrada', misma);
  app.innerHTML = html;
  if(misma){
    void document.body.offsetHeight;
    window.scrollTo(0, scrollAntes);
  } else {
    window.scrollTo(0, 0);
  }
  animarDado();
  animarMinijuego();
  animarNumeros();
}

  if(S.tirada && S.tirada.rodando){

  }
}

/* Utilidades de pintado compartidas */
function fichaPais(cod){ return `<span class="cod">${esc(cod||'—')}</span>`; }
function pastillaPista(p, extra){
  return `<span class="pill ${p}" ${extra||''}>${PISTA_ICONO[p]||''} ${(PISTA_NOM[p]||'').toUpperCase()}</span>`;
}
function marcaPista(p){ return `<span class="marca ${p}" title="${PISTA_NOM[p]||''}">${PISTA_ICONO[p]||''}</span>`; }
function leyendaPistas(){
  return `<div class="leyenda"><span class="leyenda-t">PISTA</span>` +
    Object.keys(PISTA_NOM).map(k=>pastillaPista(k)).join('') + `</div>`;
}
function etiquetaTier(t){
  return ({FIP1:'PROMISES', FIP2:'RISE', FIP3:'STAR', FIP4:'GOLD', FIP5:'PLATINUM',
           P2:'P2', P1:'P1', MJ:'MAJOR', FIN:'FINALS', MUN:'MUNDIAL'})[t] || t;
}
function etiquetaTorneo(ev){
  if(ev.t === 'MJ' || ev.t === 'FIN') return esc(ev.nom);
  return etiquetaTier(ev.t) + ' ' + esc(ev.ciudad);
}
function barraStat(k, v, pot, delta){
  return `<div class="stat">
    <span class="n">${STAT_NOM[k]}</span>
    <span class="bar"><i style="width:${clamp(v,0,99)}%"></i>${pot?`<u style="left:${clamp(pot,0,99)}%"></u>`:''}</span>
    <span class="v">${Math.round(v)}</span>
    ${delta?`<span class="up">${delta>0?'+'+delta:''}</span>`:''}
  </div>`;
}
/* La tarjeta de tu pareja: aparece en media docena de pantallas */
function tarjetaPareja(j, compacta){
  const p = j.pareja;
  if(!p) return `<div class="pareja"><span class="av">🚫</span><div style="flex:1"><b>Sin pareja</b><div class="muted">No puedes competir sin alguien al otro lado.</div></div></div>`;
  const q = etiquetaQuimica(p.quimica);
  const desencaje = parejaDesencajada(j);
  const comp = complementoPareja(j), enc = textoComplemento(comp);
  return `<div class="pareja">
    <span class="av">${POSICIONES[p.pos].ic}</span>
    <div style="flex:1;min-width:0">
      <b style="font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${fichaPais(p.flag)} ${esc(nomPareja(p))}</b>
      <div class="muted" style="font-size:11.5px">${POSICIONES[p.pos].nom} · ${p.edad} años · nivel ${p.nivel.toFixed(1)}${p.anios?` · ${p.anios} temporada${p.anios>1?'s':''} juntos`:''}</div>
      ${p.estilo?`<div class="muted" style="font-size:11.5px;margin-top:2px">${ESTILOS[p.estilo].ic} ${ESTILOS[p.estilo].nom} · ${ROL_NOM[ROL_ESTILO[p.estilo]]}</div>`:''}
      ${compacta?'':`<div class="quimica"><i style="width:${p.quimica}%"></i></div>
      <div class="muted" style="font-size:11px;margin-top:3px;color:${q.c};font-weight:800;letter-spacing:.05em">${q.t} · ${Math.round(p.quimica)}</div>
      ${p.estilo?`<div style="font-size:11.5px;margin-top:4px;font-weight:800;color:${enc.c}">🧩 ${enc.t} <span class="tabular" style="font-weight:600">(${comp>0?'+':''}${comp.toFixed(1)} de nivel)</span></div>
      ${enc.d?`<div class="muted" style="font-size:11.5px">${enc.d}</div>`:''}`:''}`}
      ${desencaje?`<div style="color:var(--danger);font-weight:800;font-size:11.5px;margin-top:3px">⚠️ L@s dos jugáis en el ${POSICIONES[j.posicion].nom}. −4,5 de nivel.</div>`:''}
    </div>
  </div>`;
}
